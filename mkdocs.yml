# pace-kv — MkDocs site configuration.
#
# Build:   pip install -r docs/requirements.txt && mkdocs build --strict
# Preview: mkdocs serve
#
# The strict flag fails on any broken link, missing nav entry, or
# unresolved snippet. Keeping the prose in lockstep with the code is,
# for now, a manual discipline — there is no automated docs/code check
# wired into CI yet.

# What `--strict` is actually able to fail on.
#
# mkdocs 1.6 defaults `validation.nav.omitted_files` to `info`, so a page added
# under `docs/` and left out of `nav:` was reported at INFO and the build
# SUCCEEDED -- while the comment above, and `.github/workflows/docs.yml`, both
# promised that `--strict` fails on a missing nav entry. Two files stating the
# same wrong thing in almost the same sentence is how it stayed wrong (#560).
#
# `warn` and not `error`: `--strict` is what promotes a warning to a failure, so
# `warn` fails CI exactly as promised while leaving a local `mkdocs serve` usable.
# Spelling `error` here would fail the non-strict build too, which neither comment
# claimed and nobody asked for.
#
# `not_in_nav` exempts the snippets. They are INCLUDED into other pages by
# pymdown-extensions rather than navigated to, so they are correctly absent from
# `nav:` -- without this the change would fail the build on three files that are
# right, which is how a validation flag gets turned back off.
validation:
  nav:
    omitted_files: warn
    not_found: warn

# Sibling of `nav:`, not a `validation:` sub-option -- mkdocs 1.6 rejects it there
# by name, which is how this was found rather than guessed.
not_in_nav: |
  snippets/*

site_name: pace-kv
site_description: A memcached- and Redis-compatible cache daemon, and a portable compile cache
site_author: pace-kv contributors
site_url: https://lastrada-software.github.io/fastcached/
repo_url: https://github.com/LASTRADA-Software/fastcached
edit_uri: edit/master/docs/
copyright: Apache-2.0 licensed. Memcached and Redis are registered trademarks of their respective owners.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.share
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs/snippets
      # A snippet that cannot be found is silently dropped by default, which for
      # a shared table means the page renders fine with the content missing.
      # Fail the (--strict) build instead.
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

