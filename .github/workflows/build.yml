# SPDX-License-Identifier: Apache-2.0
name: Build

# Every checkout that could configure the project passes `fetch-depth: 0`, and
# that is load-bearing rather than habit: the version comes from `git describe`
# (cmake/Version.cmake), and the default depth-1 checkout fetches no tags, so it
# would silently yield the fallback version — and, in the packaging jobs, packages
# named after a release nobody cut. Full history rather than `fetch-tags: true`
# because a build off a branch has to describe against real history, and fetching
# a tag into a depth-1 clone leaves the tagged commit as an unrelated shallow root
# that describe cannot reach. YAML cannot factor a step input out, so the input is
# repeated per job while the reason is stated once, here.
#
# Some of those checkouts are inert and deliberately kept uniform anyway, because
# telling them apart at a glance is not possible and guessing wrong is silent:
# `check-clang-format` only lists and formats files, `docker` builds the version
# inside the image, where .dockerignore excludes .git/ so CMake always takes the
# fallback path, and the smoke jobs download prebuilt binaries instead of
# configuring anything.
#
# Two jobs are the stated exception and pass no fetch-depth at all —
# `check-release-gate` and `release`. Both exist to read this file rather than to
# build it, so history would buy them nothing, and a release must not be able to
# fail on a clone parameter that cannot affect its outcome.
on:
  push:
    branches: [master, "fix-ci"]
    # A release is a numeric triple and nothing else: CMakeLists.txt feeds the tag
    # straight into project(VERSION ...), which rejects anything that is not
    # X.Y.Z — so v0.1.0-rc1 would fail configure in every job and burn a macOS
    # notarization slot before saying so. Encoding the shape here means a mistyped
    # or not-yet-supported tag costs nothing instead of an hour, and it is the one
    # place that records why an rc tag cannot build yet.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # NO `branches:` filter, and its absence is load-bearing rather than an
  # omission. It read `branches: [master]`, which is the **third door** to the
  # never-arrives failure this file already records twice.
  #
  # A pull request whose base is another branch -- which is every layer of a
  # STACKED pull request but the bottom one -- matched no branch, so this workflow
  # produced no check run at all. Not a failing one: none. Every required context
  # then stayed pending forever and the pull request sat at BLOCKED with nothing
  # anywhere saying why, exactly as a `paths-ignore` filter does and exactly as a
  # missing `merge_group:` row does. Measured on #414, #415 and #416: the label
  # workflow reported (it filters no branches) while every build context was
  # simply absent, so the pull request looked like it was waiting on CI that had
  # never been asked to run.
  #
  # Dropping the filter rather than widening it to a branch namespace: a filter
  # that has to be kept in step with how anybody happens to name a branch is a
  # filter that will be wrong again, and the rulebook's answer to exactly this is
  # to gate at the JOB level instead, where a skipped job still REPORTS. That
  # gating is already here -- `scripts/ci-scope.sh` decides it and every job
  # consults it -- so the filter was buying nothing that the jobs do not already
  # decide for themselves.
  pull_request:
  # The merge queue's event, and the whole reason #351 was not a ruleset
  # checkbox. Without this row every required context in this file would simply
  # never report inside a queue, and a queued pull request would sit there
  # forever rather than fail -- the identical never-arrives failure as a
  # `paths-ignore` filter on a required check, arriving through a different door.
  # A queue that enables cleanly and then hangs on a context nothing produces
  # presents as the feature working until the first pull request enters it.
  #
  # `branches:` filters on the queue's BASE ref, so this says the same "only for
  # master" as the `pull_request` row above.
  merge_group:
    branches: [master]

# The floor every job in this file starts from, and it is a REDUCTION rather than
# a grant: without it each job inherits the repository's workflow-permissions
# default, which an administrator can widen for reasons that have nothing to do
# with this workflow. `pr-labels.yml` and `issue-triage.yml` declare
# `permissions: {}`, `docs.yml` declares `contents: read` and
# `merge-group-report.yml` declares `contents: read` + `issues: write` -- FOUR,
# not the three #572 names, `merge-group-report.yml` having arrived with #684.
# This was the one workflow with no floor, which left a reader unable to tell
# whether narrowing is this repository's convention or an option some files
# happen to take.
#
# `contents: read` and nothing else, ENUMERATED from what the jobs do rather than
# copied from a sibling workflow:
#
#   * `actions/checkout` is the only thing 19 of the 21 jobs ask a token for, and
#     it needs `contents: read`.
#   * `actions/cache`, `actions/cache/restore`, `actions/upload-artifact`,
#     `actions/download-artifact` and `hendrikmuhs/ccache-action` reach the cache
#     and artifact services through `ACTIONS_RUNTIME_TOKEN`, which this block does
#     not govern. A too-narrow `permissions:` cannot break them and a wider one
#     would not help them.
#   * `mozilla-actions/sccache-action` lists a public repository's releases, and
#     `codecov/codecov-action` is handed `secrets.CODECOV_TOKEN` explicitly rather
#     than minting an OIDC one -- so neither needs `id-token: write`.
#   * `docker` builds an image and runs it; it pushes to no registry, so no
#     `packages: write`.
#
# The two jobs that need more say so themselves, and that is what keeps the
# exception visible: `clang-tidy` adds `issues: write` for its report step and
# `release` takes `contents: write` to draft the release. A job-level block
# REPLACES this one rather than adding to it -- every scope a job names is the
# whole of what that job gets -- which is also the verification argument for a
# change that cannot be exercised on a pull request. `release` runs only on a tag
# and carries its own exhaustive block, so this floor cannot reach it. Every other
# job in this file runs on a pull request, so a green pull request does exercise
# the narrowing for all of them.

permissions:
  contents: read

concurrency:
  # Inside a queue `github.ref` is the temporary branch
  # `refs/heads/gh-readonly-queue/master/pr-<n>-<sha>`, which is unique per queue
  # entry -- so `cancel-in-progress` cannot make one entry cancel another. That
  # is load-bearing rather than incidental: a group key that collapsed the
  # entries together would cancel the very run the queue is waiting on, and a
  # cancelled required context is not a reported one. Anything that changes this
  # key has to keep queue entries apart.
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # Every ctest invocation in this file, and any added later -- which is the
  # reason it is an environment variable rather than a `--parallel` on each of
  # the four `run:` lines that exist today.
  #
  # Four because that is what a GitHub-hosted runner has (macos-14 has three, and
  # oversubscribing a suite of short single-threaded processes by one costs
  # nothing). Safe because every TEST_CASE is already its own process and the
  # tests that genuinely cannot share -- a daemon, a fixed port -- carry
  # RUN_SERIAL; the fixtures that could not, because they named a scratch
  # directory from a per-process counter, are what `tests/ScratchPath.hpp` fixed.
  # Serial CI is also precisely why that bug survived five times.
  #
  # Measured locally on the full suite: 649s -> 131s at eight jobs.
  CTEST_PARALLEL_LEVEL: 4
  CLANG_TOOLS_VERSION: "22"
  GCC_VERSION: "14"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
  # Read by every packaging job's configure step. ON turns "no reachable tag"
  # from a warning into a configure failure (cmake/Version.cmake), so a silently
  # broken tag fetch fails in the job that would have built the artifact instead
  # of shipping packages named after a release nobody cut. Hardcoding ON would
  # fail every branch and pull-request run, where no tag is reachable by design —
  # hence the expression, and hence it lives here: one value, three consumers,
  # spelled once so they cannot drift apart.
  FASTCACHED_REQUIRE_EXACT_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && 'ON' || 'OFF' }}

# Six jobs below carry, in addition to whatever else gates them,
#
#     (github.event_name != 'push' || github.ref_type != 'branch')
#
# which is spelled once here and repeated per job because YAML cannot factor a
# condition out — the same reason `fetch-depth: 0` is repeated above.
#
# ## What it is for (#559)
#
# A push run on master happens AFTER the merge, so nobody waits on it: cutting a
# job from it is runner-minutes and NOT merge latency, and those are different
# quantities that get quoted for each other. Measured over the six successful
# master push runs of 2026-09-04, a push costs 126.6 raw runner-minutes with a
# 25.1-minute critical path (`clang-tidy`); the six jobs below are 20.8 of those
# minutes and none of them is anywhere near the critical path, so the wall clock
# is unchanged and the saving is 16% of the runner time.
#
# What they have in common is that they write no cache entry any other run can
# read. Master's ccache entries are what every pull request restores from, so a
# job holding one is worth running on push whatever else it does; these six hold
# none. `clang-tidy` is deliberately NOT among them, and not because of its
# cache: after #554 the queue's sweep is diff-scoped, and the soundness argument
# for that is precisely that the master push still sweeps everything.
#
# `check-clang-format` is also deliberately not among them, and it was on the
# ticket's list. It is 0.7 of the 126.6 minutes — half a percent — and it is the
# job carrying the ungated `doc-subject-checks.sh` step, whose whole point (#687)
# is that it runs when other gates say not to. `check-gated-jobs.sh` rule C tests
# that step for a condition naming the scope classifier and would not see one
# naming the event, so the trade is half a percent against a gate the guard
# cannot vouch for. Declined.
#
# ## Why `ref_type` and not `event_name` alone
#
# A tag push IS a push. `release` needs every job in this file, a skipped `needs`
# skips its dependent, and `release`'s `if:` carries no status function — so
# `github.event_name != 'push'` alone would make the draft release silently never
# appear on a tag, with every check green. `scripts/check-gated-jobs.sh` rule D
# asserts this clause is present rather than leaving it to be re-derived.
#
# The `fix-ci` branch is a push to a branch and is trimmed too, deliberately: it
# exists to iterate on CI, and a pull request from it runs everything.

jobs:
  # Two jobs in one, and deliberately so. The clang-format sweep is scope-gated
  # like every other compiler job; the doc-subject checks below are NOT, and that
  # is #687.
  #
  # `name:` is `Check C++ style`, which is one of the contexts the
  # `default-master` ruleset requires. It is a wire constant in every sense that
  # matters: renaming it renames a required context, the ruleset then waits on a
  # name nothing produces, and every branch becomes unmergeable. Do not touch it.
  #
  # ## Why a documentation check lives in a job named for C++ style
  #
  # It has to run where all four of these hold at once, and this is the only job
  # in the file where they do.
  #
  #   * It must not be a NEW job. `check-release-gate` asserts that every job
  #     here appears in `release.needs`, so a new one gates the release too --
  #     which is the constraint `merge-queue-contexts` documents and the reason
  #     the clang-tidy job reports through a STEP rather than a sibling job.
  #   * It must report on `pull_request` AND on `merge_group`, or it is the
  #     never-arrives failure this file already records three times.
  #   * It must actually GATE. A doc check in an unrequired job is #684 -- a
  #     failure reported nowhere, on a pull request that merges green -- and
  #     fixing #687 by reintroducing #684 one file over is not a fix. Reporting
  #     and gating are different properties and this needs the second.
  #   * And it must run when `code=false`, because a docs-only change is the one
  #     change these checks exist to catch and the one they were never run on.
  #
  # So the job's own condition is now just `!cancelled()` and the scope gate moved
  # onto the clang-format steps -- exactly the shape `linux`, `windows` and
  # `macos` already use, for the same reason: the job must report under its real
  # name whatever the classifier said, and the steps decide whether any work
  # happens. What changes for a docs-only pull request is that this context now
  # reports success or FAILURE where it used to report `skipped`, and a skipped
  # required context is read by the ruleset as passing.
  #
  # Measured on this tree: the three doc-subject checks cost 0.94 s wall clock
  # together, so what a docs-only run now pays is one runner start.
  check-clang-format:
    name: "Check C++ style"
    runs-on: ubuntu-24.04
    needs: changes
    # `!cancelled()` alone, so a FAILED `changes` cannot skip this job before its
    # steps are consulted -- and so the doc-subject step below runs on the
    # docs-only pull requests the classifier answers `code=false` for.
    if: ${{ !cancelled() }}
    steps:
      # Ungated: both halves of this job need the tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The doc-subject checks run FIRST and unconditionally. First because they
      # cost under a second and installing clang-format costs a minute, so on a
      # docs-only run the job answers without ever reaching the download.
      #
      # `scripts/doc-subject-checks.sh` derives what to run from the `docs-subject`
      # ctest label in `src/tests/CMakeLists.txt` and refuses when that scan
      # matches nothing -- a doc-check step that runs zero checks reports green,
      # which is #687 one level up. Its verdicts are driven by
      # `ctest -R doc-subject-checks-selftest`; that this step is UNGATED is
      # asserted by `ctest -R gated-jobs-fail-safe`, because gating it is the
      # whole defect.
      - name: "Doc-subject checks (#687: these run on docs-only changes too)"
        # `bash <path>`, never a bare path, and the reason is not only the file
        # mode. This step SHIPPED bare and CI reported `Check C++ style` --  a
        # required context -- as FAILED, on step 3 of 5, with the two
        # clang-format steps skipped behind it: `Permission denied`, exit **126**,
        # reproduced locally against the same mode and the same invocation
        # ([#723](https://github.com/LASTRADA-Software/fastcached/issues/723),
        # and [#720](https://github.com/LASTRADA-Software/fastcached/issues/720)
        # for the mode across fourteen scripts).
        #
        # The mode is now 755, so the bare form would work -- and naming the
        # interpreter anyway is the part that keeps holding. A call that fails to
        # START fails for reasons a chmod does not cover: a moved file, a `noexec`
        # mount, a lost mode bit. In a `want-fail` assertion that error is
        # indistinguishable from the rule firing, which is how eight cases in this
        # branch's own self-test passed while the check never ran once.
        run: bash scripts/doc-subject-checks.sh

      # The rulebook's `## Open work` entries must name OPEN issues, resolved
      # against the API (#957).
      #
      # **In THIS job, and ungated**, for the reason the block above gives: the
      # step's own `name:` is not a context, but this job's is -- `Check C++ style`
      # is required by the `default-master` ruleset -- so a failure here gates.
      # Reporting without gating is #684, and fixing one ticket by reintroducing
      # another is not a fix.
      #
      # ## Why ctest cannot carry it
      #
      # `rulebook-open-work-state` is in the default ctest set and SKIPS there: its
      # `--resolve` half needs the API, has no token in a build job, and exits 77
      # (`SKIP_RETURN_CODE`). Measured on master's own run `34064703351` --
      # `***Skipped 0.19 sec` -- while that tree carried a stale entry naming #174.
      # Twice in one day a pull request closed its ticket and left the entry
      # standing (#723, then #174); both reached master under a GREEN run, and both
      # were caught by a human running ctest locally with `gh` authenticated. A
      # guard whose coverage depends on who happens to hold a token is not a guard.
      #
      # The skip itself is CORRECT and stays: without it ctest scores a missing
      # prerequisite as a FAILURE, a false red on a constrained runner, and whoever
      # meets it deletes the skip rather than suspecting the registration (#499).
      # What was wrong is that the prerequisite was missing on the one machine whose
      # verdict gates master. This supplies it.
      - name: "Check the rulebook's open-work entries still name open issues"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        # 77 is the script's "could not resolve" exit, and here it is a FAILURE
        # rather than a skip -- on purpose. In ctest a missing prerequisite must skip
        # (#499); on the machine whose verdict gates master, a guard that could not
        # run is the thing this step exists to stop being silent. Named, so it is not
        # a bare 77 nobody can read.
        run: |
          set +e
          # On a pull request, ALSO judge the entries against what this pull request
          # closes (#1016). An entry naming an issue this branch closes is true right
          # now and stale the moment it merges, so master goes red on a change that
          # passed every check -- three times in one day. `--pr` is the only moment
          # that state is visible, and it is invisible on push, where the flag is
          # correctly absent.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-rulebook-open-work.sh --resolve --pr "${{ github.event.pull_request.number }}"
          else
            bash scripts/check-rulebook-open-work.sh --resolve
          fi
          rc=$?
          set -e
          if [ "$rc" -eq 77 ]; then
            echo "::error::the rulebook open-work check could not reach the issue API, so it verified NOTHING."
            echo "::error::That is not a pass. It skips in ctest by design (#499); here it must not be silent (#957)."
            exit 1
          fi
          exit "$rc"

      # The closing-keyword check used to be a step HERE, and moved to
      # `.github/workflows/pr-body.yml` in #1045. It reads the pull request BODY, so
      # its only remedy is editing the body -- and this workflow's `pull_request:`
      # trigger carries no `types:`, so it does not fire on `edited`. The refusal was
      # therefore unclearable by the one action it advised: the context stayed red
      # with the defect already fixed, until an unrelated push.
      #
      # It is NOT gone and it is still required -- it reports under its own context
      # now, which also stops a body failure presenting as a `Check C++ style`
      # failure with clang-format skipped beneath it. Adding `edited` here instead
      # would have re-run the whole matrix for a prose edit.

      # The one formatter build, from the one place it is stated: `.clang-format-version`
      # declares a PyPI release by its banner, and `--requirement` derives the pip
      # requirement from it, so this step restates no version (#1407). Never apt.llvm.org:
      # that source pins a major and ships rolling snapshots under it, so the build this job
      # judged with changed whenever the mirror did (#1349).
      #
      # Into a venv of its own, because the runner's system python is
      # externally-managed (PEP 668) and refuses a plain `pip install`; the venv's bin/ goes
      # on PATH because the format-on-edit hook's rule -- the declared build among every
      # clang-format on PATH -- is what the formatting step below resolves by.
      - name: "Install the declared clang-format"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          set -euo pipefail
          requirement="$(bash scripts/check-clang-format-version.sh --requirement "$GITHUB_WORKSPACE")"
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --disable-pip-version-check "$requirement"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"
      # The installed build is the one `.clang-format-version` declares -- asserted
      # here, the one job that installs the formatter, so every green run proves the
      # declaration the format-on-edit hook and `local-gate.sh` write by. BEFORE the
      # formatting step, so a disagreement is named rather than arriving as a diff.
      - name: "Check the installed clang-format is the declared build"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          bash scripts/run-check.sh scripts/check-clang-format-version.sh --installed "$RUNNER_TEMP/clang-format/bin/clang-format" "$GITHUB_WORKSPACE"
      # The formatter is RESOLVED the way `local-gate.sh` resolves it -- the declared
      # build among every clang-format on PATH, which on this runner includes the
      # image's own -- so this job exercises the gate's choice rather than a path the
      # gate never takes.
      - name: "Run clang-format"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          formatter="$(bash scripts/check-clang-format-version.sh --resolve "$GITHUB_WORKSPACE")"
          echo "formatting with $formatter"
          git ls-files '*.h' '*.hpp' '*.cpp' \
            | xargs "$formatter" --dry-run --Werror --style=file

      # Here rather than only as a ctest, because this is the one job that installs
      # the pinned clang-format. Registered as a ctest too, where it SKIPS on a host
      # without that formatter -- and every build leg is such a host, so the ctest
      # alone would mean the check never actually ran anywhere (#1135).
      #
      # `bash <path>`, never a bare path: inside a check that can refuse, a failure to
      # START is indistinguishable from the rule firing.
      - name: "Check the windows.h include category"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          bash scripts/run-check.sh scripts/check-windows-header-order.sh "$GITHUB_WORKSPACE"
          bash scripts/run-check.sh scripts/check-windows-header-order.sh --self-test "$GITHUB_WORKSPACE"

  # The release job gates on every other job in this workflow, and that list is
  # hand-written. This is what keeps it honest — and it runs on every push and
  # pull request, not only on a tag: the mistake it catches (adding a job and
  # forgetting to gate the release on it) is made in a pull request, so a check
  # that could only fail during a release would report it an hour late, after the
  # tag was already pushed. `check-release-gate` is itself a row in
  # `release.needs`, so this job's own failure stops a release too.
  #
  # No fetch-depth: 0 — this reads one file out of the checkout and configures
  # nothing, so it needs no tags and no history.
  check-release-gate:
    name: "Check the release gate covers every job"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Assert every job in this workflow gates the release"
        run: |
          set -euo pipefail
          # yq is preinstalled on the ubuntu-24.04 image. If it ever is not, that
          # must fail here: a check that silently skips verifies nothing.
          command -v yq >/dev/null || { echo "::error::yq is required to verify the release gate"; exit 1; }
          workflow=.github/workflows/build.yml
          yq '.jobs | keys | .[]' "$workflow" | grep -vx release | sort > "$RUNNER_TEMP/jobs.txt"
          yq '.jobs.release.needs[]' "$workflow" | sort > "$RUNNER_TEMP/gates.txt"
          missing="$(comm -23 "$RUNNER_TEMP/jobs.txt" "$RUNNER_TEMP/gates.txt")"
          if [[ -n "$missing" ]]; then
            echo "::error::these jobs do not gate the release; add them to release.needs:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < "$RUNNER_TEMP/jobs.txt") sibling jobs gate this release"

  # What this change can affect, decided once and read by every job below.
  #
  # A pull request touching only `docs/`, `.agent/` or a `*.md` runs no compiler
  # here — but it must still REPORT every required check, and that is the whole
  # difficulty. Master is protected by a ruleset (`default-master`, active). A
  # required context that never reports leaves the pull request waiting on it
  # forever.
  #
  # WHICH contexts those are is `RequiredContexts` in
  # `scripts/check-merge-queue-contexts.sh` and is deliberately not listed here.
  # This comment used to enumerate them, and the list silently went stale when
  # `clang-asan-ubsan` and `clang-tsan` were promoted (#408, #629) — a stale LIST
  # is worse than a stale count, because it reads as complete and a reader
  # checking a leg against it concludes the leg is unrequired.
  #
  # So this is deliberately NOT `on: paths-ignore`. That filter stops the
  # workflow from triggering at all, no check run is ever created, and "slow"
  # becomes "unmergeable". A job-level `if:` is a different mechanism: the job is
  # created and reports a `skipped` conclusion, which a required check accepts.
  #
  # Note also `strict_required_status_checks_policy: true` on that ruleset —
  # branches must be up to date before merging. Every merge therefore puts every
  # other open pull request behind and forces a rebase and a full re-run, so the
  # matrix is not paid once per pull request but once per pull request per merge
  # that lands while it is open. That multiplier is the larger half of why this
  # job exists.
  #
  # The classification lives in `scripts/ci-scope.sh` rather than inline, so it is
  # testable without a runner (`ctest -R ci-scope`) and so the path table is one
  # list rather than a YAML glob nobody can exercise. Every way of not knowing --
  # an unresolvable ref, a failed diff, an empty diff, a path matching no row --
  # resolves to `code=true`, for the reason `scripts/tidy-sweep.sh` states about
  # its own base ref: "we could not tell what changed" must never read as
  # "nothing did".
  changes:
    name: "Decide what this change can affect"
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the classifier diffs against the merge base, which a
          # depth-1 clone does not contain.
          fetch-depth: 0

      # One arm per event, and `merge_group` has its own rather than falling
      # through, because it reached the right answer here by accident and an
      # accidentally-correct behaviour is one refactor away from being an
      # accidentally-wrong one (#351).
      - id: classify
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
              ;;
            merge_group)
              # A merge candidate builds everything, deliberately.
              #
              # It COULD be scoped: `merge_group.base_sha...head_sha` is a real
              # diff and this script would classify it. Two reasons not to.
              #
              # A batched group is built on top of the entries ahead of it, so a
              # documentation-only entry stacked behind a code entry has a
              # docs-only diff of its own -- scoping there means reasoning about
              # a batch shape GitHub chooses and can change.
              #
              # And the saving is not the one this queue was added for. The
              # churn #351 measured is the RE-runs forced on every other open
              # branch by `strict_required_status_checks_policy`, not the single
              # run that lands a change. Trading the queue's one guarantee --
              # that what merges is what was tested, against the head it lands on
              # -- for at most one matrix per merged pull request is a bad price.
              echo "merge candidate ${{ github.event.merge_group.head_ref }}: building everything, by design (#351)" >&2
              echo "code=true" | tee -a "$GITHUB_OUTPUT"
              ;;
            *)
              # A push or a tag has no pull-request base to diff against, and
              # inventing one would be guessing. Those events build everything,
              # which is also what makes the `release` job safe: on a tag nothing
              # below is ever skipped.
              echo "not a pull request (${{ github.event_name }}); building everything" >&2
              echo "code=true" | tee -a "$GITHUB_OUTPUT"
              ;;
          esac

  # The `-arm64` leg exists for #1432: SHA-256's ARMv8 engine and its detection are
  # compiled and run only where a leg builds them, and a detection branch no leg
  # compiles rots with nothing to say so. A matrix ROW, not a job, for
  # `check-release-gate`'s reason; `suffix` is empty on the x86 rows, so their context
  # names -- which are REQUIRED -- do not move. `sha256Engine` is what the runner's CPU
  # is known to offer: GitHub's arm64 runners are Neoverse cores with SHA2, while its
  # x86 runners are a mix with and without SHA-NI, so an x86 row states nothing.
  linux:
    name: "Linux-${{ matrix.preset }}${{ matrix.suffix }}"
    runs-on: ${{ matrix.runner }}
    needs: changes
    # A job-level condition on a MATRIX job is the shape #300 warns about, and
    # this is the one form of it that is safe: `!cancelled()` is false only while
    # the RUN is being cancelled, so the matrix always expands and every leg
    # reports under its real name. It is here so that a FAILED `changes` cannot
    # skip this job -- which, being a matrix, would take its per-leg required
    # contexts out of existence entirely. The step conditions below still decide
    # whether any work happens.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-release, gcc-release]
        runner: [ubuntu-24.04]
        include:
          - preset: gcc-release
            runner: ubuntu-24.04-arm
            suffix: "-arm64"
            sha256Engine: arm-sha2
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.code != 'false' }}
        with:
          fetch-depth: 0

      # Restored by EVERY leg and saved by one per key (#1540), and the key does not
      # name the leg: CPM's cache holds sources, which do not depend on the machine,
      # so the arm64 leg reads what its x86 sibling wrote rather than storing the
      # same tree a second time. `Save CPM packages` below is the other half, and
      # `scripts/check-gated-jobs.sh` rule F is what says each key has one writer --
      # a combined `actions/cache` step here would be every leg saving one key at
      # once, which is #318.
      #
      # Sharing needs one VERSION as well as one key: actions/cache hashes it from
      # `path:` as the runner expanded it plus the compression it chose, and the
      # `windows` job is where that fails. Here both runners expand the path to
      # `/home/runner/work/fastcached/fastcached/.cache/CPM` (run 35340951724), the
      # x86 leg is seen restoring zstd, and the arm64 image LISTS zstd -- nobody has
      # yet seen that leg restore this entry. If it always misses, the second
      # premise has failed and this job takes the `windows` job's shape.
      - name: "Restore CPM packages"
        id: cpm-cache
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-${{ matrix.preset }}-

      # `save` on a branch push and nowhere else, and this is the canonical
      # statement of that clause — every other `ccache-action` step in this file
      # repeats the same expression and points back here. YAML cannot factor a
      # step input out, so the value is repeated and the reason is stated once,
      # exactly as `fetch-depth: 0` is at the top of this file.
      # `scripts/check-gated-jobs.sh` rule E asserts no step omits it.
      #
      # ## Why a pull-request run must not save
      #
      # The action appends a timestamp to the key, so every run that saves
      # writes a NEW entry rather than updating one, and a pull-request run's
      # entry is scoped to its own ref. Nothing outside that pull request can
      # ever read it — and, measured, neither can the pull request.
      #
      # MEASURED on run 33941494414 (`claude/corrupt-store-diagnostics-633`, a
      # branch pushed more than once), 2026-09-05T03:35Z, under six lanes of
      # contention: **all seven of its ccache restores came from
      # `refs/heads/master`, and not one from the pull request's own scope**,
      # while that scope held 1.118 GB across 6 entries its earlier runs had
      # written. The restore-key prefix matches many entries and the newest
      # wins; master writes a fresh entry on every merge, so at this
      # repository's merge rate master's is always newer than the branch's own
      # earlier push. Corroborating, from the same window: only 37 ccache
      # entries were alive at all and the oldest was 71 minutes old, so every
      # key that branch's PREVIOUS run had restored was already evicted.
      #
      # So the pull-request write is not a trade of iteration hits against
      # storage — #558 was right to refuse to price it blind, and the price is
      # zero. It is eviction pressure on the master entries that every run,
      # including the writer's own, actually reads back. The repository was at
      # 12.87 GB against GitHub's 10 GB cap when this was measured.
      #
      # ## And why `ref_type`, not `event_name` alone
      #
      # A tag push is a push. `event_name == 'push'` alone therefore saves on a
      # release tag too, into a `refs/tags/v*` scope nothing can ever read —
      # a full set of entries per release, for nothing. Same clause #559 needed
      # one level up, for the opposite reason: there a tag must not be skipped,
      # here it must not save.
      - name: "ccache"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.preset }}${{ matrix.suffix }}
          max-size: 256M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      # libssl-dev + openssl: TLS is built and tested (the tls-smoke CTest uses
      # the openssl CLI) in every platform job, not a dedicated one.
      - name: "Install build tools"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      # Through `ci-install-clang.sh`, which says WHICH KIND of failure it was (#1566).
      # Four bare commands here reported a DNS outage as "clang-tsan failed", sending a
      # reader to the sanitizer and the source tree for a network fault. Not a retry:
      # a blind one would make the instrument's own failures vanish unrecorded.
      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        if: ${{ needs.changes.outputs.code != 'false' && (startsWith(matrix.preset, 'clang')) }}
        run: bash scripts/ci-install-clang.sh --version ${{ env.CLANG_TOOLS_VERSION }}

      - name: "Install GCC ${{ env.GCC_VERSION }}"
        if: ${{ needs.changes.outputs.code != 'false' && (startsWith(matrix.preset, 'gcc')) }}
        run: |
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          sudo ln -sf /usr/bin/gcc-${{ env.GCC_VERSION }} /usr/local/bin/gcc
          sudo ln -sf /usr/bin/g++-${{ env.GCC_VERSION }} /usr/local/bin/g++

      # Benchmarks on so pace-bench is compiled rather than only ever built
      # by hand from bench/inproc_bench.py. It is not installed and runs no test
      # — this is purely so a refactor of CacheEngine, LruMode or
      # InMemoryLruStorage cannot silently rot a target nothing else compiles.
      #
      # The test client is on for exactly the same reason, and it is why that
      # reason is worth stating twice: it is also default-OFF, no job built it,
      # and it had silently stopped compiling on POSIX altogether — send and
      # recv undeclared, a shell-string popen, and a `store` hardcoded to MSVC
      # flags (issue #84). A target nothing compiles is a target that rots, and
      # that is what it looks like when nobody notices.
      - name: "Configure"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: >-
          cmake --preset ${{ matrix.preset }} -DFASTCACHED_ENABLE_TLS=ON
          -DFASTCACHED_BUILD_BENCHMARKS=ON -DFASTCACHED_BUILD_TESTCLIENT=ON

      # The x86 leg of each preset saves; the arm64 leg, the one row naming a
      # `suffix`, only restores. Everything the combined step's post-job save
      # checked is still here: it ran only where the restore ran, only on a miss
      # of the exact key -- `cache-hit` is 'true' for an exact hit and nothing
      # else, and is left EMPTY rather than 'false' on a total miss, so the test
      # is `!= 'true'` -- and only on success, which an `if:` naming no status
      # function still means.
      # The one difference is WHEN: right after `Configure`, where CPM's sources
      # are complete, so a red test no longer costs the next run its sources.
      #
      # The key is spelled out rather than taken from `cache-primary-key`: rule F
      # resolves a key from its text, and a step output is a per-leg value it
      # cannot compare.
      - name: "Save CPM packages"
        if: ${{ needs.changes.outputs.code != 'false' && matrix.suffix == '' && steps.cpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

      - name: "Build"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: cmake --build --preset ${{ matrix.preset }}

      # Empty on a row that states no engine, which the test reads as "not stated".
      - name: "Test"
        if: ${{ needs.changes.outputs.code != 'false' }}
        env:
          FASTCACHED_EXPECT_SHA256_ENGINE: ${{ matrix.sha256Engine }}
        run: ctest --preset ${{ matrix.preset }}

      # The binaries the smoke jobs drive: the daemon every job starts, the launcher
      # the compile-cache smoke job points at it, and `mid-compile-edit-stub`, the
      # compiler that saves a file during one launcher invocation for that job's
      # case 11 (#1650) -- which FAILS without it rather than skipping. They share a
      # parent directory, so the artifact keeps them side by side at its root. The
      # stub rides here rather than being built in the smoke job because this job
      # already builds every target, and the smoke job has no build tree to build in.
      - name: "Upload Linux binaries for the smoke jobs"
        if: ${{ needs.changes.outputs.code != 'false' && (matrix.preset == 'clang-release') }}
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-linux
          path: |
            out/build/clang-release/target/pace-kv
            out/build/clang-release/target/pace-cc
            out/build/clang-release/target/mid-compile-edit-stub
          retention-days: 1
          if-no-files-found: error

  # clang-tidy and the sanitizer suite used to be ONE job, and that job was the
  # entire critical path: 28.6 minutes of a 28.6-minute workflow, because it
  # built more than any other job, ran clang-tidy on every translation unit, and
  # only then ran the full ctest. They are two questions with two answers, so
  # they are two jobs that run at the same time.
  #
  # Caching the build harder was not the fix, and the measurement is worth
  # keeping: on run 33243524509 ccache reported 535 hits out of 592 cacheable
  # calls — 90.4% — and the build step still took 23.8 minutes. **A ccache hit
  # does not skip clang-tidy.** CMake wires the analyser in through
  # `cmake -E __run_co_compile`, which runs the compiler (behind its launcher)
  # and the analyser as two independent commands, so a replayed object buys the
  # compile back and not one second of the analysis. The only way to pay less
  # tidy is to tidy fewer translation units.
  #
  # So this job no longer builds at all. It configures — which is all a compile
  # database needs — and hands the database to `scripts/tidy-sweep.sh`, which
  # sweeps the changed translation units plus every one that transitively
  # includes a changed header. A PUSH — master, `fix-ci` or a tag — is the one
  # event that sweeps everything, and since #554 it is the ONLY one: a pull
  # request and a merge-queue entry both diff-scope, each against its own base.
  # Which base, and why the union still covers master, is at the `Sweep` step.
  # Nightly is deliberately not a third trigger: every push to master already
  # sweeps in full, and a `schedule:` on this workflow would run all twenty jobs
  # to re-answer a question the merge just answered.
  clang-tidy:
    name: "clang-tidy"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # `issues: write` for the report step at the bottom, and stated HERE rather
    # than at the top of the file so it reaches one job. A job-level block is
    # exhaustive — every scope not named drops to none — so `contents: read` is
    # what `actions/checkout` needs and the two together are the whole list.
    #
    # The reporting could not be a job of its own: `check-release-gate` asserts
    # that every job in this file appears in `release.needs`, and a job that is
    # SKIPPED on a tag push (which a push-failure notifier is, always) skips
    # `release` with it. That is the never-arrives failure this file records three
    # ways, aimed at the release instead of at a required context — so the report
    # is a step inside the job whose failure it reports, which also lets it read
    # `steps.sweep.conclusion` rather than the whole job's result.
    permissions:
      contents: read
      issues: write
    steps:
      # fetch-depth: 0 is load-bearing here for a second reason beyond the one at
      # the top of this file: the sweep diffs against a base it must be able to
      # resolve, and a base it cannot resolve escalates it to a full sweep. Two
      # bases since #554 — the pull request's base BRANCH, and a queue entry's
      # `merge_group.base_sha`, a bare COMMIT. The second is what makes the depth
      # matter rather than merely help: a shallow clone of
      # `gh-readonly-queue/master/pr-N-<sha>` would not contain that commit, and
      # the escalation would then hide the regression as a permanently full sweep
      # in the queue — the cost this change exists to remove, restored silently.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # **The one writer of this key.** `clang-asan-ubsan` and `clang-tsan` configure
      # the same preset and RESTORE it: the entry holds CPM source, which is identical
      # whatever sanitizer follows, so a second entry would cost the repository's 10 GB
      # budget twice and a second WRITER costs a wasted archive upload on every
      # `CMakeLists.txt` change (#318). A job that wants this key reads it here.
      #
      # What that costs, stated rather than left to be found: `actions/cache` declares
      # `post-if: "success()"`, so the save runs only when THIS job passes. On a run
      # where clang-tidy fails and `CMakeLists.txt` changed, the key now goes unwritten
      # where the second writer might have filled it. That is the abnormal case, the
      # readers still fall back through `restore-keys` to the previous entry, and the
      # next green run saves -- against a wasted upload on every such run, paid by the
      # two slowest Linux jobs, in the normal case.
      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-debug-

      # No ccache: this job compiles nothing. Restoring and re-uploading a
      # quarter-gigabyte cache to produce a compile database would cost more than
      # the configure it is meant to help.
      - name: "Install build tools"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev

      # The COMPILER only. The analyser is not apt's `clang-tidy-<major>` any more: that name
      # installs whichever snapshot apt.llvm.org holds that day, every snapshot prints the
      # same `--version` banner, and two of them disagreed on 19 findings in one file
      # (#1198). The next step installs the build `.clang-tidy-version` declares (#1404).
      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        run: bash scripts/ci-install-clang.sh --version ${{ env.CLANG_TOOLS_VERSION }}

      # The one analyser build, from the one place it is stated: `.clang-tidy-version` names
      # a PyPI release, which is immutable, and `--requirement` prints it so this step
      # restates no version. `--installed` then IDENTIFIES what was installed -- the wheel's
      # METADATA says the declared version and its RECORD holds the binary's sha256 -- so a
      # green sweep below is a statement about that build and no other. `--target` keeps the
      # binary inside the wheel's own tree, where it finds its resource headers. The crashes
      # that build is KNOWN to have are then asserted against it, so the release that fixes one
      # goes red here, naming the workaround it retires (#1410).
      - name: "Install the declared clang-tidy"
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/clang-tidy"
          python3 -m pip install --no-deps --target "$site" "$(bash scripts/check-clang-tidy-version.sh --requirement "$GITHUB_WORKSPACE")"
          tidy="$(bash scripts/check-clang-tidy-version.sh --locate "$site" "$GITHUB_WORKSPACE")"
          bash scripts/run-check.sh scripts/check-clang-tidy-version.sh --installed "$tidy" "$GITHUB_WORKSPACE"
          bash scripts/run-check.sh scripts/check-clang-tidy-known-defects.sh --installed "$tidy" "$GITHUB_WORKSPACE"
          echo "CLANG_TIDY_BIN=$tidy" >> "$GITHUB_ENV"

      # TLS on so the TlsSocket/TlsContext sources are also clang-tidy-checked,
      # and benchmarks on for the same reason: pace-bench is first-party
      # source, so "fix clang-tidy at the source" has to apply to it too, and
      # this is the only job that runs clang-tidy at all.
      #
      # The test client likewise, and here it matters most: three of the five
      # errors that made issue #84 were clang-tidy findings rather than compile
      # failures, so this is the only job in the workflow that can see them.
      #
      # ENABLE_TIDY=OFF because nothing is built here — the preset's
      # CMAKE_CXX_CLANG_TIDY would be inert, and leaving it on would say this job
      # tidies through the build when it does not.
      #
      # CMAKE_CXX_SCAN_FOR_MODULES=OFF is NOT optional and NOT redundant. A
      # module-scanning generator writes `@…modmap` flags into the database that
      # do not exist until the target has been built, so every translation unit
      # fails to parse and reports nothing — a clean sweep that checked no code.
      # CompileCache.cmake turns the scan off by itself, but only when it picks a
      # launcher, and this job installs no ccache for it to pick.
      - name: "Configure"
        run: >-
          cmake --preset clang-debug -DENABLE_TIDY=OFF
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON
          -DFASTCACHED_BUILD_BENCHMARKS=ON -DFASTCACHED_BUILD_TESTCLIENT=ON

      # Which translation units the sweep picks is the part of it that can fail
      # SILENTLY: it has no output of its own to be wrong in, it just sweeps too
      # few files and prints a confident count. So it is asserted, against a
      # synthetic tree, before it is trusted — the same reason the sweep itself
      # canaries its binary before believing a clean result.
      - name: "Self-test the sweep's scope computation"
        run: scripts/tidy-sweep.sh --self-test

      # WHICH events diff-scope and which base each one uses is `CiScopeTable` in
      # `scripts/tidy-sweep.sh`, and `--ci` is this step consulting it. It used to
      # be two GitHub expressions here composed with the shell inside the script,
      # so answering "what happens on event X" meant composing two languages, and
      # nothing stated the mapping (#570). The table is driven by
      # `scripts/tidy-sweep.sh --self-test`, which the step above already runs.
      # The reader's `if:` below is a third per-event expression and stays where
      # it is: it decides who is TOLD, not how wide the analysis is.
      #
      # So this step hands over the three FACTS its context holds and restates none
      # of the decision. `GITHUB_EVENT_NAME` and `GITHUB_BASE_REF` are already in
      # every step's environment; the queue's base commit is not, which is the one
      # value below.
      #
      # Why that is sound, what it costs and what it buys are one bullet in
      # *What CI costs* in `.agent/rules/build-and-toolchain.md` -- pointed at
      # rather than summarised, because the last two figures written down in this
      # file went stale while reading as current fact. What is here is only what a
      # reader AT THIS STEP cannot get from there.
      #
      # `fetch-depth: 0` above is what makes a queue entry's base RESOLVE. The base
      # there is a bare COMMIT (`merge_group.base_sha`, the head of the entry ahead
      # of this one, not master), and a shallow clone of
      # `gh-readonly-queue/master/pr-N-<sha>` would not contain it. `tidy-sweep.sh`
      # escalates a base it cannot resolve to a full sweep -- `ci-scope.sh`'s own
      # principle -- so the depth going missing would hide the regression as a
      # permanently full sweep in the queue, the cost #554 exists to remove,
      # restored silently.
      #
      # That covers the absent and the malformed, and it is deliberately not the
      # stronger claim, because the script has a second exit: a base that resolves
      # but whose diff holds no source prints `no source changed` and exits 0,
      # having analysed nothing. That is CORRECT for what reaches it here -- a
      # docs-only entry has nothing to tidy, exactly as its own pull-request run
      # found -- but it is the one direction that does not escalate, so a future
      # change to the table has to be judged against it rather than against the
      # resolve check.
      #
      # This does NOT contradict the `changes` job's refusal to scope a queue
      # entry, which stands. That job decides whether a JOB RUNS AT ALL, where a
      # wrong answer is a required context reporting green over code nothing
      # compiled, and its stated reason is that it will not reason about a batch
      # shape GitHub chooses. This decides how WIDE one analysis is, over a tree
      # that is being fully built either way, and the only way of being wrong about
      # the batch shape that this step can PRODUCE is a base it cannot resolve,
      # which escalates. Not the general claim that being wrong escalates -- the
      # paragraph above says exactly where that stops holding.
      - name: "Sweep"
        id: sweep
        env:
          # The binary the install step identified. The sweep checks it again itself, so a
          # TIDY that somehow names another analyser refuses rather than sweeps.
          TIDY: ${{ env.CLANG_TIDY_BIN }}
          DB: out/build/clang-debug
          # The queue entry's own base commit -- the head of the entry ahead of
          # this one. Empty on every other event, which is what `CiScopeTable`'s
          # `origin/master` fallback is for. A FACT, not a decision: whether it is
          # read at all is the table's answer.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: scripts/tidy-sweep.sh --ci

      # The step above is now the only full sweep, and a master push blocks nothing
      # and reaches nobody — measured three ways, recorded in the same rulebook
      # bullet. A check nobody reads is a check that does not exist, so moving one
      # onto that path means putting a reader on it.
      #
      # `steps.sweep.conclusion` rather than the job's `failure()`, and that is the
      # difference between a signal and a thing people mute: over the sampled runs
      # `failure()` alone fires 18 times and this fires none. The margin is in the
      # rulebook bullet with the sample that produced it; what belongs here is that
      # the discriminator is the STEP. `failure()` itself is NOT redundant and must
      # not be removed — it is the status function that lets the step run at all
      # after a failed one.
      #
      # `refs/heads/master` because `on: push` also carries `fix-ci`, which exists
      # for deliberately breaking CI, and the release tags, where `--all` running
      # green is not news.
      #
      # One OPEN issue, updated by comment rather than replaced — a fresh issue per
      # push is the same noise problem in another medium. The lookup is
      # `--state open`, so this is deliberately not "reopened": a report somebody
      # closed is not found, and the next failure opens a fresh one. That is the
      # wanted behaviour — a closed report means the finding was dealt with, and a
      # later failure is later news — but it is the opposite of what the word
      # "reopen" would promise, and commenting on a closed issue does not reopen it
      # anyway. Found by its TITLE, which
      # both the lookup and the create read out of the step's own `TITLE` env var,
      # so they cannot drift apart without one edit changing both. Not by a label
      # of its own:
      # `CONTRIBUTING.md` enumerates the label prefixes this repository uses and
      # there is no room in it for a private one, so a `ci/…` key would be a label
      # every documented filter is blind to.
      #
      # `status/needs-triage` is applied HERE rather than left to
      # `issue-triage.yml`, which cannot see this issue at all: an issue opened
      # with `GITHUB_TOKEN` triggers no workflow, so the repository's one
      # reader-attachment mechanism does not fire and the report would land
      # outside every triage query — a reader put on it in name only.
      - name: "Report a full sweep that only master saw"
        if: ${{ failure() && steps.sweep.conclusion == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Stated rather than inferred from the checkout's remote, which is how
          # `issue-triage.yml` does it and is one `working-directory` away from
          # resolving to nothing.
          GH_REPO: ${{ github.repository }}
          TITLE: "clang-tidy: the full sweep on master is failing"
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The full \`clang-tidy\` sweep failed on the master push for \`${GITHUB_SHA}\`.

          ${run_url}

          The merge queue diff-scopes this sweep, so the master push is the only
          place a finding outside a change's include closure is seen — which is
          almost always the analyser drifting rather than any one change. Nothing
          is blocked by this, and the next pull request whose change escalates to a
          full sweep will fail for a reason that has nothing to do with it."
          # NOT `--search`, and that is the whole reason this lists and matches by
          # title rather than searching for the title. `--search` goes through
          # GitHub's issue search INDEX, which lags creation by seconds to minutes
          # — so two master pushes failing inside that window would each find
          # nothing and each open an issue, which is the noise this step exists to
          # avoid. A plain `gh issue list` reads the repository's issue connection
          # directly rather than the index, so the second push sees what the first
          # just opened.
          #
          # That connection is GRAPHQL — `gh issue list` is not a REST call, which
          # this comment claimed until the error message said otherwise. It does
          # not change the consistency argument, which is about the index and not
          # about the transport, but it is a different rate-limit budget from the
          # `gh api` calls elsewhere in this repository and a reader chasing a
          # failure here should know which one it spends.
          #
          # It lists every OPEN issue and is deliberately NOT narrowed by the
          # labels this step applies. Narrowing by them was the first shape and it
          # made the dedup depend on labels nobody promised to keep — this step
          # invites a human to touch them by applying `status/needs-triage`, and a
          # triager re-areaing the report (clang-tidy drift is arguably not
          # `area/build`) would make the next failure miss the open issue and open
          # a second one. The exact title decides it; the labels are for the
          # humans. 161 open issues today against a 500 cap, and when the listing
          # comes back AT the cap it says so rather than silently vouching for a
          # set it did not see.
          #
          # `$ENV.TITLE` rather than the title spliced into the jq program, so no
          # quoting in a title anyone rewords later can turn the lookup into a
          # syntax error and every later failure into a second issue.
          # Through the shared reporter (#724), not a hand-rolled listing. It is
          # the only caller in this tree that treats a FAILED query as distinct
          # from one that found nothing, and that checks the response SHAPE
          # before drawing a conclusion from it -- this copy had the cap warning
          # and neither of the other two.
          printf '%s\n' "$body" > "${RUNNER_TEMP}/tidy-report.md"
          bash scripts/ci-report-issue.sh "$TITLE" "${RUNNER_TEMP}/tidy-report.md" \
            type/bug area/build status/needs-triage

  # The other half of what used to be the clang-tidy job. The ctest run here is
  # load-bearing and is the reason this job exists rather than the tidy job
  # simply losing its build: the `clang-debug` preset is the only configuration
  # in this workflow with ASan and UBSan on, so this is the project's entire
  # sanitizer coverage. It moved; it did not go.
  #
  # It keeps the `clang-debug` preset rather than switching to `clang-asan-ubsan`
  # (which the job is NAMED after) because that preset does not set
  # PEDANTIC_COMPILER_WERROR, and trading the sanitizer job's warnings-as-errors
  # for a tidier preset name is not a trade. `-DENABLE_TIDY=OFF` is the only
  # difference from what this job used to be.
  # The analyser leg for the `_WIN32` half of this tree.
  #
  # `clang-tidy` above runs on `ubuntu-24.04`, so six translation units wholly
  # inside `#if defined(_WIN32)` preprocess to nothing there and are read by no
  # analyser this project runs
  # ([#858](https://github.com/LASTRADA-Software/fastcached/issues/858)).
  #
  # **This closes six of eleven, not eleven.** The other five are behind
  # `#if defined(__APPLE__)` and need a macOS leg; `scripts/tidy-blind-spots.txt`
  # names them and the check prints the remainder, so a green run here cannot read
  # as "the hole is closed".
  #
  # A STANDALONE job rather than a leg of the `windows` matrix, deliberately. A
  # skipped matrix job never expands, so its per-leg contexts never exist and
  # nothing reports -- which hangs a queued pull request rather than failing it. A
  # standalone job skips and REPORTS, which reads as passing, so it carries
  # `!cancelled()` and a real verdict rather than a dependency-driven skip.
  #
  # `clangcl-debug` rather than `cl-debug`: `tidy-sweep.sh` drives clang-tidy off
  # the compile database, and a database written by `clang-cl` is one clang-tidy
  # can parse -- argv[0] is a cl-style driver it recognises. An MSVC database
  # would need a driver mode it has to be told about and MSVC intrinsics it does
  # not implement.
  clang-tidy-windows:
    name: "clang-tidy-windows"
    runs-on: windows-2025
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # `issues: write` for the reader at the bottom, `contents: read` for checkout.
    # A job-level block is exhaustive -- every scope not named drops to none -- so
    # these two are the whole list.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The sweep computes its scope from a diff, so it needs history.
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/CPM
          key: cpm-windows-clangcl-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: cpm-windows-clangcl-

      - name: "Install ninja"
        run: choco install ninja --no-progress

      - name: "Setup MSVC dev environment"
        # For the Windows SDK headers and libraries. `clang-cl` needs them exactly
        # as `cl` does; what differs is the compiler, not the platform headers.
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Install LLVM (the clang-cl that writes the database)"
        # The COMPILER, at the same RELEASE `.clang-tidy-version` declares for the analyser,
        # so the database and the analyser agree about what a flag means. It used to be
        # `${CLANG_TOOLS_VERSION}.1.0` for both, which made this leg judge with 22.1.0 while
        # the Linux leg judged with a 22.1.8 snapshot -- two analysers behind one required
        # pair of contexts. The analyser itself comes from the next step (#1404).
        shell: bash
        run: |
          set -euo pipefail
          requirement="$(bash scripts/check-clang-tidy-version.sh --requirement "$GITHUB_WORKSPACE")"
          choco install llvm --version="${requirement#*==}" --no-progress --allow-downgrade
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

      # The analyser: the same PyPI release the Linux leg installs, identified the same way --
      # METADATA version and RECORD sha256 -- before anything is swept, so a mismatch names
      # itself rather than surfacing as findings that differ from the Linux leg's.
      - name: "Install the declared clang-tidy"
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/clang-tidy"
          python -m pip install --no-deps --target "$site" "$(bash scripts/check-clang-tidy-version.sh --requirement "$GITHUB_WORKSPACE")"
          tidy="$(bash scripts/check-clang-tidy-version.sh --locate "$site" "$GITHUB_WORKSPACE")"
          bash scripts/run-check.sh scripts/check-clang-tidy-version.sh --installed "$tidy" "$GITHUB_WORKSPACE"
          bash scripts/run-check.sh scripts/check-clang-tidy-known-defects.sh --installed "$tidy" "$GITHUB_WORKSPACE"
          "$tidy" --version
          clang-cl --version
          echo "CLANG_TIDY_BIN=$tidy" >> "$GITHUB_ENV"

      - name: "Configure"
        run: >-
          cmake --preset clangcl-debug -DENABLE_TIDY=OFF
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON
          -DFASTCACHED_BUILD_BENCHMARKS=ON -DFASTCACHED_BUILD_TESTCLIENT=ON

      - name: "Self-test the sweep's scope computation"
        shell: bash
        run: bash scripts/tidy-sweep.sh --self-test

      - name: "Sweep"
        id: sweep
        shell: bash
        env:
          TIDY: ${{ env.CLANG_TIDY_BIN }}
          DB: out/build/clangcl-debug
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Leg scope = ticket scope = check scope, from ONE table. The units this
          # leg covers are the rows `scripts/tidy-blind-spots.txt` says it
          # reaches, so what is swept and what the coverage check measures cannot
          # drift apart -- they are the same data. Their count is the notice below
          # and is not written here: a row added to the table changes it.
          only="$(mktemp)"
          grep -v '^[[:space:]]*#' scripts/tidy-blind-spots.txt | grep . \
            | awk -F'\t' '$2 ~ /clang-tidy-windows/ { print $1 }' > "$only"
          echo "::notice title=clang-tidy-windows scope::$(wc -l < "$only") unit(s), from scripts/tidy-blind-spots.txt"

          # What this leg does NOT cover, stated on every run. A narrowing nobody
          # can see is worse than none: whoever reads a green here must know what
          # is not behind it.
          echo "NOT covered by this leg, deliberately:"
          echo "  * _WIN32 REGIONS inside files Linux already analyses -- #873."
          echo "    This leg sweeps whole files, and the coverage check measures"
          echo "    whole-unit emptiness, so neither can see a guarded region."
          echo "  * findings that differ only because MSVC's standard library"
          echo "    differs -- #874. Those units ARE analysed on Linux; a second"
          echo "    analysis of shared code does not converge, which is why it is"
          echo "    a decision rather than a backlog."
          echo "  * the five __APPLE__ units -- they need a macOS leg (#858)."

          bash scripts/tidy-sweep.sh "--only=$only"

      # The same reader the Linux leg has, and a SECOND COPY on purpose.
      #
      # A master push blocks nothing here either -- this leg is unrequired -- so
      # without a reader it fails and reaches nobody, which is #684 exactly.
      # `steps.sweep.conclusion` rather than the job's `failure()`: the job fails
      # for every unrelated infrastructure reason, and a job-keyed alarm is one
      # people mute.
      #
      # **This duplication has an expiry, not a note: #872.** It is a PREREQUISITE
      # for the macOS leg, because a third copy is not acceptable and the macOS leg
      # is already planned for the five `__APPLE__` units. There is no
      # `.github/actions/`, no `workflow_call` and no local `uses: ./` in this
      # repository today, so factoring it out means either restructuring the
      # required `clang-tidy` job or introducing a composite action as the first of
      # its kind -- neither of which belongs in a change whose leg had never
      # successfully run.
      - name: "Report a Windows sweep that only master saw"
        if: ${{ failure() && steps.sweep.conclusion == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "clang-tidy-windows: the Windows sweep on master is failing"
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The \`clang-tidy-windows\` sweep failed on the master push for \`${GITHUB_SHA}\`.

          ${run_url}

          This leg reads the six \`_WIN32\` units that no other analyser sees. It is
          UNREQUIRED, so nothing is blocked by this — which is exactly why it needs
          a reader rather than a red square nobody is obliged to look at.

          It does not cover \`_WIN32\` regions inside files Linux analyses (#873),
          findings that differ only because MSVC's standard library differs (#874),
          or the five \`__APPLE__\` units (#858)."
          # Through the shared reporter (#724). This copy had NONE of its three
          # properties: no `--limit` at all, so it took `gh`'s default of 30; the
          # title spliced straight into the jq program, which the sibling
          # reporter's own comment warns turns a reworded title into a syntax
          # error and then into a silent "no match"; and `head -1` over a
          # `--search`, whose INDEX lags, so a just-opened issue is not found and
          # a second one is opened.
          printf '%s\n' "$body" > "${RUNNER_TEMP}/tidy-windows-report.md"
          bash scripts/ci-report-issue.sh "$TITLE" "${RUNNER_TEMP}/tidy-windows-report.md" \
            status/needs-triage

  clang-asan-ubsan:
    name: "clang-asan-ubsan"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `cache/restore`, not `cache`: clang-tidy above SAVES this key and this job
      # reads it. Sharing the key is right -- the entry holds CPM SOURCE, identical
      # whatever sanitizer is applied afterwards, and a second entry would spend the
      # repository's 10 GB budget on a duplicate. Two WRITERS is the part that was
      # wrong: on any run where `CMakeLists.txt` changed, both jobs missed, both
      # fetched every package, and whichever finished second found the key taken and
      # discarded an archive it had already paid to build and upload (#318). That is
      # the two slowest Linux jobs, on every push to such a branch.
      #
      # `clang-tsan` had already declined to become a third writer and its comment
      # names clang-tidy as the saver, so this restores what that comment already
      # assumed was true.
      - name: "Cache CPM packages"
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-debug-

      # 1G, not the 256M every other job uses, and the difference is measured
      # rather than guessed: on run 33243524509 this configuration ended at
      # 99.76% of a 256M cache having run **44 cleanups**, so it was evicting its
      # own objects inside a single build. A Debug build with ASan and UBSan
      # produces far larger objects than the Release jobs, which finished at
      # 69.7% full with zero cleanups and are therefore left alone. 1G rather
      # than 2G because the whole repository shares a 10 GB Actions cache budget
      # with the CPM and sccache entries, and `Cleanups` in the step below is
      # what says whether it is enough.
      #
      # `save` on a branch push only — the reason is on the `linux` job's step,
      # and this was the first place in the file to carry it. It is also what
      # makes 1G affordable: at a gigabyte per saved entry, a pull-request write
      # is the largest single contributor to the repository's shared 10 GB
      # Actions budget. Restoring from master's entry, which is what actually
      # gives the 90% hit rate, still works — measured, it is the ONLY thing
      # that ever hit.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-debug
          max-size: 1G
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: "Install build tools"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        run: bash scripts/ci-install-clang.sh --version ${{ env.CLANG_TOOLS_VERSION }}

      # CMAKE_CXX_SCAN_FOR_MODULES=OFF for the same reason the tidy job names it,
      # and here it is insurance rather than necessity: CompileCache.cmake turns
      # the scan off only inside the branch that picks a launcher, so a ccache
      # this job fails to find silently buys a clang-scan-deps process per
      # translation unit across ~590 units. This project has no module units.
      - name: "Configure"
        run: >-
          cmake --preset clang-debug -DENABLE_TIDY=OFF
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON
          -DFASTCACHED_BUILD_BENCHMARKS=ON -DFASTCACHED_BUILD_TESTCLIENT=ON

      - name: "Build"
        run: cmake --build --preset clang-debug

      # The ccache-action prints its own statistics, but in a post step at the
      # very bottom of a collapsed log, an hour of scrollback away from the build
      # they describe. `Cleanups` is the number that decides `max-size` above, so
      # it is printed here, next to the build it belongs to.
      - name: "Report ccache effectiveness"
        run: ccache --show-stats --verbose

      - name: "Test"
        run: ctest --preset clang-debug

  # ThreadSanitizer, over the concurrency-bearing tests only.
  #
  # The `clang-tsan` preset existed for a long time and nothing invoked it. The
  # first time anyone ran it by hand it found a real race in `AdminEndpoint`
  # (#260) — which is the argument for this job, and also why the job is not
  # simply "run everything under TSan".
  #
  # SCOPE, and what it is not. WHAT RUNS is the `TARGETS` table in
  # `scripts/tsan-gate.sh`; WHAT IS CLAIMED is `FastCachedTsanScope` in
  # `scripts/check-tsan-scope.cmake`, whose rows are directories and single
  # files. Neither list is restated here — this comment held a second copy of the
  # tag list and duly went stale, which is the defect the whole mechanism is
  # about, in the prose describing it.
  #
  # It has been WRONG in both of its halves, which is why neither is asserted.
  # The TAGS were: the first version named three and silently excluded six of
  # ten `Async/` test files while every signal in the run said clean. Then the
  # SCOPE was, and #316 is what that cost — it named three directories, while a
  # `std::thread` census over `PaceTest`'s own sources finds nineteen
  # threaded files with eleven in no row and under no tag. Every threaded `Net/`
  # test was among them, which is the module `BlockingListener` lives in and so
  # the module #260 came out of; that race reached this job only because the node
  # binary is run whole.
  #
  # Widening it was not free and that is the argument for it, not against: the
  # first sanitized run of the wider scope reported two races that had never been
  # run under TSan (#1207, #1208), both in code years older than the change. They
  # are in `.tsan-suppressions` naming their issues, so this job is red for a NEW
  # race and not for those.
  #
  # What is still NOT claimed is that the scope table names every threaded FILE.
  # That census is a proxy — a test reaching threads through a helper spawns none
  # of its own — so a check built on it would refuse correct files and miss
  # incorrect ones.
  #
  # The BINARY half is no longer a proxy, and #1209 is why. `pace-cc-tests`
  # sat in no row: the launcher does not link the Pace library, so no tag
  # expression could ever have reached it. It is a row now, run whole. The ticket
  # enumerated the test binaries by hand and its table listed four; this tree
  # registers six with `catch_discover_tests`, five of them in a default
  # configuration — `pacectl-tests` and `CowTreeTests` were in neither the
  # table nor any row. Neither was threaded then, so the ticket's conclusion survived
  # its census (`pacectl-tests` became threaded with #134 and is a row now), but
  # a hand list is exact about what it knows and silent about what it
  # does not (#492), and that silence reads identically to complete coverage. So
  # `scripts/check-tsan-scope.cmake` DERIVES the set from the
  # `catch_discover_tests` registrations and requires each one to be a `TARGETS`
  # row or a written exemption. That is sound where the threaded census is not:
  # the registrations are a fact about the build, not an inference about a source.
  #
  # The tags are not claimed to be confined to the scoped locations either: test
  # files elsewhere carry one and are swept in, which is harmless, because running
  # MORE than the scope is not the failure this guards. Running LESS is.
  #
  # So the scope is enforced rather than asserted: `ctest -R tsan-scope-hygiene`
  # runs in the DEFAULT set and fails when a scoped test carries no selected tag.
  # Widening it is two edits that check each other — the `TARGETS` table in
  # `scripts/tsan-gate.sh` decides what RUNS, and `FastCachedTsanScope` in
  # `scripts/check-tsan-scope.cmake` decides what is CLAIMED. That check reads the
  # tags out of the gate rather than keeping a copy, so the tag half needs one edit.
  #
  # WHY A SCRIPT AND NOT `ctest`. Because a clean sanitizer run is not evidence.
  # `cmake/portable/Sanitizers.cmake` records a defect on this repository where
  # the option read ON, the configure log printed "Enabling", and no
  # `-fsanitize=` reached the compile line at all — so the sanitizer presets had
  # never once run a sanitizer, and every signal an author would check said yes.
  # `scripts/tsan-gate.sh` refuses to report clean until it has proved both that
  # the test binaries carry `__tsan_init` and that a deliberately racy canary
  # still goes red. `ctest` cannot tell "no races" from "no sanitizer"; this can.
  #
  # It is a full job because TSan needs its own build of the tree. The tests
  # themselves are cheap — measured at 1.2s and 17.6s — so this job is its build,
  # and it is on every push for the same reason the ASan job is: a race found a
  # week later has a week of commits to bisect through.
  clang-tsan:
    name: "clang-tsan"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The gate bounds each test binary itself, which names the target that stalled;
    # this bounds the build as well, so a hang anywhere in the job stops in an hour
    # rather than at GitHub's six-hour default. Every wait is bounded.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same key as clang-tidy and clang-asan-ubsan, for the reason the first of
      # them states: this cache holds SOURCE, which is identical whatever sanitizer
      # the build then applies. A third entry would spend the repository's shared
      # 10 GB budget again and make this job's first run a cold download of every
      # CPM package.
      #
      # `cache/restore` and not `cache`, which is the difference from those two:
      # they already both WRITE this key, so on a CMakeLists.txt change each
      # uploads the same archive and the losers discard theirs after paying for
      # it. A third writer makes that worse and buys nothing — the entry is
      # identical whoever saves it, so this job reads and lets clang-tidy save.
      # The pre-existing two-writer case is issue #318.
      - name: "Cache CPM packages"
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-debug-

      # A ccache key of its own, deliberately: `-fsanitize=thread` and
      # `-fsanitize=address,undefined` give every translation unit a different
      # compiler command line, so sharing clang-debug's key would produce no
      # cross-job hits at all while forcing two working sets into one cap. That is
      # thrashing, not sharing.
      #
      # 512M rather than the 1G clang-asan-ubsan measured for itself, and the
      # number comes from a measurement rather than from the target list looking
      # smaller: one clean build of exactly these three targets produces 439
      # object files totalling 417 MB uncompressed, which ccache stores
      # compressed. The rule for this knob is that a cap is judged by `Cleanups`
      # rather than copied from a neighbour — raising a cap that is not full
      # spends a shared budget on nothing, and that budget also carries the
      # Windows sccache entries. The `--show-stats` step below is what says
      # whether 512M is enough; raise it when `Cleanups` is non-zero, not before.
      # `save` on a branch push only; the reason is on the `linux` job's step.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-tsan
          max-size: 512M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: "Install build tools"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        run: |
          # `llvm-${{ env.CLANG_TOOLS_VERSION }}` comes through the same script: that install is
          # subject to the same two failures as the compiler's, and a bare `apt-get`
          # after the script returned would be one call site back to guessing.
          bash scripts/ci-install-clang.sh --version ${{ env.CLANG_TOOLS_VERSION }} --package llvm-${{ env.CLANG_TOOLS_VERSION }}
          # This job's green depends on a suppression MATCHING, and `race_top:`
          # matches a function name — which needs symbolization. Without a pinned
          # llvm-symbolizer the runtime falls back to whatever the image happens
          # to carry, and a #260 report that fails to symbolize arrives as a NEW
          # unsuppressed race, sending the reader to file an issue that exists.
          #
          # `test -x` before the link, and that is the point rather than caution:
          # `ln -sf` onto a missing target succeeds and leaves a DANGLING link,
          # which is worse than no link at all — the runtime then execs something
          # that is not there. Fail here, where the message is the package name.
          test -x /usr/bin/llvm-symbolizer-${{ env.CLANG_TOOLS_VERSION }}
          sudo ln -sf /usr/bin/llvm-symbolizer-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/llvm-symbolizer

      - name: "Configure"
        run: >-
          cmake --preset clang-tsan
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON

      # Only the targets the gate runs — but do not read that as "the scope makes
      # this job cheap". `PaceTest` is one binary carrying every library
      # `*_test.cpp`, so the tag scope buys RUNTIME and almost nothing at build
      # time. This job's cost is its compile.
      #
      # MEASURED on abb530ed, `cmake --preset clang-tsan
      # -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON`, counting the
      # object files `ninja -t inputs` says each target set transitively needs:
      #
      #     every CXX compile edge this configure declares      675 (107 third-party)
      #     the three targets before #1209                      498
      #     the four targets below                              580
      #
      # So adding `pace-cc-tests` costs **82 compile edges**, which is exactly
      # its own object count: everything else it needs was already being built for
      # the other rows. At runtime it costs ~3s against the ~18.8s the first two
      # take. That trade is what #1209 asked to have decided rather than corrected
      # in passing, and this is the number it was decided on.
      #
      # The figures are PINNED to that commit and that configure line rather than
      # pointing at them, because they are one tree at one instant — a comment that
      # tracked its source would one day claim a measurement had been taken under
      # conditions nobody measured it under. The pair that stood here before
      # ("439 of 552") is not restated as a corrected pair: its denominator never
      # said whether third-party edges were in it, so it cannot be compared with
      # the one above and a reader reconciling them would be reconciling nothing.
      #
      # What this job still does NOT build: the daemon, the launcher itself
      # (`pace-cc`, as opposed to its tests), `pacectl` (its tests are a
      # row since #134 gave them a thread pool),
      # `CowTreeTests`, and the two default-OFF targets (benchmarks, testclient).
      # `scripts/check-tsan-scope.cmake` is what keeps that list honest — every
      # Catch2 binary this tree registers is either a `TARGETS` row or carries a
      # written exemption, so a fourth test binary cannot arrive unnoticed the way
      # `pace-cc-tests` did.
      - name: "Build"
        run: >-
          cmake --build --preset clang-tsan --target
          PaceTest pace-node-tests pace-cc-tests pacectl-tests tsan-canary

      - name: "Report ccache effectiveness"
        run: ccache --show-stats --verbose

      # Every refusal has a message of its own, because each is fixed somewhere
      # different, and each was verified by making it happen. The list is in the
      # header of `scripts/tsan-gate.sh` and deliberately only there — an earlier
      # version of this comment enumerated "five", in a different order from the
      # two other places that also enumerated them, having dropped the two
      # refusals that are hardest to reason about.
      - name: "ThreadSanitizer gate"
        run: bash scripts/tsan-gate.sh out/build/clang-tsan

  # Coverage, measured once, on Linux, with Clang. One configuration and not a
  # matrix, because coverage answers "which lines did the tests reach", and that
  # does not vary by compiler or platform — where they genuinely differ is
  # whether the code builds and passes at all, which is what the `linux`,
  # `macos` and `windows` jobs above and below are for. A second instrumented
  # build would double the cost to re-answer a question already answered.
  #
  # This job does not gate on a percentage and must not be given one. Its whole
  # purpose right now is to establish a baseline and publish it; the long-term
  # target is >90%, and getting there is separate work on separate pull
  # requests. A threshold added here would block merges on a number nobody has
  # had a chance to move yet — see issue #149.
  coverage:
    name: "Code coverage"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'push' || github.ref_type != 'branch') }}
    # Read here rather than in each step's `if`, because the `secrets` context is
    # not available in a step-level condition while `env` is. Empty on a pull
    # request from a fork, where GitHub withholds secrets — which is exactly the
    # behaviour wanted: the upload is skipped and the job still passes.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Where scripts/coverage.sh leaves everything the steps below publish.
      # Spelled once: three steps read out of it, and a preset rename that moved
      # the directory would otherwise leave two of them silently finding nothing.
      COVERAGE_DIR: out/build/clang-coverage/coverage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-coverage-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-coverage-

      # No ccache step here, unlike the two jobs above, and that is not an
      # oversight to correct. The clang-coverage preset sets
      # USE_COMPILER_CACHE=OFF and cmake/Coverage.cmake refuses to configure at
      # all if a compiler-cache launcher is set, because coverage mapping data
      # is embedded in the object file and names its sources by absolute path —
      # a replayed object describes the tree it was built in. So a cache step
      # could never front this compile; it would only write an entry nothing
      # reads, against the repository's Actions cache quota.

      - name: "Install build tools"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      # llvm-${CLANG_TOOLS_VERSION} on top of clang, and the version has to be
      # the same one: llvm-profdata and llvm-cov live in that package, and the
      # raw profile format is versioned, so a mismatched pair rejects the file.
      # cmake/Coverage.cmake refuses to configure rather than let that surface
      # later as a complaint about the profile.
      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }} and its LLVM tools"
        run: bash scripts/ci-install-clang.sh --version ${{ env.CLANG_TOOLS_VERSION }} --package llvm-${{ env.CLANG_TOOLS_VERSION }}

      # TLS on, to match the surface the `linux` job tests. Benchmarks and the
      # test client deliberately off, unlike that job: it builds them so they
      # cannot rot, but no ctest test runs either binary, so instrumenting them
      # would report 0% for code the suite was never meant to reach and pull the
      # figure down while looking like rigour.
      - name: "Configure"
        run: cmake --preset clang-coverage -DFASTCACHED_ENABLE_TLS=ON

      - name: "Build"
        run: cmake --build --preset clang-coverage

      # Runs the whole suite under instrumentation and renders the report — the
      # same target, and the same scripts/coverage.sh, a developer runs locally.
      # A failing test fails this step: the script renders the report anyway, to
      # read while debugging, and then re-raises, so the steps that publish a
      # number never run for a red build.
      - name: "Measure coverage"
        run: cmake --build --preset clang-coverage --target coverage

      # always(), so a red suite still says what it measured — the report is
      # rendered either way, and the figure is the first thing anyone asks for.
      # Guarded on the file existing because a build that never linked has no
      # report at all.
      - name: "Summarize"
        if: always()
        run: |
          report="$COVERAGE_DIR"
          if [[ ! -f "$report/percent.txt" ]]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Code coverage"
            echo
            echo "**$(cat "$report/percent.txt")%** of lines covered."
            # Tested separately from percent.txt rather than assumed from it:
            # the script writes this one later, so a failure in between would
            # otherwise render a percentage above an empty code fence.
            if [[ -f "$report/report.txt" ]]; then
              echo
              echo '```'
              # The header row and the totals row: region, function, line and
              # branch figures with their column names, rather than a blind tail
              # that picks up whichever file llvm-cov happened to print last.
              grep -E '^(Filename|TOTAL)' "$report/report.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload the HTML report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: ${{ env.COVERAGE_DIR }}/html
          retention-days: 7
          if-no-files-found: warn

      # Skipped, and the job still green, until a maintainer enables the
      # repository at codecov.io and adds CODECOV_TOKEN — so this lands working
      # rather than red. Deliberately NOT `if: always()`: a red suite must not
      # publish a number.
      - name: "Upload to Codecov"
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_DIR }}/coverage.lcov
          # The lcov export already carries only first-party non-test sources,
          # so there is nothing else in the directory worth finding.
          disable_search: true
          # False, and deliberately. This job is a row in release.needs, so a
          # Codecov outage or rate-limit with fail_ci_if_error would fail a tag
          # build whose every other job was green and leave no draft release —
          # a third party's availability deciding whether this project can ship.
          # The measurement is what gates; publishing it is not.
          fail_ci_if_error: false

  macos:
    name: "macOS-clang-release"
    runs-on: macos-14
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-release-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-release-

      # `save` on a branch push only; the reason is on the `linux` job's step.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-release
          max-size: 256M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      # Can the bash we ship to actually PARSE our scripts? (#1100)
      #
      # BEFORE configure and build, and that placement is the whole value: a script
      # legal token-by-token can still be unparseable by macOS's 2007 /bin/bash, and
      # until now the only instrument that said so was the full `ctest` run four
      # minutes into this required context -- reporting the wrong line when it did
      # (#1096: the cause was 135 lines above, on a line identical to master's).
      #
      # `/bin/bash` EXPLICITLY, not the `bash` on PATH. This step is the only place in
      # the project where a real 3.2 exists, and running it under Homebrew's bash 5
      # would parse the very constructs it exists to catch and report success -- the
      # mode under test not being the mode in use. The script asserts its own
      # interpreter and REFUSES on 4.0 or newer, so a misrouted run is loud rather than
      # green, but naming the interpreter here means it does not have to rely on that.
      #
      # It runs before `brew install`, so nothing it depends on can be installed by
      # this job -- `bash -n` and `git ls-files` are all it needs, and both are on the
      # image. Milliseconds per file, no side effects: `bash -n` reads and parses
      # without executing.
      - name: "Parse every script under the bash macOS ships"
        run: /bin/bash scripts/check-bash32-parse.sh

      # Apple's bundled AppleClang 15 ships a libc++ without std::jthread
      # (libc++ only implemented it in LLVM 18). Use Homebrew's LLVM, whose
      # modern libc++ has it. llvm is keg-only, so we point the compiler at its
      # explicit path and add its libc++ to the linker search + rpath.
      - name: "Install build tools"
        run: brew install ninja llvm openssl@3 bash

      # The clang-release preset pins CMAKE_C/CXX_COMPILER to bare clang/clang++
      # (= AppleClang on PATH); override on the command line, which takes
      # precedence over preset cache variables, to use Homebrew's LLVM instead.
      #
      # Homebrew's libc++.dylib has `@rpath/libc++abi.1.dylib` and
      # `@rpath/libunwind.1.dylib` as runtime deps; libunwind lives under
      # `lib/unwind/`, not `lib/c++/`. Without that second rpath, dyld
      # resolves libunwind from /usr/lib/system instead — the resulting
      # two-libunwind / two-libc++abi load corrupts exception unwinding
      # on macos-14 and Catch2 sees SIGABRT instead of the C++ throw.
      # OpenSSL is keg-only on Homebrew, so point CMake at it via OPENSSL_ROOT_DIR.
      - name: "Configure"
        run: |
          cmake --preset clang-release \
            -DFASTCACHED_ENABLE_TLS=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib/unwind -L/opt/homebrew/opt/llvm/lib -lunwind -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib/unwind"

      - name: "Build"
        run: cmake --build --preset clang-release

      # `macos-14` is Apple Silicon, whose every core has the ARMv8 SHA-256 instructions,
      # so this leg holds itself to the hardware engine rather than letting a detection
      # that answered nothing SKIP every case that would have noticed (#1432).
      - name: "Test"
        env:
          FASTCACHED_EXPECT_SHA256_ENGINE: arm-sha2
        run: ctest --preset clang-release

  # Builds the container image (which compiles with TLS on against the system
  # OpenSSL) and smoke-tests it: start the container, hit /healthz from the host,
  # and run the in-image `--healthcheck`. This is the authoritative check that
  # the Dockerfile builds and the health probe works end-to-end in the image.
  docker:
    name: "Docker image"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'push' || github.ref_type != 'branch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Build image"
        run: docker build -t pace-kv:ci .

      - name: "Smoke test the image"
        run: |
          docker run -d --name fc -p 6674:6674 -p 9259:9259 pace-kv:ci \
            --bind=0.0.0.0 --metrics --metrics-bind=0.0.0.0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9259/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:9259/healthz
          curl -fsS http://127.0.0.1:9259/metrics | grep -q fastcached_cmd_get_total
          docker exec fc pace-kv --healthcheck
          docker rm -f fc

  # Smoke tests live in sibling jobs so the PR status check tells you *which*
  # client or protocol broke without opening the log. They share the same
  # pace-kv binary artifact and the same compile-twice / expect-cache-hit
  # assertion, and cover one supported compile-cache client each: sccache over
  # the three wire protocols it can reach us on, and our own pace-cc over
  # the compile-cache 0xFC protocol.
  #
  # Between the three sccache jobs the only deltas are which sccache version is
  # installed (apt = 0.7.7 = OpenDAL 0.44 = memcached TEXT wire;
  # mozilla-actions's prebuilt = >=0.8 = OpenDAL >=0.45 = memcached BINARY wire)
  # and which SCCACHE_* env var points sccache at pace-kv.

  sccache-smoke-memcached-text:
    name: "sccache smoke (memcached text)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'push' || github.ref_type != 'branch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download pace-kv binary"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make pace-kv executable"
        run: chmod +x bin/pace-kv
      # `libyaml-cpp0.8` is THIS artefact's runtime dependency, and without it
      # `./bin/pace-kv` dies at dynamic-link time before it binds anything.
      # THIS artefact, not the released one: the `linux` job builds it with the
      # project default (`CPM_USE_LOCAL_PACKAGES ON`) and a runner that has
      # libyaml-cpp-dev, so it links the shared library. What SHIPS does not --
      # `package-linux` passes `-DCPM_USE_LOCAL_PACKAGES=OFF` since #1538 and a
      # step there reads the ELF to prove it. Do not read this apt line as a
      # statement about the release.
      - name: "Install a C++ compiler + the libyaml-cpp runtime"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y g++-14 libyaml-cpp0.8
      # NOT apt's sccache. Measured (#1318): Ubuntu builds sccache with the backends
      # OFF -- `sccache --help` reports `Memcached: false` on the very 0.7.7 whose
      # OFFICIAL release binary reports `Memcached: true`. Same version, different
      # build. So this leg ran for its whole life against sccache's own local disk
      # cache, never reaching pace-kv, and passed.
      #
      # Pinned to **0.7.7** rather than latest, and the pin is what this leg IS: the
      # memcached wire dialect follows the sccache version -- 0.7.x speaks TEXT,
      # >= 0.8 (OpenDAL >= 0.45) speaks BINARY -- so taking the default here would
      # silently convert this into a second copy of the binary leg while keeping the
      # name `memcached text`. That is the same false-coverage claim #1318 is about,
      # re-established on purpose, which is why `--expect-flavor` below is asserted
      # rather than trusted: the daemon reports the dialect it was actually spoken to.
      - name: "Install sccache 0.7.7 (memcached TEXT dialect, backends compiled in)"
        uses: mozilla-actions/sccache-action@v0.0.6
        with:
          version: "v0.7.7"
      - name: "Smoke"
        run: >
          bash scripts/sccache-smoke.sh --pace-kv ./bin/pace-kv
          --protocol memcached --port 11611 --compiler g++-14
          --expect-flavor memcached-text

  sccache-smoke-memcached-binary:
    name: "sccache smoke (memcached binary)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'push' || github.ref_type != 'branch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download pace-kv binary"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make pace-kv executable"
        run: chmod +x bin/pace-kv
      - name: "Install C++ compiler + libyaml-cpp runtime"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y g++-14 libyaml-cpp0.8
      # Unpinned, so the action's default (>= 0.8, OpenDAL >= 0.45) speaks the
      # memcached BINARY dialect -- which is exactly what this leg is for, and is
      # why its sibling one job up pins 0.7.7 for TEXT. The pair only means
      # something while the two dialects differ, so both assert `--expect-flavor`
      # rather than trusting the version: the daemon reports what it was spoken to.
      #
      # v0.0.6 while the Windows jobs are on v0.0.11, deliberately: this job uses
      # the action purely to put an sccache BINARY on PATH and then points it at a
      # pace-kv daemon. It never touches the Actions-cache backend, which is
      # the only thing the newer version is needed for.
      - name: "Install sccache (binary protocol via OpenDAL >= 0.45)"
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: "Smoke"
        run: >
          bash scripts/sccache-smoke.sh --pace-kv ./bin/pace-kv
          --protocol memcached --port 11611 --compiler g++-14
          --expect-flavor memcached-binary

  sccache-smoke-redis:
    name: "sccache smoke (redis RESP2)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'push' || github.ref_type != 'branch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download pace-kv binary"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make pace-kv executable"
        run: chmod +x bin/pace-kv
      # `libyaml-cpp0.8` is THIS artefact's runtime dependency, and without it
      # `./bin/pace-kv` dies at dynamic-link time before it binds anything.
      # THIS artefact, not the released one: the `linux` job builds it with the
      # project default (`CPM_USE_LOCAL_PACKAGES ON`) and a runner that has
      # libyaml-cpp-dev, so it links the shared library. What SHIPS does not --
      # `package-linux` passes `-DCPM_USE_LOCAL_PACKAGES=OFF` since #1538 and a
      # step there reads the ELF to prove it. Do not read this apt line as a
      # statement about the release.
      - name: "Install a C++ compiler + the libyaml-cpp runtime"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y g++-14 libyaml-cpp0.8
      # NOT apt's sccache, for the reason recorded on the text leg: Ubuntu builds it
      # with the backends OFF (`Redis: false`), so this job spent its whole life on
      # sccache's local disk cache and never spoke RESP2 to anything. Unpinned --
      # unlike memcached, redis has ONE dialect here, so no version carries meaning
      # and the newest release is the right default.
      - name: "Install sccache (backends compiled in, unlike the distro package)"
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: "Smoke"
        run: >
          bash scripts/sccache-smoke.sh --pace-kv ./bin/pace-kv
          --protocol redis --port 11611 --compiler g++-14
          --expect-flavor redis-resp

  # The fourth client: our own launcher over the compile-cache 0xFC protocol.
  # It runs the same harness the E2E jobs do rather than a cut-down copy of its
  # assertions, but points it at the *uploaded release binaries* instead of a
  # freshly built tree — so this job answers "do the artifacts we ship
  # interoperate", the same question the sccache smoke jobs answer for the
  # daemon, while the E2E jobs answer "does the contract hold for each compiler
  # driver on each platform".
  pace-cc-smoke:
    name: "pace-cc smoke (compile-cache 0xFC)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'push' || github.ref_type != 'branch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download the pace-kv + pace-cc binaries"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make the binaries executable"
        run: chmod +x bin/pace-kv bin/pace-cc bin/mid-compile-edit-stub
      - name: "Install a C++ compiler + libyaml-cpp runtime"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y g++-14 libyaml-cpp0.8
      # Exit 77 means a prerequisite was missing and nothing was verified, which
      # must fail here rather than report green.
      - name: "Smoke"
        run: |
          bash scripts/compile-cache-e2e.sh \
            --pace-kv ./bin/pace-kv \
            --launcher ./bin/pace-cc \
            --compiler g++-14 \
            --edit-stub ./bin/mid-compile-edit-stub \
            --port 11611 || { c=$?; [ "$c" = 77 ] && echo "::error::smoke skipped, nothing verified"; exit "$c"; }

  # The `-arm64` row is the Linux job's, for the same reason (#1432), and `msvcArch`
  # is what the dev shell targets: the x86 rows name `x64`, which is the action's own
  # default, so their environment does not move.
  windows:
    name: "Windows-${{ matrix.preset }}${{ matrix.suffix }}"
    runs-on: ${{ matrix.runner }}
    needs: changes
    # A job-level condition on a MATRIX job is the shape #300 warns about, and
    # this is the one form of it that is safe: `!cancelled()` is false only while
    # the RUN is being cancelled, so the matrix always expands and every leg
    # reports under its real name. It is here so that a FAILED `changes` cannot
    # skip this job -- which, being a matrix, would take its per-leg required
    # contexts out of existence entirely. The step conditions below still decide
    # whether any work happens.
    if: ${{ !cancelled() }}
    # The Windows jobs were the second-biggest block in this workflow — 21.2 and
    # 15.7 minutes, of which 17.2 and 11.8 were the build — and they were paying
    # a full cold compile every single run. Measured on run 33243524509: sccache
    # reported `Cache location  Local disk`, on an ephemeral runner. Nothing it
    # stored ever survived the job that stored it, so the cache was installed,
    # announced by the configure, genuinely used — and could not possibly hit. The
    # E2E job's own statistics are the receipt: 231 compile requests, 2 hits.
    #
    # Those two figures are history, not the current cost: what these jobs take
    # now, what fraction of it is `ctest` rather than the build, and what the hit
    # rate actually is are one table in `.agent/rules/build-and-toolchain.md`.
    #
    # The action does not set this itself — its README tells you to — and without
    # it sccache never looks at the Actions cache at all. Set at job level rather
    # than per step because it has to be visible to the configure (which picks
    # the launcher) and to the build (which runs it).
    #
    # Safe against the MSVC `/showIncludes` hazard that CompileCache.cmake warns
    # about, and the reason is worth writing down rather than re-deriving: that
    # hazard needs an INCREMENTAL build across checkouts at DIFFERENT absolute
    # paths. Every runner builds from scratch at `D:\a\fastcached\fastcached`, so
    # neither half holds, and sharing entries between runs is sharing them
    # between builds that spell every path identically.
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        # cl-debug is the third leg and it is here for the RUNTIME, not the
        # compiler: MSVC's Debug CRT sets `_ITERATOR_DEBUG_LEVEL=2`, which traps
        # invalidated iterators, out-of-range indexing and mismatched container
        # iterators at the point they happen. That was the one configuration on
        # Windows nobody ran, while being the default Windows preset every
        # developer here debugs with — so a `cl-debug`-only defect could live on
        # master indefinitely with every status check green (#315).
        #
        # A third leg rather than replacing a Release one, and that is measured
        # rather than assumed. No Windows leg was the longest job in any of the 13
        # code-touching pull-request runs sampled for the per-event table in
        # `.agent/rules/build-and-toolchain.md` — that is `Code coverage` or an
        # escalated `clang-tidy` sweep — so this leg costs runner-minutes and no
        # wall clock at all, which is cheaper than giving up a Release
        # configuration to buy it.
        #
        # The per-leg figures live in that table and are deliberately not restated
        # here. The pre-`SCCACHE_GHA_ENABLED` numbers in the comment above were
        # copied into this spot once already, and by the time anyone re-measured
        # they described a two-leg matrix that no longer existed while reading
        # like current fact. Which job "finishes last" is likewise a property of
        # the EVENT, not of this workflow: it is `clang-tidy` on master and inside
        # the queue, where every sweep is a full one, and on a pull request it is
        # `Code coverage` in most runs and an escalated `clang-tidy` sweep in the
        # rest — 9 and 4 of the 13 sampled. Not one of them is a Windows leg,
        # which is the only part of it this comment depends on.
        #
        # It runs `ctest` like its siblings, because a Debug leg that only
        # compiles exercises none of the runtime it was added for. The
        # `iterator-debug-canary` test is what refuses to believe it did.
        preset: [cl-release, clangcl-release, cl-debug]
        runner: [windows-2025]
        msvcArch: [x64]
        include:
          - preset: cl-release
            runner: windows-11-arm
            msvcArch: arm64
            suffix: "-arm64"
            sha256Engine: arm-sha2
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.code != 'false' }}
        with:
          fetch-depth: 0

      # NOT the `linux` job's split, and the key names the leg: here the arm64 leg
      # could never read what its x86 sibling wrote, whatever the key said. An
      # entry is found by key AND version, and actions/cache hashes the version
      # from `path:` as the runner expanded it plus the compression it chose
      # (`getCacheVersion`, @actions/cache). Both differ between these images:
      # `github.workspace` is `D:\a\...` on windows-2025 and `C:\a\...` on
      # windows-11-arm (run 35340951724), and zstd is on windows-2025 and in the
      # arm image's list of OMITTED software, which makes the tool fall back to
      # gzip. So each leg saves its own entry, one writer per key.
      - name: "Cache CPM packages"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}${{ matrix.suffix }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-${{ matrix.preset }}${{ matrix.suffix }}-

      # v0.0.11 rather than v0.0.6: GitHub's cache service v1 is gone, and only
      # the newer action exports the ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN
      # pair that sccache's GHA backend reads. An older action with
      # SCCACHE_GHA_ENABLED set is the failure this whole block exists to stop —
      # a cache that is configured, announced, and inert.
      - name: "sccache"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: "Install ninja"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: choco install ninja --no-progress

      # Pin the MSVC toolset to 14.44. The windows-2025 image moved to VS 18 /
      # MSVC STL 14.51, whose <xutility> trips a "static assertion failed:
      # unexpected size" under the runner's bundled clang-cl 20.1.8 (the cl
      # job is unaffected — MSVC compiles its own STL). 14.44 is the last
      # toolset clang-cl 20.1.8 accepts and the version CI was green on before
      # the image bump; cl-release builds against it equally well.
      - name: "Setup MSVC dev environment"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"
          arch: ${{ matrix.msvcArch }}

      - name: "Configure"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: >
          cmake --preset ${{ matrix.preset }}
          -DFASTCACHED_ENABLE_TLS=ON
          -DALLOW_SCCACHE_FALLBACK=ON
          "-DOPENSSL_ROOT_DIR=C:/Program Files/OpenSSL"

      - name: "Build"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: cmake --build --preset ${{ matrix.preset }}

      # A compiler cache that handled nothing is worse than one that is off,
      # because it reads like success: the configure says "Enabling sccache", the
      # build is green, and the seventeen minutes look like the cost of compiling
      # this project on Windows. So both facts are asserted, not printed.
      #
      # `cache_location` is the one that matters, and asserting only
      # `compile_requests` would have missed the entire regression: the broken
      # configuration reported 231 requests and 2 hits, into a directory the
      # runner deletes. A hit-rate floor is not usable — the first run after a
      # cache key changes is legitimately cold — so what is checked is that the
      # backend is not the ephemeral one, which is a fact about configuration and
      # is true from the very first run. Stated as "not `Local disk`" rather than
      # as "is the Actions cache": `Local disk` is the exact string sccache fell
      # back to and the exact string this job must never see again, while what
      # the GHA backend calls itself is sccache's to rename.
      #
      # And because it is sccache's to rename, the two fields are checked to be
      # PRESENT first. A `-match` against `$null` is `$false`, so an sccache that
      # moves or renames `cache_location` would leave this step green while
      # asserting nothing — the same "configured, announced, inert" shape the step
      # exists to catch, one level up.
      #
      # Here, and NOT in the action's own post step, because sccache keeps its
      # counters in the server and this suite restarts that server: the
      # `sccache-smoke-*` tests point sccache at a pace-kv daemon through
      # SCCACHE_MEMCACHED, which zeroes them. That is why the post step reported
      # `Compile requests 0` on run 33243524509 for a build sccache had in fact
      # handled — the E2E job, which runs no ctest, reported 231 requests from the
      # same configuration. A number read after `Test` is somebody else's.
      - name: "Assert sccache actually handled the build"
        if: ${{ needs.changes.outputs.code != 'false' }}
        shell: pwsh
        # mozilla-actions/sccache-action exports it to the job; the step names it, so what this step reads is
        # visible in the step (#1448).
        env:
          SCCACHE_PATH: ${{ env.SCCACHE_PATH }}
        run: |
          & $env:SCCACHE_PATH --show-stats
          $stats = & $env:SCCACHE_PATH --show-stats --stats-format=json | ConvertFrom-Json
          if ($null -eq $stats.stats.compile_requests -or $null -eq $stats.cache_location) {
            Write-Host "::error::sccache reported no compile_requests/cache_location field; the assertion below cannot run and a null never matches, so this is a refusal rather than a pass"
            exit 1
          }
          if ($stats.stats.compile_requests -eq 0) {
            Write-Host "::error::sccache handled 0 compile requests; the launcher is not wired in"
            exit 1
          }
          if ($stats.cache_location -match 'Local disk') {
            Write-Host "::error::sccache is caching into '$($stats.cache_location)', which is deleted with this runner; SCCACHE_GHA_ENABLED did not take effect"
            exit 1
          }

      # A spawn BRACKET around `ctest`, and the pair is what makes the reading
      # mean something ([#966](https://github.com/LASTRADA-Software/fastcached/issues/966)).
      #
      # `Windows-cl-debug` once failed six tests, all with exit `0xc0000142`
      # (`STATUS_DLL_INIT_FAILED`), and they were exactly the six that spawn a
      # process while every in-process case passed. No defect in the tree selects
      # for "spawns a process": a broken link or a missing runtime would take the
      # in-process cases with it. But nothing SAID so, and six red smoke tests read
      # as a regression -- which matters most on this leg, since it is the one run
      # for `_ITERATOR_DEBUG_LEVEL=2` and its smoke tests are where a Debug-runtime
      # defect would surface. A leg that intermittently reports nothing about the
      # property it exists for is worse than one that is simply red.
      #
      # Cheap and side-effect free: `cmd /c exit 0` starts a process and nothing
      # else. It cannot make a green run red for any reason but the one it names.
      - name: "Can this runner start a process at all? (before)"
        if: ${{ needs.changes.outputs.code != 'false' }}
        shell: pwsh
        run: |
          & cmd /c exit 0
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::this runner cannot start a process (cmd exited $LASTEXITCODE, 0xc0000142 is STATUS_DLL_INIT_FAILED)."
            Write-Host "::error::Nothing below this line says anything about the tree (#966)."
            exit 1
          }
          Write-Host "::notice::spawn works before ctest"

      # `--output-log` because it is the only place ctest writes WHICH failures were
      # timeouts: `LastTest.log` records a timeout and a failed assertion alike, as
      # `Test Failed.`. The reading after a red needs that distinction (#1515).
      - name: "Test"
        if: ${{ needs.changes.outputs.code != 'false' }}
        env:
          FASTCACHED_EXPECT_SHA256_ENGINE: ${{ matrix.sha256Engine }}
          # This runner is elevated, so the FileTrust ACL cases that set a directory's owner to
          # Administrators must RUN, not skip. Set, they fail closed: a runner that turns out not
          # to be elevated turns this red rather than retiring the guard silently.
          FASTCACHED_EXPECT_ELEVATED: '1'
        run: ctest --preset ${{ matrix.preset }} --output-log out/build/${{ matrix.preset }}/ctest-output.log

      # The other half of the bracket, and it only runs on a red.
      #
      # THREE outcomes, not two, because a probe that can only answer the two you
      # expect will answer one of them whatever it sees:
      #
      #   * spawning is broken NOW -- the run degraded while ctest was running, and
      #     the failures above say nothing about the tree;
      #   * spawning works now -- which clears the runner of #966's shape and of
      #     NOTHING else, so this step no longer says what to read the failures as;
      #   * the probe itself could not conclude -- said out loud rather than folded
      #     into either of the above.
      #
      # It used to end the third arm with "read the failures as being about the
      # tree", and said so over a 170 ms check that had timed out at 60 s on a
      # runner that could still spawn (#1515): a probe of one capability cannot
      # clear a runner that degraded in another. The verdict is now the next step's,
      # which reads the ctest log as well; this one hands it the READING.
      #
      # The broken arm keeps its own annotation: on a runner that cannot start a
      # process, the next step -- which starts bash -- cannot say anything at all.
      #
      # `continue-on-error` because this is a classifier on an already-failing job:
      # it must not be able to change the verdict, only to explain it.
      - name: "Can this runner start a process at all? (after a red)"
        id: spawn-after-red
        if: ${{ failure() && needs.changes.outputs.code != 'false' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rc = $null
          try { & cmd /c exit 0; $rc = $LASTEXITCODE } catch { $rc = $null }
          if ($null -eq $rc) {
            $reading = 'unconcluded'
            Write-Host "::warning::the spawn probe did not conclude; this run is unclassified (#966)"
          } elseif ($rc -ne 0) {
            $reading = 'broken'
            Write-Host "::error::spawning worked BEFORE ctest and does not now (cmd exited $rc)."
            Write-Host "::error::This runner degraded during the run, so the failures above are about the runner and not the tree (#966)."
          } else {
            $reading = 'ok'
            Write-Host "spawning still works after ctest, so this red is not #966's shape; that is all this probe can say"
          }
          "reading=$reading" >> $env:GITHUB_OUTPUT

      # The verdict, from the spawn reading AND the ctest log (#1515). A timeout
      # never reaches "read the failures as being about the tree", because a hang in
      # the tree and a runner that stopped making progress both end in one; and each
      # way of not being able to read the log is its own unclassified warning, never
      # a fall-through. `scripts/ci-ctest-red-reading.sh --self-test` drives every
      # verdict, and both wiring mistakes -- a log path that disagrees with the Test
      # step's, or a misspelt step id, which substitutes EMPTY -- land on an
      # unclassified warning rather than on the tree. And a classifier that never
      # reached a verdict says so here, because `continue-on-error` is exactly what
      # would otherwise hide it.
      - name: "Which failures were timeouts? (after a red)"
        if: ${{ failure() && needs.changes.outputs.code != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/ci-ctest-red-reading.sh \
            --log "out/build/${{ matrix.preset }}/ctest-output.log" \
            --spawn "${{ steps.spawn-after-red.outputs.reading }}" \
            || echo "::warning::the timeout classifier did not reach a verdict (exit $?); this red is unclassified (#1515)"

      - name: "Upload pace-kv.exe"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-windows-${{ matrix.preset }}${{ matrix.suffix }}
          path: out/build/${{ matrix.preset }}/target/pace-kv.exe
          if-no-files-found: error

  # End-to-end compile-cache tests. These live in their own jobs, one per
  # platform, so a PR status check names the platform that broke rather than
  # burying it inside a build matrix. Each starts a real pace-kv, drives real
  # compiles through pace-cc, and asserts the launcher's actual contract:
  # MISS then HIT, the cached object reproduced byte-identically, cross-depth
  # portability (content stored from a deep checkout hits from a shallow one),
  # and a safe fallback when the daemon is unreachable.
  #
  # Cross-depth is the property that distinguishes this launcher from
  # ccache/sccache, and it is only observable end-to-end — a unit test cannot
  # run two checkouts through a real compiler and a real server.

  compile-cache-e2e-linux:
    name: "compile-cache E2E (Linux)"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-cc-e2e-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-cc-e2e-

      # `save` on a branch push only; the reason is on the `linux` job's step.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cc-e2e
          max-size: 256M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      # clang is installed explicitly rather than relied on: the second E2E step
      # below exits 77 (skip) when its compiler is absent, and a skipped step
      # still reports green — so a missing compiler would silently mean the
      # clang driver was never exercised at all.
      # g++-14 must also be put on PATH as plain `g++`: the gcc-release preset
      # pins CMAKE_CXX_COMPILER to the bare name, which otherwise resolves to
      # the runner's default GCC 13 — and that has no <print>, so main.cpp
      # fails to compile. Same symlink the Linux build matrix installs.
      - name: "Install build tools"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y ninja-build libyaml-cpp-dev g++-14 clang
          sudo ln -sf /usr/bin/gcc-14 /usr/local/bin/gcc
          sudo ln -sf /usr/bin/g++-14 /usr/local/bin/g++

      - name: "Configure"
        run: cmake --preset gcc-release

      # `mid-compile-edit-stub` is the compiler case 11 runs through (#1650); the harness
      # FAILS without it rather than skipping, so it is built with the two binaries.
      - name: "Build"
        run: cmake --build --preset gcc-release --target pace-kv pace-cc mid-compile-edit-stub

      # Run the harness directly rather than through ctest so any failure output
      # lands in this job. Exit 77 means a prerequisite was missing and nothing
      # was actually verified, which must fail here rather than report green.
      - name: "Compile-cache E2E (gcc)"
        run: |
          bash scripts/compile-cache-e2e.sh \
            --pace-kv out/build/gcc-release/target/pace-kv \
            --launcher out/build/gcc-release/target/pace-cc \
            --compiler g++-14 \
            --edit-stub out/build/gcc-release/target/mid-compile-edit-stub \
            --port 21713 || { c=$?; [ "$c" = 77 ] && echo "::error::E2E skipped, nothing verified"; exit "$c"; }

      # The launcher must work with the clang driver too, not just gcc.
      - name: "Compile-cache E2E (clang)"
        run: |
          bash scripts/compile-cache-e2e.sh \
            --pace-kv out/build/gcc-release/target/pace-kv \
            --launcher out/build/gcc-release/target/pace-cc \
            --compiler clang++ \
            --edit-stub out/build/gcc-release/target/mid-compile-edit-stub \
            --port 21715 || { c=$?; [ "$c" = 77 ] && echo "::error::E2E skipped, nothing verified"; exit "$c"; }

      # The only shape that catches a WRONG object: build a real target through
      # the launcher and run that target's own tests (#320). The two fixtures
      # above prove the launcher runs and produces AN object; neither runs what
      # came out, which is why #319 -- a cache-backed build that segfaulted while
      # the same commit with -DUSE_COMPILER_CACHE=OFF passed -- could only be
      # found by a developer noticing it.
      #
      # Costs three builds of one test target: a cache-off control, a cold build
      # that stores, and a warm build that replays. Only the warm one is the
      # subject; the other two are what make its green mean something. It runs
      # whenever this job runs, which `ci-scope.sh` already limits to changes that
      # can reach a build -- a docs-only pull request skips the whole job.
      #
      # `--canary` is not optional: it puts a deliberately wrong object into the
      # replayed build and requires the suite to go red. Without it a green run
      # here would be indistinguishable from a fixture that cannot fail.
      - name: "A real target, replayed from cache, passes its own tests"
        run: |
          bash scripts/launcher-replay-e2e.sh \
            --pace-kv out/build/gcc-release/target/pace-kv \
            --launcher out/build/gcc-release/target/pace-cc \
            --compiler g++-14 \
            --target pace-cc-tests \
            --canary \
            --port 21717 || { c=$?; [ "$c" = 77 ] && echo "::error::replay E2E skipped, nothing verified"; exit "$c"; }

  compile-cache-e2e-windows:
    name: "compile-cache E2E (Windows)"
    runs-on: windows-2025
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Same backend, same version, same reasons as the `windows` job above, where
    # they are written out. This job builds the same cl-release configuration, so
    # it also hits entries that job stored.
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-cc-e2e-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-cc-e2e-

      - name: "sccache"
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: "Install ninja"
        run: choco install ninja --no-progress

      # Same toolset pin as the windows build matrix; see the comment there.
      - name: "Setup MSVC dev environment"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"

      # -DALLOW_SCCACHE_FALLBACK=ON for the reason written out at the `windows`
      # job's configure step: sccache is opt-in since #815, and without it this job
      # would front the compiler with nothing and pay a cold build in silence.
      - name: "Configure"
        run: cmake --preset cl-release -DALLOW_SCCACHE_FALLBACK=ON

      # `mid-compile-edit-stub` is the compiler the mid-compile-save case runs through
      # (#1650); the harness FAILS without it rather than skipping.
      - name: "Build"
        run: cmake --build --preset cl-release --target pace-kv pace-cc mid-compile-edit-stub

      # Same assertion as the `windows` job, where the reasoning is written out.
      # Repeated rather than pointed at, because a cache enabled in three jobs and
      # proved in one is a cache two of them can lose in silence.
      - name: "Assert sccache actually handled the build"
        shell: pwsh
        # mozilla-actions/sccache-action exports it to the job; the step names it, so what this step reads is
        # visible in the step (#1448).
        env:
          SCCACHE_PATH: ${{ env.SCCACHE_PATH }}
        run: |
          & $env:SCCACHE_PATH --show-stats
          $stats = & $env:SCCACHE_PATH --show-stats --stats-format=json | ConvertFrom-Json
          if ($null -eq $stats.stats.compile_requests -or $null -eq $stats.cache_location) {
            Write-Host "::error::sccache reported no compile_requests/cache_location field; the assertion below cannot run and a null never matches, so this is a refusal rather than a pass"
            exit 1
          }
          if ($stats.stats.compile_requests -eq 0) {
            Write-Host "::error::sccache handled 0 compile requests; the launcher is not wired in"
            exit 1
          }
          if ($stats.cache_location -match 'Local disk') {
            Write-Host "::error::sccache is caching into '$($stats.cache_location)', which is deleted with this runner; SCCACHE_GHA_ENABLED did not take effect"
            exit 1
          }

      # The harness exercises both cl and clang-cl when they are on PATH, and
      # exits 77 if neither is — which must not silently pass, so it is checked.
      - name: "Compile-cache E2E (cl / clang-cl)"
        shell: pwsh
        run: |
          # Do not let a non-zero exit abort the step before the 77 check below:
          # a skip means nothing was verified and must fail rather than pass.
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -File src/apps/pace-cc/run-launcher-e2e.ps1 `
            -Fastcached out/build/cl-release/target/pace-kv.exe `
            -Launcher out/build/cl-release/target/pace-cc.exe `
            -EditStub out/build/cl-release/target/mid-compile-edit-stub.exe `
            -Port 21714
          $code = $LASTEXITCODE
          if ($code -eq 77) {
            Write-Host "::error::E2E skipped, nothing verified"
            exit 1
          }
          exit $code

  # Distribution packages. These jobs assert the properties that unit tests
  # cannot see and that only surface at install time: that the payload lands
  # where systemd and the FHS require, that the shipped config is registered as
  # a config file (so an upgrade never discards a local edit), that the unit
  # actually parses, and that installing the package really does leave a
  # running daemon serving traffic.

  package-linux:
    name: "Package (Linux .deb/.rpm)"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-package-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-package-

      # `save` on a branch push only; the reason is on the `linux` job's step.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-package
          max-size: 256M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      # rpm builds the .rpm on this Debian-family runner; systemd provides
      # systemd-analyze for the unit check below. g++-14 is symlinked as plain
      # `g++` because the gcc-release preset pins the bare name, which would
      # otherwise resolve to the runner's GCC 13 — no <print>, no build.
      #
      # `libyaml-cpp-dev` is deliberately STILL installed although the configure
      # below now tells CPM to ignore it (#1538). Removing it would make the
      # "nothing vendored is dynamic" step downstream pass vacuously: the hazard
      # has to be present for the flag that defeats it to be worth asserting.
      - name: "Install build tools"
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev rpm systemd g++-14
          sudo ln -sf /usr/bin/gcc-14 /usr/local/bin/gcc
          sudo ln -sf /usr/bin/g++-14 /usr/local/bin/g++

      - name: "Configure"
        # FASTCACHED_PACKAGE_ROOT_PREFIX is OFF by default so that a plain
        # `cmake --install --prefix /usr/local` stays conventional; the package
        # layout (payload rooted at /, units under usr/lib/systemd, config in
        # /etc) is opt-in and this is the job that opts in.
        # FASTCACHED_REQUIRE_EXACT_VERSION comes from the workflow-level env: block,
        # which is where the "only on a tag run" reasoning is written down.
        #
        # -DCPM_USE_LOCAL_PACKAGES=OFF is what makes the payload redistributable,
        # for the same reason the macOS package job passes it (#1538). With it ON
        # (the project default) CPM runs find_package(yaml-cpp) first, the runner's
        # libyaml-cpp-dev answers, and `YAML_BUILD_SHARED_LIBS OFF` in CMakeLists
        # is never read by anything — so the daemon links libyaml-cpp.so.0.8. The
        # .deb and .rpm survive that through SHLIBDEPS/AUTOREQ; the TGZ carries no
        # dependency metadata at all, and the TGZ is what FASTCACHE_AUTO_INSTALL
        # unpacks onto a developer's machine, where the loader kills it with 127.
        run: cmake --preset gcc-release -DCPM_USE_LOCAL_PACKAGES=OFF -DFASTCACHED_BUILD_TESTS=OFF -DFASTCACHED_PACKAGE_ROOT_PREFIX=ON -DFASTCACHED_REQUIRE_EXACT_VERSION=${{ env.FASTCACHED_REQUIRE_EXACT_VERSION }}

      # Why this step, why before Build, and why it gates the package but no merge: the header of
      # scripts/check-instruction-set-flags.sh (#1442).
      - name: "No global instruction-set flag in what ships"
        run: bash scripts/run-check.sh scripts/check-instruction-set-flags.sh out/build/gcc-release/compile_commands.json

      - name: "Build"
        run: cmake --build --preset gcc-release --target pace-kv pace-cc pace-node pacectl

      # The flag above is not the fact. A configure line is a claim; what ships is
      # the artefact, and the two have disagreed here for the whole life of this job.
      # This reads the ELF (#1538). It gates the package and no merge, exactly as the
      # instruction-set step above does and for the same reason.
      - name: "Nothing this project vendors is linked dynamically"
        run: bash scripts/run-check.sh scripts/check-vendored-libraries-static.sh out/build/gcc-release/target

      - name: "Package"
        working-directory: out/build/gcc-release
        run: cpack -G "DEB;RPM;TGZ"

      # The units are validated from the source tree (not the installed
      # system) so a typo or a bad directive fails here rather than at first
      # boot on a user's machine.
      - name: "Verify the systemd units parse"
        run: |
          set -euo pipefail
          # systemd-analyze reports problems on stderr but still exits 0 for
          # non-fatal findings, so grep for the ones that matter. The
          # ExecStart-not-executable note is expected: pace-kv is not
          # installed at /usr/bin in this step.
          #
          # The compile worker's two units are here too: they carry the most
          # hardening of any unit this project ships, and they were the ones left
          # out. A misspelled directive is "Unknown lvalue" up to systemd 255 and
          # "Unknown key" from 259 on -- both are matched, or the newer wording
          # passes a typo through as a clean verify.
          #
          # Herestrings rather than `echo | grep -Ev | grep -q`: under pipefail a
          # `grep -q` that exits at its first match can SIGPIPE the stage feeding
          # it, and the pipeline then reports "no finding" exactly when there was
          # one (build-and-toolchain.md).
          for unit in packaging/linux/pace-kv.service packaging/linux/pace-kv-user.service \
                      packaging/linux/pace-node.service packaging/linux/pace-node.socket; do
            echo "== $unit"
            out=$(systemd-analyze verify "$unit" 2>&1 || true)
            echo "$out"
            findings=$(grep -Ev 'is not executable|Unit .* not found' <<<"$out" || true)
            if grep -qiE 'error|invalid|bad|unknown (key|lvalue|section)' <<<"$findings"; then
              echo "::error::$unit failed verification"
              exit 1
            fi
          done

      - name: "Inspect the .deb payload"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          deb=$(ls fastcached_*.deb)
          echo "== contents"; dpkg -c "$deb"
          echo "== control"; dpkg -I "$deb"

          # Capture the listing once, then assert against the file: re-running
          # the query inside the loop is both slower and needlessly fragile.
          # Field 6 is the path; $NF would be wrong for any symlink entry,
          # which dpkg renders as "path -> target".
          dpkg -c "$deb" | awk '{print $6}' > /tmp/deb-paths.txt

          # The binaries, the units and the config must each land in the one
          # location that works; /usr/etc or /lib would silently never be read.
          for path in ./usr/bin/pace-kv ./usr/bin/pace-cc ./usr/bin/pace-node \
                      ./usr/lib/systemd/system/pace-kv.service \
                      ./usr/lib/systemd/user/pace-kv.service \
                      ./usr/lib/sysusers.d/fastcached.conf \
                      ./usr/lib/tmpfiles.d/fastcached.conf \
                      ./usr/lib/systemd/system/pace-node.service \
                      ./usr/lib/systemd/system/pace-node.socket \
                      ./usr/lib/sysusers.d/fastcache-node.conf \
                      ./etc/fastcached/pace-node.yaml \
                      ./etc/fastcached/fastcached.yaml; do
            grep -qx "$path" /tmp/deb-paths.txt || { echo "::error::missing $path"; exit 1; }
          done

          # An empty Architecture produces a package dpkg refuses to install.
          dpkg -I "$deb" | grep -qE '^ Architecture: [a-z0-9]+' \
            || { echo "::error::empty Architecture field"; exit 1; }

          # Without the conffiles entry an upgrade silently discards local edits.
          dpkg -e "$deb" /tmp/debcontrol
          # Both, and for the same reason: an upgrade that reset either one is a
          # silent regression. The worker's file is what makes it work at all, so
          # resetting it un-registers the worker with no error anywhere.
          for path in /etc/fastcached/fastcached.yaml /etc/fastcached/pace-node.yaml; do
            grep -qx "$path" /tmp/debcontrol/conffiles \
              || { echo "::error::$path not registered as a conffile"; exit 1; }
          done

      - name: "Inspect the .rpm payload"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          rpmfile=$(ls fastcached-*.rpm)
          echo "== contents"; rpm -qlp "$rpmfile"
          echo "== metadata"; rpm -qip "$rpmfile"

          rpm -qlp "$rpmfile" > /tmp/rpm-paths.txt
          rpm -qcp "$rpmfile" > /tmp/rpm-config.txt

          for path in /usr/bin/pace-kv /usr/bin/pace-cc /usr/bin/pace-node \
                      /usr/lib/systemd/system/pace-kv.service \
                      /usr/lib/systemd/user/pace-kv.service \
                      /usr/lib/sysusers.d/fastcached.conf \
                      /usr/lib/tmpfiles.d/fastcached.conf \
                      /usr/lib/systemd/system/pace-node.service \
                      /usr/lib/systemd/system/pace-node.socket \
                      /usr/lib/sysusers.d/fastcache-node.conf \
                      /etc/fastcached/pace-node.yaml \
                      /etc/fastcached/fastcached.yaml; do
            grep -qx "$path" /tmp/rpm-paths.txt || { echo "::error::missing $path"; exit 1; }
          done

          # Both, and for the same reason: an upgrade that reset either one is a
          # silent regression. The worker's file is what makes it work at all, so
          # resetting it un-registers the worker with no error anywhere.
          for path in /etc/fastcached/fastcached.yaml /etc/fastcached/pace-node.yaml; do
            grep -qx "$path" /tmp/rpm-config.txt \
              || { echo "::error::$path not marked %config"; exit 1; }
          done

      # The other direction. The two steps above assert that a config file the
      # package SHIPS is preserved across an upgrade; this one asserts that a
      # config file it USED to ship is taken off disk. Deleting the asset row
      # does not do that -- a package manager will not silently delete something
      # it has classified as an operator's to edit -- so the conffiles list
      # carries a `remove-on-upgrade` entry per retired path (#291, #383).
      #
      # A real upgrade of the real packages, in throwaway roots: a synthesised
      # predecessor ships each retired path as an ordinary conffile/%config, and
      # the built package is installed over it. `dpkg --unpack` suffices because
      # dpkg retires the conffile during unpack, before any maintainer script
      # runs, which is what lets this skip dependency resolution and scriptlets
      # and stay clear of the live-install steps below.
      #
      # BOTH package managers and BOTH operator states. rpm needs no retirement
      # mechanism of its own -- it already removes a dropped %config(noreplace)
      # file and keeps an edited one as .rpmsave -- and that is a claim about
      # somebody else's tool that this repository relies on and does not control,
      # so it is checked rather than trusted. Pristine and edited are different
      # code paths in both tools, and the pristine arm asserts there is NO
      # preserved sibling, or it is quietly the edited arm over again.
      - name: "Retired config files are removed on upgrade"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          check="$GITHUB_WORKSPACE/scripts/check-obsolete-conffiles.sh"
          bash "$check" --deb "$(ls fastcached_*.deb)"  "$GITHUB_WORKSPACE"
          bash "$check" --rpm "$(ls fastcached-*.rpm)" "$GITHUB_WORKSPACE"

      # The .rpm, installed where rpm is the package manager. The steps above only
      # INSPECT it; this one has dnf resolve its dependencies and run its
      # scriptlets on Fedora, under a real systemd in a container, then drives the
      # daemon and a socket-activated compile worker with a disk tier, a reinstall
      # and a removal. The worker leg is what #1674 needed: the 0.5.0 .rpm passes
      # every inspection above and fails it, refusing to start on a read-only
      # cache_dir. What each leg asserts is in the script's header.
      - name: "Install the .rpm on Fedora and exercise the services"
        working-directory: out/build/gcc-release
        run: bash "$GITHUB_WORKSPACE/scripts/rpm-package-e2e.sh" "$PWD/$(ls fastcached-*.rpm)"

      # Install for real and drive traffic through it. The GitHub runner has a
      # live systemd, so this exercises the actual unit — the service account,
      # the hardening, journald capture and the SIGHUP path all included.
      - name: "Install the .deb and exercise the service"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          sudo apt-get install -y ./$(ls fastcached_*.deb)

          # The postinst enables and starts the unit; it must already be up.
          sudo systemctl is-enabled pace-kv
          for _ in $(seq 1 30); do
            systemctl is-active --quiet pace-kv && break
            sleep 1
          done
          systemctl is-active --quiet pace-kv || {
            echo "::error::service did not start"; sudo journalctl -u pace-kv --no-pager; exit 1; }

          # Proves the daemon is NOT daemonizing: journald only sees stderr
          # from a foreground process.
          sudo journalctl -u pace-kv --no-pager | tee /tmp/fc-journal.txt
          grep -q 'ready, accepting connections' /tmp/fc-journal.txt \
            || { echo "::error::startup banner missing from the journal"; exit 1; }

          # It must run as the packaged system account, not as root.
          test "$(systemctl show -p User --value pace-kv)" = pace-kv

          # End-to-end round trip against the packaged default config.
          printf 'set k 0 0 5\r\nhello\r\nget k\r\nquit\r\n' | timeout 10 nc -q1 127.0.0.1 6674 | tee /tmp/fc-proto.txt
          grep -q STORED /tmp/fc-proto.txt
          grep -q hello  /tmp/fc-proto.txt

          # The machine-wide config may hold a secret, so the package restricts it
          # to the service account (#861). Assert the INSTALLED result: the ctest
          # check reads the scriptlet source, which cannot see a scriptlet that
          # did not run. Both halves matter -- unreadable to others AND readable
          # by the account the unit runs as, or the daemon cannot start.
          _mode=$(stat -c '%a %U:%G' /etc/fastcached/fastcached.yaml)
          test "$_mode" = "640 root:pace-kv" \
            || { echo "::error::config is '$_mode', expected '640 root:pace-kv'"; exit 1; }
          sudo -u pace-kv test -r /etc/fastcached/fastcached.yaml \
            || { echo "::error::the service account cannot read its own config"; exit 1; }

          # Reload must apply a reloadable setting rather than restart or fail.
          # Assert the edit actually landed: sed exits 0 when it matches
          # nothing, so a reflow of the shipped comment would silently turn this
          # into "reload an unchanged file", which passes without ever
          # exercising the SIGHUP path.
          sudo grep -q '^#log_level: info' /etc/fastcached/fastcached.yaml \
            || { echo "::error::the shipped yaml no longer contains '#log_level: info'; update this step"; exit 1; }
          sudo sed -i 's/^#log_level: info/log_level: debug/' /etc/fastcached/fastcached.yaml
          sudo grep -q '^log_level: debug' /etc/fastcached/fastcached.yaml \
            || { echo "::error::config edit did not apply"; exit 1; }
          sudo systemctl reload pace-kv
          sleep 2
          systemctl is-active --quiet pace-kv \
            || { echo "::error::service died on reload"; exit 1; }

          # A clean SIGTERM stop: a non-zero exit here would mean the unit
          # restart-loops in production.
          sudo systemctl stop pace-kv
          test "$(systemctl show -p Result --value pace-kv)" = success

      - name: "Socket-activate the compile worker on real systemd"
        run: |
          set -euo pipefail

          # The account the sysusers.d entry must have created. Without it the
          # unit fails to start with "user does not exist", which says nothing
          # about which package forgot to create it.
          id fastcache-node >/dev/null \
            || { echo "::error::the fastcache-node service account was not created"; exit 1; }

          # No scheduler: a node that serves is refused one, and serves the fleet its
          # formation record names -- its own, on this first start.
          # Written as YAML into the file the unit's ExecStart names, which is the
          # ONLY way to configure this worker since #291 -- an env file of
          # command-line arguments and a config file are two mechanisms that can
          # disagree about one setting, and nobody had written down which won.
          #
          # `cluster_dir` since #178 PR 6: a node keeps its identity key and its
          # formation record there. /var/lib/fastcache-node is the StateDirectory= the unit
          # creates for it -- the one writable place under ProtectSystem=strict that
          # survives a restart, so this step also pins that the unit provides it.
          #
          # And a disk tier at /var/cache/fastcache-node, the cache_dir the docs
          # give, which only the unit's CacheDirectory= makes writable: without it
          # the worker refuses to start on a read-only path, and no step here set a
          # cache_dir, which is how that shipped (#1674).
          printf 'advertise: 127.0.0.1:6674\ncluster_dir: /var/lib/fastcache-node\ntoolchain:\n  - /usr/bin/g++\ncache_memory: 64m\ncache_disk: 256m\ncache_dir: /var/cache/fastcache-node\n' \
            | sudo tee /etc/fastcached/pace-node.yaml >/dev/null

          # Enabling the SOCKET is what enables the worker; the service carries
          # no [Install] on purpose. And it supersedes pace-kv: both serve
          # 6674, the socket declares Conflicts= with Before= on the daemon, and
          # this is the takeover on a systemd older than the 259 the .rpm step
          # measured it on (#1676). pace-kv is started first because the step
          # above stopped it, and a fresh install leaves it running.
          sudo systemctl start pace-kv
          systemctl is-active --quiet pace-kv \
            || { echo "::error::pace-kv did not start again before the takeover"; exit 1; }
          sudo systemctl enable --now pace-node.socket
          systemctl is-active --quiet pace-node.socket \
            || { echo "::error::the socket unit did not start beside a running pace-kv"; sudo ss -ltnp || true; exit 1; }
          systemctl is-active --quiet pace-kv \
            && { echo "::error::enabling the node's socket left pace-kv running on the same port"; exit 1; }

          # Nothing should be running yet -- that is the whole point of
          # activation. An already-active service here means the socket was
          # bypassed and the unit is just an ordinary daemon.
          systemctl is-active --quiet pace-node \
            && { echo "::error::the service started without a connection"; exit 1; }

          # One connection activates it.
          timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6674' || true

          # Waited for by its OUTPUT, not by is-active. Type=simple is reported
          # active the moment systemd forks, while this worker still has to walk
          # its toolchain's include tree to compute a fingerprint -- seconds of
          # real work. Polling is-active therefore answers "has it started",
          # which is not the question; the first version of this step asked it
          # and read an empty journal.
          #
          # 240 rather than 90: that walk is thousands of cold stat and read
          # calls, and on a contended runner it outran 90s here while the
          # service sat "active (running)" on 894ms of CPU -- blocked on I/O,
          # not computing. `scripts/fleet-dashboard-e2e.sh` measured the same
          # cost directly and carries the numbers.
          for _ in $(seq 1 240); do
            sudo journalctl -u pace-node --no-pager > /tmp/node-log.txt 2>/dev/null || true
            grep -q 'compile node ready' /tmp/node-log.txt && break
            sleep 1
          done
          cat /tmp/node-log.txt
          grep -q 'compile node ready' /tmp/node-log.txt || {
            echo "::error::a connection did not bring the worker up"
            systemctl status pace-node --no-pager || true; exit 1; }

          # It must have ADOPTED the socket rather than bound its own, and that is
          # asserted on the STATE as well as on a log line.
          #
          # Until #1676 the socket held 6676 while the worker's own default was 6674,
          # so a worker that did not adopt bound 6674 beside it, logged readiness and
          # passed everything else here -- which is why this read "nothing listens on
          # 6674". The socket now holds 6674 itself, the worker's default, so that
          # worker cannot bind at all and the readiness wait above already fails.
          # What remains to show is POSITIVE: 6674 has exactly ONE listener, the
          # socket systemd bound, and the worker shares it -- `ss -p` names both pid 1
          # and the worker on that line. A connect probe could not say so: the socket
          # answers it whether or not the service adopted.
          command -v ss >/dev/null \
            || { echo "::error::ss is unavailable, so this step cannot tell an adopted socket from a bound one"; exit 1; }
          # Captured and matched through a herestring, never `ss ... | grep -q`: under
          # `pipefail` that pipeline is a false NEGATIVE on the success path, since
          # `grep -q` leaves at the first match and `ss` dies of SIGPIPE. Same trap as
          # `nm | grep -q __tsan_init` in build-and-toolchain.md.
          #
          # `if` rather than an `&&` chain: under `set -e` the good case would make a
          # chained form return non-zero and abort the step.
          held_6674="$(sudo ss -ltnpH 'sport = :6674' 2>/dev/null || true)"
          if [[ "$(grep -c LISTEN <<<"$held_6674")" != 1 || "$held_6674" != *'"systemd",pid=1,'* || "$held_6674" != *'"pace-node",pid='* ]]; then
            echo "::error::6674 is not the activated socket shared by the worker alone: ${held_6674}"
            sudo ss -ltnp || true; exit 1
          fi

          # And the sentence, which says the worker took the descriptor it was handed
          # rather than one it opened. Its wording changed with the flags: it named
          # `--bind` and `--port` until stage 3 deleted them.
          grep -q 'serving a socket-activated listener' /tmp/node-log.txt \
            || { echo "::error::the worker did not adopt the activated socket"; exit 1; }

          # The disk tier is open where the unit made room for it, and the store
          # belongs to the service account.
          grep -q 'disk 256M [a-z0-9]* at /var/cache/fastcache-node' /tmp/node-log.txt \
            || { echo "::error::the worker did not open a 256M disk tier at /var/cache/fastcache-node"; exit 1; }
          test "$(sudo stat -c '%U' /var/cache/fastcache-node/objects.cow)" = fastcache-node \
            || { echo "::error::the worker's store is not owned by fastcache-node"; exit 1; }

          test "$(systemctl show -p User --value pace-node)" = fastcache-node

          # The stop path, on real systemd and on an ADOPTED descriptor. This is
          # the assertion that matters most here: POSIX does not unblock a parked
          # accept() when the listener is closed, so a worker without a receive
          # timeout hangs until systemd escalates to SIGKILL -- and that bug has
          # already shipped once, on the ordinary bind path. `Result=success`
          # distinguishes a clean exit from a killed one; `is-system-running`
          # would not.
          sudo systemctl stop pace-node
          test "$(systemctl show -p Result --value pace-node)" = success \
            || { echo "::error::the worker did not stop cleanly"
                 sudo journalctl -u pace-node --no-pager; exit 1; }
          sudo systemctl stop pace-node.socket

      - name: "Verify an upgrade keeps local config edits"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          echo '# local edit that must survive' | sudo tee -a /etc/fastcached/fastcached.yaml >/dev/null
          sudo apt-get install -y --reinstall ./$(ls fastcached_*.deb)
          sudo grep -q 'local edit that must survive' /etc/fastcached/fastcached.yaml \
            || { echo "::error::upgrade discarded the local config edit"; exit 1; }
          sudo systemctl stop pace-kv || true

      - name: "Verify removal deregisters the service"
        run: |
          set -euo pipefail
          sudo apt-get purge -y pace
          test ! -e /usr/lib/systemd/system/pace-kv.service
          test ! -e /usr/lib/systemd/system/pace-node.service
          test ! -e /usr/lib/systemd/system/pace-node.socket
          # A leftover wants-symlink makes systemd log a failure on every boot.
          test ! -e /etc/systemd/system/multi-user.target.wants/pace-kv.service
          # The socket is the unit that gets enabled, so it is the one that
          # leaves a symlink behind if the postrm forgets it.
          test ! -e /etc/systemd/system/sockets.target.wants/pace-node.socket

      - name: "Upload packages"
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-linux-packages
          path: |
            out/build/gcc-release/fastcached_*.deb
            out/build/gcc-release/fastcached-*.rpm
            out/build/gcc-release/fastcached-*.tar.gz
          if-no-files-found: error

  package-macos:
    name: "Package (macOS .pkg)"
    runs-on: macos-15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-package-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-package-

      # `save` on a branch push only; the reason is on the `linux` job's step.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-package
          max-size: 256M
          save: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: "Install build tools"
        # Note what is NOT installed: llvm. The plain `macos` job above builds
        # with Homebrew's LLVM and bakes its libc++ rpath into the binary, which
        # is fine for running tests on the runner and fatal for a package —
        # every user would need Homebrew LLVM at that exact path. This job uses
        # AppleClang and the system libc++ on purpose.
        run: brew install ninja openssl@3

      - name: "Select a modern Xcode"
        # The image ships several Xcodes but *defaults* to 16.4, whose libc++
        # predates std::jthread (LLVM 18) — the server loop then fails to
        # compile with "no type named 'jthread' in namespace 'std'". The plain
        # `macos` job dodges this with Homebrew's LLVM; this job cannot, because
        # that would bake a Homebrew rpath into the shipped binary. Selecting a
        # newer *Apple* toolchain fixes it with no source change and keeps the
        # system libc++.
        #
        # Newest-installed rather than a pinned version, so an image refresh
        # that retires one Xcode does not break the release path.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          clang++ --version

      - name: "Verify the toolchain has the library features we need"
        # Asserted before the build so the failure names the cause. Otherwise a
        # toolchain regression surfaces as a wall of template errors deep in
        # ReactorServerLoop.cpp, which reads like a code bug rather than an
        # image change.
        run: |
          set -euo pipefail
          printf '#include <thread>\nint main(){ std::jthread t{[]{}}; }\n' > /tmp/probe.cpp
          clang++ -std=c++23 -mmacosx-version-min=13.3 -c /tmp/probe.cpp -o /dev/null \
            || { echo "::error::the selected Xcode's libc++ has no std::jthread (needs LLVM 18+)"; exit 1; }
          echo "std::jthread available"

      - name: "Decide whether this build can be signed"
        id: signing
        run: |
          # Gate on whether the secrets are actually reachable, not on the branch
          # name: GitHub withholds secrets from fork pull requests, which is the
          # real precondition. A branch test breaks every fork PR (codesign asked
          # for an identity in no keychain) *and* leaves the signing path
          # unexercised until after a merge.
          if [[ -n "$HAS_SIGNING_SECRETS" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no signing secrets (fork PR?); building an unsigned package"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Only its emptiness is observable here; the value never reaches the log.
          HAS_SIGNING_SECRETS: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}

      - name: "Install the Apple signing certificates"
        if: steps.signing.outputs.sign == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Two different certificate types are needed and they are not
          # interchangeable: "Developer ID Application" signs the Mach-O
          # binaries and the .dmg, "Developer ID Installer" signs the .pkg.
          #
          # -T grants the tools access to the imported key and
          # set-key-partition-list records that grant in the key's ACL. Without
          # both, codesign blocks on a GUI confirmation that never arrives on a
          # runner, and the job hangs until its timeout rather than reporting
          # anything useful.
          import_p12() {
            path="$RUNNER_TEMP/$1.p12"
            printf '%s' "$2" | base64 --decode -o "$path"
            security import "$path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
                            -k "$KEYCHAIN_PATH" \
                            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$path"
          }
          import_p12 application "$BUILD_CERTIFICATE_BASE64"
          import_p12 installer   "$INSTALLER_CERTIFICATE_BASE64"

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
                          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v "$KEYCHAIN_PATH"

      - name: "Decide whether a notarization stall fails this build"
        id: notary
        # ONE decision, read by the Configure step below and by the classifier
        # after `Package`, so the policy the build ran under and the policy the
        # log is judged against cannot disagree (#1156).
        #
        # A notarization **stall** is Apple's notary service not answering. It says
        # nothing about the artefact -- the run that filed #1156 stapled the .pkg
        # successfully and lost only the .dmg -- and it happened on roughly one in
        # five completed runs from a service this repository does not control. On a
        # ref that ships nothing that is noise on an unrequired context, which is
        # the exact shape #684 measured people learning to ignore.
        #
        # On a TAG it must stay fatal: `/publish-release` gates on every expected
        # asset being present, and an unnotarized .pkg is the "Apple could not
        # verify..." dialog the whole signing pipeline exists to avoid.
        #
        # Written as "OFF only when this is definitely a branch ref" so an
        # unrecognised `ref_type` keeps the STRICT answer. `pull_request`,
        # `merge_group` and a push to a branch all report `branch`.
        #
        # A REJECTION is not covered by this and must not be: that is Apple having
        # looked at the artefact and refused it, which is a fact about the package
        # and is fatal on every ref. See `FASTCACHED_NOTARY_VERDICTS`.
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          fatal=ON
          says="FAILS this build"
          if [[ "$REF_TYPE" == "branch" ]]; then
            fatal=OFF
            says="is reported and does not fail this build, because nothing ships from a branch ref"
          fi
          echo "stall_is_fatal=$fatal" >> "$GITHUB_OUTPUT"
          echo "::notice title=Notarization policy::Apple failing to answer $says (ref_type=$REF_TYPE). A rejection is fatal either way."

      - name: "Store the notarization credentials"
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # An App Store Connect API key rather than an Apple ID and
          # app-specific password: it carries no personal account, can be scoped
          # to the Developer role, and is revocable on its own.
          set -eu
          KEY_PATH=$RUNNER_TEMP/notary-key.p8
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode -o "$KEY_PATH"
          xcrun notarytool store-credentials fastcached-notary \
                --key "$KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID"
          # Everything downstream refers to the profile name only, so the key
          # material does not need to stay on disk.
          rm -f "$KEY_PATH"

      - name: "Configure"
        # -DCPM_USE_LOCAL_PACKAGES=OFF is what makes the package
        # redistributable: with it ON (the project default) CPM prefers
        # Homebrew's shared yaml-cpp and the daemon ends up linking
        # /opt/homebrew/opt/yaml-cpp/lib/libyaml-cpp.dylib, which exists on no
        # user's machine. OPENSSL_USE_STATIC_LIBS does the same job for TLS.
        run: |
          IDENTITY_APP=""
          IDENTITY_PKG=""
          NOTARIZE=OFF
          if [[ "${{ steps.signing.outputs.sign }}" == "true" ]]; then
            IDENTITY_APP="Developer ID Application: Christian Parpart (6T525MU9UR)"
            IDENTITY_PKG="Developer ID Installer: Christian Parpart (6T525MU9UR)"
            NOTARIZE=ON
          fi
          cmake -S . -B out/build/macos-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DFASTCACHED_BUILD_TESTS=OFF \
            -DFASTCACHED_PACKAGE_ROOT_PREFIX=ON \
            -DCPM_USE_LOCAL_PACKAGES=OFF \
            -DFASTCACHED_ENABLE_TLS=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DFASTCACHED_MACOS_SIGN_IDENTITY_APP="$IDENTITY_APP" \
            -DFASTCACHED_MACOS_SIGN_IDENTITY_PKG="$IDENTITY_PKG" \
            -DFASTCACHED_MACOS_NOTARIZE="$NOTARIZE" \
            -DFASTCACHED_MACOS_NOTARY_STALL_IS_FATAL="${{ steps.notary.outputs.stall_is_fatal }}" \
            -DFASTCACHED_REQUIRE_EXACT_VERSION=${{ env.FASTCACHED_REQUIRE_EXACT_VERSION }}

      # Why this step, why before Build, and why it gates the package but no merge: the header of
      # scripts/check-instruction-set-flags.sh (#1442).
      - name: "No global instruction-set flag in what ships"
        run: bash scripts/run-check.sh scripts/check-instruction-set-flags.sh out/build/macos-package/compile_commands.json

      - name: "Build"
        run: cmake --build out/build/macos-package --target pace-kv pace-cc pace-node pacectl

      - name: "Verify the binaries are redistributable"
        # The regression that would otherwise ship silently: everything builds,
        # every test passes, and the package refuses to launch on any machine
        # without the build host's Homebrew prefix.
        run: |
          set -euo pipefail
          for tool in pace-kv pace-cc pace-node pacectl; do
            binary="out/build/macos-package/target/$tool"
            echo "== $tool"; otool -L "$binary"
            strays="$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -v '^/usr/lib/' || true)"
            if [[ -n "$strays" ]]; then
              echo "::error::$tool links libraries outside /usr/lib:"; echo "$strays"; exit 1
            fi
            # The deployment target floor: 13.3 because std::format of a float
            # calls std::to_chars, which the system libc++ only gained then.
            otool -l "$binary" | grep -q 'minos 13.3' \
              || { echo "::error::$tool was not built for the pinned deployment target"; exit 1; }
          done

      - name: "Package"
        id: package
        # **This budget is derived from the sum of the bounds in
        # `cmake/MacOSNotarizePkg.cmake`, and it has to dominate them.** Every call
        # in that file is individually bounded and names itself when it fires; this
        # number's only job is to make sure one of THOSE writes the ending rather
        # than the runner, which answers "The action 'Package' has timed out" and
        # names no operation (#376).
        #
        # The longest path through the hook is the one where everything succeeds and
        # every call takes its whole bound (a rejection aborts earlier, and a
        # softened stall skips the stapling):
        #
        #   notarytool submit  .pkg   600   (per artefact, across attempts)
        #   stapler staple+validate   600   (2 x 300)
        #   hdiutil create            480   (2 attempts x 240)
        #   codesign --timestamp      300
        #   notarytool submit  .dmg   600
        #   stapler staple+validate   600   (2 x 300)
        #                           -----
        #                            3180 s = 53 min
        #
        # plus cpack's own work before the hook -- measured at 2.4 s on the run that
        # filed #1156, with 120 s allowed here for a cold packaging pass and the
        # XProtect wait below. 55 minutes, rounded up to 60.
        #
        # It was 30, under a comment claiming 20 minutes of worst case fitted: that
        # arithmetic counted ONE notarization call where the loop makes two, and it
        # counted neither the stapler nor hdiutil nor codesign. A longer STEP budget
        # is not the same trade as a longer CALL budget -- a call bound decides how
        # long a single stall goes unreported, and this one only decides who gets to
        # write the ending, so being generous costs nothing on the ~6-minute runs
        # that are normal and buys a legible failure on the pathological one.
        timeout-minutes: 60
        run: |
          set -euo pipefail
          # A clean slate, so an ABSENT record after this step means the post-build
          # hook did not run rather than that it ran and found nothing to say. The
          # classifier below reads that absence as its own outcome.
          rm -f out/build/macos-package/notarization-verdict.txt
          # hdiutil intermittently hangs on GitHub runners while XProtect scans
          # the image being created; see actions/runner-images#7522.
          #
          # Killing it once here is not enough on its own: XProtect is
          # launchd-managed and relaunches on demand, and cpack signs two
          # binaries and builds three component packages before it ever reaches
          # hdiutil. So this keeps it down for as long as cpack runs, and
          # MacOSNotarizePkg.cmake bounds the hdiutil call itself — belt and
          # braces, because the failure mode is a wedge rather than an error and
          # costs the job's whole 30 minutes.
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          while pgrep XProtect >/dev/null; do sleep 3; done

          # `set -m` so the reaper becomes a PROCESS GROUP LEADER, and the trap
          # then signals the group rather than the subshell (#516).
          #
          # `$!` is the subshell, and killing it leaves the `sleep 5` it has
          # already spawned running -- reparented, and still holding this step's
          # stdout. A step is not finished until every descriptor on its output
          # pipe closes, so the step hung on a process its own cleanup was
          # written to remove.
          #
          # MEASURED with a stand-in over a real pipe, five runs each: the step
          # body returned at ~301ms and the pipe stayed open until ~5036ms
          # before, and ~302ms after. So the exposure was one `sleep` interval,
          # about 4.7s -- BOUNDED, and worth stating plainly because this was
          # once mistaken for a 30-minute wedge. That wedge is #376, an unbounded
          # `notarytool --wait`, and it is a different defect in the same step;
          # fixing this one does not shorten it, and attributing a future wedge
          # to this would send somebody to the wrong place.
          #
          # `set +m` immediately after, because job control is wanted for the
          # fork and nowhere else. The group is fixed at fork time, so the
          # already-started reaper keeps its own group afterwards.
          set -m
          ( while :; do sudo pkill -9 XProtect >/dev/null 2>&1 || true; sleep 5; done ) &
          reaper=$!
          set +m
          trap 'kill -- -"$reaper" 2>/dev/null || true' EXIT
          cd out/build/macos-package && cpack -G "productbuild;TGZ"

      - name: "Classify the notarization outcome"
        # **Reports; it does not gate.** The `Package` step above is the gate and it
        # already fails on a fatal verdict; what was missing was anybody being TOLD
        # what the failure was. The annotation on that run read `Process completed
        # with exit code 1` and the last words in the log were `CPack Error: Cannot
        # initialize the generator TGZ`, for a failure that was Apple's notary
        # service not answering (#1156).
        #
        # `!cancelled()` rather than `always()`, and not `continue-on-error`: a
        # classifier that cannot run must say so. `.agent/rules/build-and-toolchain.md`
        # records a #376 probe that staged its helper badly, printed three lines,
        # and reported SUCCESS -- so this asserts it was REACHED, and has THREE
        # outcomes rather than the two anybody expects:
        #
        #   1. the record is there  -> one annotation per artefact, by name
        #   2. absent, Package PASSED -> the hook did not run. Nothing else catches
        #      this, so it is the one thing this step FAILS on
        #   3. absent, Package FAILED -> the failure was before notarization. Say so,
        #      and claim nothing about Apple
        #
        # A verdict token this step does not know is refused rather than ignored: a
        # row added to `FASTCACHED_NOTARY_VERDICTS` and not here must not pass
        # quietly, which is what an unguarded `*)` arm would do.
        if: ${{ !cancelled() }}
        env:
          RECORD: out/build/macos-package/notarization-verdict.txt
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          STALL_IS_FATAL: ${{ steps.notary.outputs.stall_is_fatal }}
        run: |
          set -uo pipefail

          if [[ ! -f "$RECORD" ]]; then
            if [[ "$PACKAGE_OUTCOME" == "success" ]]; then
              echo "::warning title=Notarization was not classified::the Package step succeeded and ${RECORD} was never written, so cmake/MacOSNotarizePkg.cmake did not run over any .pkg. Nothing here vouches for the notarization of the uploaded artefacts."
              exit 1
            fi
            echo "::notice title=Notarization was not reached::the Package step failed before the notarization hook ran, so this failure is NOT Apple's notary service. Read the step above."
            exit 0
          fi

          echo "notarization record:"; cat "$RECORD"
          unknown=0
          while read -r verdict name; do
            [[ -z "${verdict:-}" ]] && continue
            case "$verdict" in
              accepted)
                echo "::notice title=Notarized::${name}: Apple accepted the submission and the ticket is stapled." ;;
              disabled)
                echo "::notice title=Not notarized::${name}: notarization was not asked for on this build (no signing secrets, or a fork pull request)." ;;
              stalled)
                if [[ "$STALL_IS_FATAL" == "ON" ]]; then
                  echo "::error title=Apple did not answer::${name}: the notarization submission was not answered inside its budget. This is Apple's notary service and not this package -- compiling, signing and packaging all succeeded. Re-running the job usually meets an answer that is already waiting."
                else
                  echo "::warning title=Apple did not answer::${name}: the notarization submission was not answered inside its budget. This is Apple's notary service and not this package. Not fatal on this ref because nothing ships from it; the same outcome FAILS a tag build."
                fi ;;
              rejected)
                echo "::error title=Apple refused this artefact::${name}: the notary service answered and the answer was not Accepted. This one IS about the package -- the notarytool log is in the step above." ;;
              unstapled)
                echo "::error title=Notarization ticket could not be stapled::${name}: Apple accepted the submission and the ticket could not be attached, so an offline install would fall back to an online Gatekeeper check." ;;
              *)
                echo "::error title=Unknown notarization verdict::'${verdict}' for ${name} is in no row this step knows. A row was added to FASTCACHED_NOTARY_VERDICTS in cmake/MacOSNotarizePkg.cmake and not here."
                unknown=1 ;;
            esac
          done < "$RECORD"
          exit "$unknown"

      - name: "Inspect the .pkg payload"
        working-directory: out/build/macos-package
        run: |
          set -euo pipefail
          pkg=$(ls fastcached-*.pkg)
          echo "== choices"
          pkgutil --expand "$pkg" /tmp/pkgx
          grep -E '<choice id=' /tmp/pkgx/Distribution
          echo "== payload"
          pkgutil --payload-files "$pkg" | sort

          # The launchd registration must be offered as two separate, optional
          # choices, with the per-user agent preselected and the system daemon
          # not. A regression here silently changes what a click-through install
          # does to a user's machine.
          grep -q 'id="LaunchAgentChoice".*start_selected="true"' /tmp/pkgx/Distribution \
            || { echo "::error::the per-user agent is not preselected"; exit 1; }
          grep -q 'id="LaunchDaemonChoice".*start_selected="false"' /tmp/pkgx/Distribution \
            || { echo "::error::the system daemon is not opt-in"; exit 1; }

      - name: "Verify the signature and the notarization ticket"
        if: steps.signing.outputs.sign == 'true'
        working-directory: out/build/macos-package
        env:
          RECORD: notarization-verdict.txt
        run: |
          set -euo pipefail
          pkg=$(ls fastcached-*.pkg)
          dmg=$(ls fastcached-*.dmg)

          # Signing is independent of notarization, so this half is asserted
          # whatever Apple did.
          pkgutil --check-signature "$pkg"

          # The ticket half needs a ticket. On a tag a stall is fatal, so this step
          # is never reached with anything but `accepted` rows and the checks below
          # run exactly as they always have -- **a tag build's behaviour does not
          # change** (#1156). On a branch ref a stall is reported and not fatal, and
          # then `stapler validate` would fail for an artefact Apple never answered
          # about, naming stapler for the notary service's problem.
          #
          # Branched INSIDE the step rather than skipped with an `if:`, because a
          # skipped step reports and reads as passing -- the rule
          # `.agent/rules/metrics-and-observability.md` states as skipped-versus-absent
          # and `check-gated-jobs.sh` enforces one level up. What did not run is named.
          # Asserted rather than tolerated: a missing record here would leave
          # `unverifiable` empty, which is the same value a fully notarized build
          # produces, and the two must not agree.
          [[ -f "$RECORD" ]] || { echo "::error::$RECORD is missing, so nothing here can say whether these artefacts were notarized"; exit 1; }
          unverifiable="$(awk '$1 != "accepted" { print $2 }' "$RECORD")"
          if [[ -n "$unverifiable" ]]; then
            echo "::warning title=Notarization ticket not verified::these artefacts carry no notarization ticket, so their Gatekeeper and stapler checks were not run: $(echo "$unverifiable" | tr '\n' ' '). The notarization record is in the classifier step above; on a tag this state fails the build before reaching here."
            exit 0
          fi

          # The exact decision Gatekeeper makes when the user double-clicks it.
          spctl --assess --verbose=4 --type install "$pkg"
          # Stapled separately from the image: a ticket on the .dmg does not
          # travel with a .pkg dragged out of it, leaving an offline install
          # dependent on Gatekeeper reaching Apple.
          xcrun stapler validate "$pkg"
          xcrun stapler validate "$dmg"

      - name: "Exercise the launchd integration"
        run: ./scripts/macos-service-e2e.sh --pace-kv out/build/macos-package/target/pace-kv

      - name: "Install, exercise and remove the package"
        # --scope daemon, not the installer's default: a runner has no console
        # user with a GUI session, so the per-user agent's postinstall correctly
        # does nothing and there would be no running service to assert against.
        # A LaunchDaemon needs no login, so this variant verifies the whole chain
        # non-interactively — service account created via dscl, job bootstrapped
        # into the system domain, running as _fastcached, serving on the port,
        # and every trace removed by the uninstaller. The agent's launchd path is
        # covered by the macos-service-e2e.sh step above.
        #
        # The script skips (77 → a failed step) without passwordless sudo. That
        # is deliberate: on a runner sudo is always available, so its absence
        # means the test did not run and should not pass quietly.
        run: |
          sudo -n true || { echo "::error::passwordless sudo unavailable; the install test cannot run"; exit 1; }
          ./scripts/macos-package-e2e.sh --scope daemon --pkg "$(ls out/build/macos-package/fastcached-*.pkg)"

      - name: "Upload packages"
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-macos-packages
          path: |
            out/build/macos-package/fastcached-*.pkg
            out/build/macos-package/fastcached-*.dmg
            out/build/macos-package/fastcached-*.tar.gz
          if-no-files-found: error

  package-windows:
    name: "Package (Windows .msi)"
    runs-on: windows-2025
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Same backend, same version, same reasons as the `windows` job above, where
    # they are written out.
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-package-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-package-

      - name: "sccache"
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: "Install ninja"
        run: choco install ninja --no-progress

      # CPack's WIX generator drives the WiX 4/5 `wix.exe`; the runner image
      # ships only the unrelated WiX 3.14. WiX 4 also split the installer UI
      # out into a separate extension package, and CPack always references it
      # (WixUI_InstallDir) — without it wix.exe fails with
      # "error WIX0144: The extension 'WixToolset.UI.wixext' could not be found".
      #
      # No Util extension: the ProgramData ACL uses the built-in PermissionEx
      # element (MsiLockPermissionsEx), not util:PermissionEx, so the fragment
      # needs nothing here beyond what CPack already requires.
      - name: "Install WiX"
        run: |
          dotnet tool install --global wix --version 5.*
          wix extension add --global WixToolset.UI.wixext/5.0.2

      # Same toolset pin as the windows build matrix; see the comment there.
      - name: "Setup MSVC dev environment"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"

      - name: "Configure"
        # FASTCACHED_REQUIRE_EXACT_VERSION comes from the workflow-level env: block,
        # which is where the "only on a tag run" reasoning is written down.
        run: cmake --preset cl-release -DALLOW_SCCACHE_FALLBACK=ON -DFASTCACHED_BUILD_TESTS=OFF -DFASTCACHED_REQUIRE_EXACT_VERSION=${{ env.FASTCACHED_REQUIRE_EXACT_VERSION }}

      # Why this step, why before Build, and why it gates the package but no merge: the header of
      # scripts/check-instruction-set-flags.sh (#1442). Git Bash, because the wrapper converts its own paths for the
      # native cmake.
      - name: "No global instruction-set flag in what ships"
        shell: bash
        run: bash scripts/run-check.sh scripts/check-instruction-set-flags.sh out/build/cl-release/compile_commands.json

      - name: "Build"
        run: cmake --build --preset cl-release --target pace-kv pace-cc pace-node pacectl

      # Same assertion as the `windows` job, where the reasoning is written out.
      - name: "Assert sccache actually handled the build"
        shell: pwsh
        # mozilla-actions/sccache-action exports it to the job; the step names it, so what this step reads is
        # visible in the step (#1448).
        env:
          SCCACHE_PATH: ${{ env.SCCACHE_PATH }}
        run: |
          & $env:SCCACHE_PATH --show-stats
          $stats = & $env:SCCACHE_PATH --show-stats --stats-format=json | ConvertFrom-Json
          if ($null -eq $stats.stats.compile_requests -or $null -eq $stats.cache_location) {
            Write-Host "::error::sccache reported no compile_requests/cache_location field; the assertion below cannot run and a null never matches, so this is a refusal rather than a pass"
            exit 1
          }
          if ($stats.stats.compile_requests -eq 0) {
            Write-Host "::error::sccache handled 0 compile requests; the launcher is not wired in"
            exit 1
          }
          if ($stats.cache_location -match 'Local disk') {
            Write-Host "::error::sccache is caching into '$($stats.cache_location)', which is deleted with this runner; SCCACHE_GHA_ENABLED did not take effect"
            exit 1
          }

      # On failure CPack only says "check wix.log", which lives in the build
      # tree and is otherwise discarded with the runner — so the actual WiX
      # diagnostic never reaches the job output. Dump it here.
      - name: "Package"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          cpack -G "WIX;ZIP"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $log = '_CPack_Packages/win64/WIX/wix.log'
            if (Test-Path $log) {
              Write-Host "===== wix.log ====="
              Get-Content $log
            } else {
              Write-Host "no wix.log at $log"
            }
          }
          exit $code

      # An operator upgrading from the MSI they run TODAY, 0.3.0, whose uninstall
      # deletes both services and which leaves FastCached auto-starting on 6674. A
      # major upgrade runs that uninstall first, so the new package must register
      # both services again rather than trust them to survive. The upgrade states NO
      # property, as an operator who has read nothing types it: 0.3.0 remembered
      # nothing, and the node needs no property, so it must come out registered and
      # running -- which this case pins.
      #
      # Then two builds of THIS package upgrade one another, each direction being
      # possible because they share a version and CPack's MajorUpgrade allows the
      # same version: keeping both features (the node's registration must SURVIVE,
      # so no node property is passed), dropping pace-kv, then dropping the node
      # (each time the new product deletes the dropped feature's leftover
      # registration). Last, a fresh install told FASTCACHED_START_SERVICE=0. Every
      # transaction is followed by the service table it must leave
      # (scripts/lib/MsiServiceTable.psm1).
      #
      # 0.3.0 by name, and its asset pinned by digest and ProductCode: every
      # expectation about the starting point and the 3010 tolerance is a fact about
      # that one installer. The step after this one covers "the latest release".
      # The repository is named because the release is the product's, not whichever
      # fork runs this.
      #
      # This and the next step call the GitHub API, and they run BEFORE the MSI is
      # uploaded: on a tag build a GitHub API outage fails this job, and the release
      # job then refuses for want of the Windows packages, although the package
      # itself built.
      #
      # A script, because the subject is Windows Installer and the service control
      # manager across two packages, which no in-process test reaches.
      - name: "Upgrade from the 0.3.0 MSI, then between two builds of this one"
        shell: pwsh
        working-directory: out/build/cl-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/MsiServiceTable.psm1')
          # 0.3.0's installer registers its node only with a scheduler; this one takes none, and a
          # node that serves refuses one. Its advertise property is 0.3.0's; this package has none.
          $release030NodeProperties = @('FASTCACHE_NODE_SCHEDULER=127.0.0.1:6675', 'FASTCACHE_NODE_ADVERTISE=127.0.0.1:6674')
          $fastcachedOnly = 'ADDLOCAL=CM_C_Cli,CM_C_Daemon,CM_C_Launcher'
          $oldSession = 'Adding UPGRADINGPRODUCTCODE property|UPGRADINGPRODUCTCODE=\{'

          # The asset this step's expectations were written against. A release asset
          # can be replaced under the same tag; a different file is a different
          # subject, refused by name rather than tested.
          $release = 'v0.3.0'
          $releaseSha256 = 'BBF565C835A72D9F537F6869B3B46AC0176967A574F7CF7337AAC3FAE646CEAB'
          $releaseProductCode = '{FDCDAB73-40AF-4EDA-9340-7C33986C3207}'
          $old = Join-Path $env:RUNNER_TEMP 'previous-release'
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          gh release download $release --repo LASTRADA-Software/fastcached --pattern '*.msi' --dir $old --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download the $release MSI (gh exited $LASTEXITCODE)" }
          $previous = (Get-ChildItem -Path $old -Filter *.msi | Select-Object -First 1).FullName
          if (-not $previous) { throw "release $release carries no .msi, so this step cannot test the upgrade it exists for" }
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $previous).Hash
          if ($sha256 -ne $releaseSha256) { throw "the $release MSI's SHA256 is $sha256, not the pinned ${releaseSha256}: the asset was replaced" }
          if ((Get-MsiProperty $previous 'ProductCode') -ne $releaseProductCode) {
            throw "the $release MSI's ProductCode is $(Get-MsiProperty $previous 'ProductCode'), not the pinned $releaseProductCode"
          }

          # The build the Package step made, which the steps after this one install
          # and the upload ships, and a second cpack run of the same tree beside it.
          # CPack mints a ProductCode per run, so each is a major upgrade of the other.
          $first = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
          $newerDir = Join-Path $env:RUNNER_TEMP 'second-build'
          cpack -G WIX -B $newerDir
          if ($LASTEXITCODE -ne 0) { throw "the second cpack run failed with $LASTEXITCODE" }
          $newer = (Get-ChildItem -Path $newerDir -Filter *.msi | Select-Object -First 1).FullName
          if (-not $newer) { throw "the second cpack run left no .msi in $newerDir" }

          # Windows Installer's own rule for where RemoveExistingProducts may sit, asked of the
          # package BEFORE any install: ICE63. With it after InstallInitialize, an action that
          # writes to the execution script ahead of it is Error 2613 at run time, which ended
          # every upgrade in round 7; wix reports ICE63 as a warning, so it is judged here.
          # msi-custom-action-commands states the same rule over the fragment.
          $ice63 = @(& wix msi validate -ice ICE63 $first 2>&1)
          $ice63 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "wix msi validate -ice ICE63 exited $LASTEXITCODE" }
          if ($ice63 | Select-String -SimpleMatch 'ICE63') { throw "ICE63 refuses where RemoveExistingProducts sits (Error 2613 at run time)" }

          # What makes each transaction below an UPGRADE rather than a second
          # product or a repair, checked against the packages rather than assumed.
          $family = Get-MsiProperty $first 'UpgradeCode'
          foreach ($package in $previous, $newer) {
            if ((Get-MsiProperty $package 'UpgradeCode') -ne $family) { throw "$package is not of this package's family $family" }
          }
          $productOf = @{}
          foreach ($package in $previous, $first, $newer) { $productOf[$package] = Get-MsiProperty $package 'ProductCode' }
          if (@($productOf.Values | Sort-Object -Unique).Count -ne 3) {
            throw "two of the three packages share a ProductCode, so one install would be a repair: $($productOf.Values -join ', ')"
          }

          # The starting point: 0.3.0 with the node registered.
          Invoke-Msiexec -Leaves Release030WithNode -Released -Operation '/i' -Package $previous -Log 'previous.log' -Properties $release030NodeProperties -What "installing $release"
          Assert-InstalledProduct $family $productOf[$previous]
          Assert-ServiceTable -Row Release030WithNode -Log 'previous.log'

          # Exactly 0, as every upgrade here: 0.3.0 stops its services WITHOUT waiting, and this
          # package waits for their processes to exit before it replaces a file
          # (FastCacheAwaitServiceExit) -- 3010 was a file one of them still held, replaced at the
          # next boot, with the node's checked steps then running whichever binary was on the disk.
          # No property: the node registration exists and runs afterwards all the same.
          # And nothing the table did not ask for may happen DURING it, which a row read afterwards
          # cannot see: Invoke-Msiexec judges every transaction against the row it -Leaves (here: no
          # unexpected termination, and no start of FastCached, which NodeSelected leaves stopped).
          # FastCached ran before this upgrade, and PR 1634's CI MEASURED where its stray start came
          # from: 0.3.0's removal, nested in this upgrade with 0.3.0's own properties, opened a Restart
          # Manager session and shut FastCached down, and Windows Installer restarted it by name after
          # the whole transaction had ended ("Failed while restarting applications. Error: 352"), onto
          # the port the node holds. Nothing of this package can run after that, so the table leaves
          # FastCached DISABLED beside the node, and that start fails with no process.
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $first -Log 'upgrade.log' -What "the upgrade from $release"
          Assert-InstalledProduct $family $productOf[$first]
          # The control that keeps the judgement above from passing VACUOUSLY: the nested session did
          # shut FastCached down, so Windows Installer did try to restart it, and only the disabled
          # start type kept that from starting anything. Wording MEASURED on PR 1634's runner.
          Assert-MsiLog -Path 'upgrade.log' -Present 'RESTART MANAGER: Successfully shut down all applications in the service''s session that held files in use'
          # The ORDER is the fix (batch 4 review, B4-2): 0.3.0's own uninstall-service ran FIRST
          # (RemoveExistingProducts is scheduled afterInstallInitialize); the files waited for 0.3.0's
          # service processes; FastCached, kept and disabled, was stopped and its PROCESS waited
          # for -- it held 6674, which the node binds exclusively; and only then was the node
          # registered and started, both checked, so either failing fails the transaction above. And
          # what is registered now carries no --scheduler, which the node refuses at every start.
          Assert-MsiActionOrder -Path 'upgrade.log' -Actions 'FastCacheNodeUninstallService', 'FastCacheAwaitServiceExit', `
            'FastCachedAwaitExitForNode', 'FastCacheNodeInstallService', 'FastCacheNodeStartService'
          Assert-NodeRegistrationLacks '--scheduler'
          Assert-ServiceTable -Row NodeSelected -Log 'upgrade.log'

          # The upgrade re-applied an OLD, exposed 0.3.0 state directory: assert it is now
          # private, both directions. A 0.3.0 directory owned by the service or SYSTEM is
          # secured in place; one a foreign account owns or that was junctioned now REFUSES
          # the ACL by design, which would surface here as this assertion's throw.
          Assert-NodeStatePrivate
          # And its firewall opens what the service does: the record the 0.3.0 directory held is
          # read only after the install secured it, so the rules carry consensus and discovery.
          Assert-NodeFirewall

          # Keeping both features, with NO node property: the node is registered again
          # with none, and started. The old
          # product's ServiceControl rows stop each service, waiting, before a file
          # is replaced, so nothing is held and the exit is exactly 0. The old
          # product's half is in this log, which the first pattern proves, so the
          # absence of its uninstall-service actions is a finding and not a blind spot.
          #
          # And over the advertised endpoint an earlier package of this table REMEMBERED (W-10): planted as
          # that package wrote it, an IP literal a roaming laptop once typed. The property is gone, so the
          # upgrade must forget the value and register the node with no advertise flag at all.
          $installerKey = 'HKLM:\SOFTWARE\fastcached\Installer'
          New-Item -Path $installerKey -Force | Out-Null
          New-ItemProperty -Path $installerKey -Name 'NodeAdvertise' -Value '10.8.0.7:6674' -PropertyType String -Force | Out-Null
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $newer -Log 'upgrade-newer.log' -What 'an upgrade between two builds'
          Assert-InstalledProduct $family $productOf[$newer]
          Assert-MsiLog -Path 'upgrade-newer.log' -Present $oldSession, (Get-MsiActionRanPattern 'FastCacheForgetNodeAdvertise') `
            -Absent (Get-MsiActionRanPattern 'FastCacheNodeUninstallService'), (Get-MsiActionRanPattern 'FastCachedUninstallService')
          Assert-ServiceTable -Row NodeSelected -Log 'upgrade-newer.log'
          if ($null -ne (Get-ItemProperty -Path $installerKey -Name 'NodeAdvertise' -ErrorAction SilentlyContinue)) {
            throw "the upgrade left the remembered NodeAdvertise value in $installerKey; nothing reads it, and the property is gone"
          }
          Assert-NodeRegistrationLacks '--advertise'

          # Dropping pace-kv on an upgrade, the node kept without its properties:
          # the old product's half keeps pace-kv's registration, the new product
          # has no pace-kv.exe to remove it with, so sc.exe deletes the leftover.
          Invoke-Msiexec -Leaves NodeAlone -Operation '/i' -Package $first -Log 'upgrade-node-only.log' -Properties 'ADDLOCAL=CM_C_Cli,CM_C_Node' `
            -What 'an upgrade deselecting pace-kv'
          Assert-InstalledProduct $family $productOf[$first]
          Assert-MsiLog -Path 'upgrade-node-only.log' -Present $oldSession, (Get-MsiActionRanPattern 'FastCachedDeleteLeftover') `
            -Absent (Get-MsiActionRanPattern 'FastCachedUninstallService'), (Get-MsiActionRanPattern 'FastCacheNodeUninstallService')
          Assert-ServiceTable -Row NodeAlone -Log 'upgrade-node-only.log'

          # Dropping the node on an upgrade, the same way round: its leftover is
          # deleted by sc.exe, and pace-kv is registered again, auto and started.
          # And its FIREWALL GROUP goes with it (W-11): sc.exe removes no rule, so the fragment
          # removes the group. Populated first, or an empty group afterwards would prove nothing.
          # (pace-kv's group is not asserted the other way round: the daemon binds loopback by
          # default, opens no rule, and so leaves nothing to orphan here -- an empty group there is
          # true whether or not its removal works.)
          Assert-NodeFirewall
          Invoke-Msiexec -Leaves DaemonAlone -Operation '/i' -Package $newer -Log 'upgrade-deselect.log' -Properties $fastcachedOnly `
            -What 'an upgrade deselecting the node'
          Assert-InstalledProduct $family $productOf[$newer]
          Assert-MsiLog -Path 'upgrade-deselect.log' -Present $oldSession, (Get-MsiActionRanPattern 'FastCacheNodeDeleteLeftover'), `
            (Get-MsiActionRanPattern 'FastCacheNodeDeleteLeftoverFirewall') `
            -Absent (Get-MsiActionRanPattern 'FastCacheNodeUninstallService')
          Assert-ServiceTable -Row DaemonAlone -Log 'upgrade-deselect.log'
          Assert-FirewallGroupEmpty 'Pace: FastCacheCompileNode'

          Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $newer -Log 'uninstall-upgraded.log' -What 'uninstalling after the upgrades'
          Assert-InstalledProduct $family ''
          Assert-ServiceTable -Row NothingInstalled -Log 'uninstall-upgraded.log'

          # The opt-out: pace-kv registered auto and left stopped.
          Invoke-Msiexec -Leaves DaemonAloneUnstarted -Operation '/i' -Package $first -Log 'install-unstarted.log' -Properties $fastcachedOnly, 'FASTCACHED_START_SERVICE=0' `
            -What 'a fastcached-only install told not to start it'
          Assert-ServiceTable -Row DaemonAloneUnstarted -Log 'install-unstarted.log'
          Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $first -Log 'uninstall-unstarted.log' -What 'uninstalling the unstarted install'
          Assert-InstalledProduct $family ''
          Assert-ServiceTable -Row NothingInstalled -Log 'uninstall-unstarted.log'

          # Host C, the shared-cache machine (W-12): installed fastcached-only, then upgraded by a
          # double-click -- a plain /i of the newer package with NO ADDLOCAL. MigrateFeatureStates
          # carries the old selection over, so it must stay fastcached-only: the node neither
          # installed nor registered, and pace-kv auto and started as before.
          Invoke-Msiexec -Leaves DaemonAlone -Operation '/i' -Package $first -Log 'install-daemon-only.log' -Properties $fastcachedOnly `
            -What 'a fastcached-only install, host C'
          Assert-ServiceTable -Row DaemonAlone -Log 'install-daemon-only.log'
          Invoke-Msiexec -Leaves DaemonAlone -Operation '/i' -Package $newer -Log 'upgrade-daemon-only.log' `
            -What 'a plain upgrade of a fastcached-only install, no ADDLOCAL'
          Assert-InstalledProduct $family $productOf[$newer]
          Assert-MsiLog -Path 'upgrade-daemon-only.log' -Present $oldSession `
            -Absent (Get-MsiActionRanPattern 'FastCacheNodeInstallService'), (Get-MsiActionRanPattern 'FastCacheNodeStartService')
          Assert-ServiceTable -Row DaemonAlone -Log 'upgrade-daemon-only.log'
          Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $newer -Log 'uninstall-daemon-only.log' -What 'uninstalling host C'
          Assert-InstalledProduct $family ''
          Assert-ServiceTable -Row NothingInstalled -Log 'uninstall-daemon-only.log'

          # The steps below start from a clean machine: what 0.3.0 seeded, and the
          # identity key the node minted, are not what they assert about.
          Remove-FastCacheMachineState

      # The DERIVED leg: whatever release is the latest, upgraded to this build.
      # While that is 0.3.0 the step above is this leg, and this step says so. Once
      # a release carrying this package's service table is the latest, it is a
      # starting point the step above never reaches: installed with the node's two
      # properties it leaves the node selected, and the upgrade between it and this
      # build must exit exactly 0 and leave that row. A script for the previous
      # step's reason, and it calls the GitHub API for the reason given there.
      #
      # Two expectations it holds about that release, each failing closed:
      #   * It carries THIS service table. A hotfix cut from 0.3.x is the old
      #     installer under a newer tag, and fails the node-selected row after its
      #     own install -- a finding about that release, not about this build.
      #   * This build is not OLDER. A build's version comes from the nearest tag,
      #     so a branch that does not contain the latest release's tag would
      #     install as a downgrade, which msiexec refuses with 1603. That is
      #     refused before any install, naming the cause: rebase.
      - name: "Upgrade from the latest release, when that is not 0.3.0"
        shell: pwsh
        working-directory: out/build/cl-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/MsiServiceTable.psm1')
          $latest = gh release view --repo LASTRADA-Software/fastcached --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or -not $latest) { throw "could not read the latest release's tag (gh exited $LASTEXITCODE)" }
          if ($latest -eq 'v0.3.0') {
            Write-Host "::notice::the latest release is $latest, which the previous step upgrades from with its asset pinned; this leg is covered there"
          } else {
            $old = Join-Path $env:RUNNER_TEMP 'latest-release'
            New-Item -ItemType Directory -Force -Path $old | Out-Null
            gh release download $latest --repo LASTRADA-Software/fastcached --pattern '*.msi' --dir $old --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not download the $latest MSI (gh exited $LASTEXITCODE)" }
            $previous = (Get-ChildItem -Path $old -Filter *.msi | Select-Object -First 1).FullName
            if (-not $previous) { throw "release $latest carries no .msi, so this step cannot test the upgrade it exists for" }

            $first = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
            $family = Get-MsiProperty $first 'UpgradeCode'
            if ((Get-MsiProperty $previous 'UpgradeCode') -ne $family) { throw "$previous is not of this package's family $family" }
            $previousCode = Get-MsiProperty $previous 'ProductCode'
            $firstCode = Get-MsiProperty $first 'ProductCode'
            if ($previousCode -eq $firstCode) { throw "$latest and this build share the ProductCode $firstCode, so the upgrade would be a repair" }
            $downgrade = Get-UpgradeVersionVerdict (Get-MsiProperty $first 'ProductVersion') (Get-MsiProperty $previous 'ProductVersion') $latest
            if ($downgrade) { throw $downgrade }

            # The latest release's installer registers its node only with a scheduler, and that
            # registration carries `--scheduler`: the upgrade below, with no property, must
            # register the node again without it, or the service refuses every start.
            Invoke-Msiexec -Leaves NodeSelected -Released -Operation '/i' -Package $previous -Log 'latest.log' `
              -Properties 'FASTCACHE_NODE_SCHEDULER=127.0.0.1:6675', 'FASTCACHE_NODE_ADVERTISE=127.0.0.1:6674' -What "installing $latest"
            Assert-InstalledProduct $family $previousCode
            Assert-ServiceTable -Row NodeSelected -Log 'latest.log'

            Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $first -Log 'upgrade-latest.log' -What "the upgrade from $latest"
            Assert-InstalledProduct $family $firstCode
            Assert-ServiceTable -Row NodeSelected -Log 'upgrade-latest.log'

            Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $first -Log 'uninstall-latest.log' -What "uninstalling after the upgrade from $latest"
            Assert-InstalledProduct $family ''
            Assert-ServiceTable -Row NothingInstalled -Log 'uninstall-latest.log'
            Remove-FastCacheMachineState
          }

      # #1629: a deliberately FAILED upgrade must leave the machine exactly as it was. The shipped
      # MSI fails last when FASTCACHE_FAIL_FOR_TEST=1, behind every other script action, so the
      # rollback runs every rollback action we have. The scenario is chosen so that the upgrade
      # would CHANGE what is compared, and the last leg proves that a SUCCESSFUL run of it does:
      # N is installed fastcached-only into a custom root, and N+1 adds the node, which re-registers
      # pace-kv disabled and stopped and creates a second service.
      #
      # The upgrade KEEPS N's root. CPack's WiX generator searches INSTALL_ROOT from the old
      # product's Uninstall\<code>\InstallLocation (its `FindInstallLocation` RegistrySearch, in
      # the generated properties.wxi), so N+1 lands in the custom root too and pace-kv's
      # executable path never changes. A plain re-registration would therefore put the ImagePath
      # back as well as the exact restore does, and the custom root alone makes no ImagePath claim.
      # So N's registration carries ONE thing only the exact restore puts back (Set-NRegistration):
      # an extra `--log-level=info` on its command line, written through Win32_Service.Change as
      # the exact restore writes it. `--log-level` is a CliParser.cpp option row that
      # BuildServiceArgv re-emits only when it was typed (`emitIfExplicit`, ServiceControl.cpp), so
      # it survives a registration round trip, and `info` is the default: the daemon starts and
      # serves on its default binds with no new port or file. The twin FastCachedRestoreRegistration
      # runs `pace-kv.exe --install-service --service-start=<auto|manual>` plus its firewall
      # argument and nothing else, and the command line it registers is BuildServiceCommandLine of
      # THAT invocation (MakeDaemonServiceSpec), written whole by `Reapply`'s ChangeServiceConfig,
      # so it carries no `--log-level`. That the twin drops the flag is INFERRED from that code;
      # what is MEASURED is that FastCachedInstallService, an invocation of the same shape
      # (`--install-service --service-start=... [firewall]`), registered N as `"<root>bin\
      # pace-kv.exe" --daemon --service-name=FastCached` and nothing more (run 37452107865's
      # snapshot of N). The last leg measures it again: a successful upgrade's ImagePath changes.
      # The custom root stays, because it shows that an upgrade keeps it: the last leg asserts the
      # custom root's binary is still there after a SUCCESSFUL upgrade.
      #
      # Three controls run the same failure on patched COPIES, each isolating one claim:
      #   A  every rollback row that rewrites pace-kv's registration switched off -- the exact
      #      restore, its re-registration twin, and the undo -- so NOTHING puts it back: the
      #      comparison must go red on `service FastCached`, or it cannot see a restore that did
      #      not run.
      #   B  only the twin switched off: the comparison must be EMPTY, the exact restore putting N
      #      back alone with the shipped commit-phase discard. A `service FastCached` difference
      #      here is a defect in the exact restore, reported as one; any other field is outside
      #      its job and reported as that.
      #   C  the twin switched off AND the discard deferred again (its commit bit cleared): must go
      #      red on `service FastCached`. B and C differ ONLY in the discard's phase, which is what
      #      isolates the #1629 fix.
      # Switching off the exact restore ALONE could not discriminate while N's registration matched
      # what the twin rebuilds, which is why N now carries the flag: run 37452107865 MEASURED an
      # empty difference with both exact restores conditioned off, before N carried it. The twin is the INFERRED restorer -- the only remaining rollback row
      # that rewrites the registration, gated on the ImagePath AppSearch captured before the
      # transaction, reading no rollback state -- and control A now pins that inference: with the
      # twin off as well, the difference must appear. Hence the twin is off in B and C.
      # Not covered, by design: the window from RemoveExistingProducts to WriteRegistryValues
      # (ChecksBeforeTheRestores), and a failure after a leftover delete (nothing restores a
      # deleted service; this scenario keeps both features, so none is deleted).
      - name: "A failed upgrade restores the previous installation exactly"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/MsiServiceTable.psm1')
          $first = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
          $newer = (Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'second-build') -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $newer) { throw "no second build under RUNNER_TEMP\second-build: the upgrade step that makes it did not run" }
          $family = Get-MsiProperty $first 'UpgradeCode'
          $firstCode = Get-MsiProperty $first 'ProductCode'
          # Under Program Files, so the services' accounts can read it as they read the default root;
          # with a space, as Program Files itself has. The trailing backslash is a SPELLING, not a
          # requirement: it is the form Windows Installer itself writes a directory property in, and
          # CostFinalize would normalise a root given without it to the same thing. It is safe on the
          # command line because Start-Process joins an ArgumentList with plain spaces and msiexec
          # parses PROPERTY="value" itself, where a backslash before the closing quote is not an
          # escape (only "" is).
          $root = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'pace-kv 1629 root\'
          $fastcachedOnly = 'ADDLOCAL=CM_C_Cli,CM_C_Daemon,CM_C_Launcher'
          $withNode = 'ADDLOCAL=CM_C_Cli,CM_C_Daemon,CM_C_Launcher,CM_C_Node'
          $failedHere = 'CustomAction FastCacheFailForTest returned actual error code'
          $extraFlag = '--log-level=info'

          # What only the exact restore puts back (the header says why): a flag the twin's
          # re-registration does not build. Through the service manager, as the exact restore itself
          # writes, never into the key; restarted so the flagged command line is proven to SERVE
          # before the subject depends on it; and read back from the key the snapshot reads.
          function Set-NRegistration {
            $service = Get-CimInstance Win32_Service -Filter "Name='FastCached'"
            if (-not $service) { throw "FastCached is not registered, so N's registration cannot be set" }
            $changed = Invoke-CimMethod -InputObject $service -MethodName Change -Arguments @{ PathName = "$($service.PathName) $extraFlag" }
            if ($changed.ReturnValue -ne 0) { throw "Win32_Service.Change of FastCached's command line returned $($changed.ReturnValue)" }
            Restart-Service -Name FastCached -ErrorAction Stop
            Assert-ServiceState @{ FastCached = @('Auto', 'Running') } | Out-Null
            $key = Get-Item -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\FastCached'
            $imagePath = $key.GetValue('ImagePath', '', 'DoNotExpandEnvironmentNames')
            if (-not $imagePath.EndsWith(" $extraFlag")) { throw "FastCached's ImagePath reads '$imagePath', expected it to end in ' $extraFlag'" }
            Write-Host "N's FastCached: auto, running, ImagePath $imagePath"
          }
          function Install-N([string] $Log) {
            Invoke-Msiexec -Leaves DaemonAlone -Operation '/i' -Package $first -Log $Log -Properties $fastcachedOnly, "INSTALL_ROOT=`"$root`"" `
              -What 'build N, fastcached-only, into a custom root'
            Assert-InstalledProduct $family $firstCode
            Assert-ServiceTable -Row DaemonAlone -Log $Log
            Set-NRegistration
          }
          function Remove-All([string] $Log) {
            Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $first -Log $Log -What 'uninstalling build N'
            Assert-InstalledProduct $family ''
            Assert-ServiceTable -Row NothingInstalled -Log $Log
            Remove-FastCacheMachineState
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
          # A PowerShell function returns EVERYTHING it emits, so the helpers are piped to Out-Null
          # and the result is asserted to be the one snapshot rather than an array holding it.
          # -Expect RollsBack: no row describes what may START during a rollback, so none is judged, and
          # every unexpected termination still is -- the controls too, by analysis: each restores or
          # leaves pace-kv's REGISTRATION runnable, and starts it once the node's removal has stopped
          # the node. A control that crashes a service is a finding about that restore, never exempted.
          # SETTLED after the snapshot: the rollback's restart of pace-kv is an unwaited sc.exe start,
          # so a restore that cannot serve crashes after msiexec exits, past the exit's judgement.
          function Invoke-FailedUpgrade([string] $Package, [string] $Log, [string] $What) {
            Invoke-Msiexec -Expect RollsBack -Operation '/i' -Package $Package -Log $Log -Properties $withNode, 'FASTCACHE_FAIL_FOR_TEST=1' `
              -Accept @(1603) -What $What | Out-Null
            Assert-MsiLog -Path $Log -Present $failedHere | Out-Null
            $snapshot = Get-InstallationSnapshot -UpgradeCode $family -Root $root
            Assert-TransactionSettled | Out-Null
            if ($snapshot -isnot [System.Collections.Specialized.OrderedDictionary]) { throw "$What`: the snapshot is a $($snapshot.GetType().FullName), not one ordered dictionary" }
            return $snapshot
          }
          function Show-Snapshot($Snapshot, [string] $Title) {
            Write-Host "== $Title"
            foreach ($field in $Snapshot.Keys) { foreach ($line in $Snapshot[$field]) { Write-Host "  $field | $line" } }
          }
          # A control's reset must put build N back EXACTLY, or a control could go red for reset residue
          # rather than for its patch: uninstall, clean, reinstall, and compare with the first snapshot.
          function Reset-ToN([string] $Tag) {
            Remove-All "$Tag-uninstall.log"
            Install-N "$Tag-reinstall.log"
            $fresh = Get-InstallationSnapshot -UpgradeCode $family -Root $root
            $residue = @(Compare-InstallationSnapshot -Before $before -After $fresh)
            if ($residue.Count) { Show-Snapshot $fresh "after the $Tag reset"; throw "the $Tag reset did not reinstall build N exactly, so the next leg would compare against residue:`n$($residue -join "`n")" }
            Write-Host "the $Tag reset reinstalled build N exactly ($($before.Count) fields)"
          }

          Remove-FastCacheMachineState
          Install-N 'n-install.log'
          $before = Get-InstallationSnapshot -UpgradeCode $family -Root $root
          if ($before -isnot [System.Collections.Specialized.OrderedDictionary]) { throw "the snapshot before is not one ordered dictionary" }
          Show-Snapshot $before 'build N, before'

          # The subject: the real package fails last, and everything comes back.
          $after = Invoke-FailedUpgrade $newer 'failed-upgrade.log' 'an upgrade made to fail last'
          $diff = @(Compare-InstallationSnapshot -Before $before -After $after)
          if ($diff.Count) { Show-Snapshot $after 'after the failed upgrade'; throw "the failed upgrade did not restore build N exactly:`n$($diff -join "`n")" }
          Write-Host "the failed upgrade restored all $($before.Count) fields exactly"

          # The controls. Each is a patched copy of N+1 put through the same failed upgrade, read back
          # before it runs (New-MsiControlCopy's -Verify), and followed by Reset-ToN. A row is switched
          # off by conditioning it '0'; its read-back is the same condition.
          function Get-RowsSwitchedOff([string[]] $Actions) {
            $verify = @{}
            foreach ($action in $Actions) { $verify["SELECT ``Condition`` FROM ``InstallExecuteSequence`` WHERE ``Action``='$action'"] = '0' }
            return @{
              Statements = @(foreach ($action in $Actions) { "UPDATE ``InstallExecuteSequence`` SET ``Condition``='0' WHERE ``Action``='$action'" })
              Verify = $verify }
          }
          function Invoke-Control([string] $Tag, [string] $What, [string[]] $Statements, [hashtable] $Verify) {
            $copy = Join-Path $env:RUNNER_TEMP "$Tag.msi"
            New-MsiControlCopy -Package $newer -Destination $copy -Statements $Statements -Verify $Verify | Out-Null
            $differences = @(Compare-InstallationSnapshot -Before $before -After (Invoke-FailedUpgrade $copy "$Tag.log" $What))
            Write-Host "$What, differences:`n  $($differences -join "`n  ")"
            return $differences
          }
          # The twin: re-registers pace-kv through its own --install-service, from what AppSearch
          # captured before the transaction, so it needs no rollback state at all.
          $twinOff = Get-RowsSwitchedOff @('FastCachedRestoreRegistration')

          # Control A: the comparison sees a restore that did not run. EVERY rollback row that
          # rewrites pace-kv's registration is off:
          #   FastCachedRestoreRegistrationExactly  the exact restore, from the rollback state;
          #   FastCachedRestoreRegistration         its re-registration twin;
          #   FastCachedUndoRegistration            the undo of a registration the transaction
          #                                         CREATED -- conditioned NOT FASTCACHED_IMAGEPATH,
          #                                         so already false here, and off so the claim
          #                                         holds of the package rather than of this
          #                                         scenario's properties.
          # Not rows of this kind, so left on: FastCachedRestartAfterStop (starts the service, the
          # `state` field, never the registration), Windows Installer's own StopServices rollback
          # (FastCachedStopForFiles, Stop only), and the node's rows (FastCacheCompileNode's).
          $allOff = Get-RowsSwitchedOff @('FastCachedRestoreRegistrationExactly', 'FastCachedRestoreRegistration', 'FastCachedUndoRegistration')
          $control = @(Invoke-Control 'control-no-restore' "control A: every restore of pace-kv's registration switched off" $allOff.Statements $allOff.Verify)
          if (-not ($control | Where-Object { $_ -like 'service FastCached:*' })) { throw "control A did not go red on pace-kv's registration, so the comparison cannot see a restore that did not run" }
          Reset-ToN 'control-no-restore'

          # Control B: the exact restore works ALONE. Only the twin is off, the shipped commit-phase
          # discard kept: the exact restore must put build N back by itself. A difference in
          # pace-kv's registration is not a weak control; it is a defect in the exact restore,
          # which the twin was masking. Any OTHER field is outside the exact restore's job, and is
          # reported as that rather than blamed on it.
          $control = @(Invoke-Control 'control-exact-alone' 'control B: only the twin switched off' $twinOff.Statements $twinOff.Verify)
          if ($control.Count) {
            $registration = @($control | Where-Object { $_ -like 'service FastCached:*' })
            $elsewhere = @($control | Where-Object { $_ -notlike 'service FastCached:*' })
            $findings = @()
            if ($registration.Count) {
              Write-Host "::error title=The exact restore is defective::with its re-registration twin switched off, FastCachedRestoreRegistrationExactly did not restore pace-kv's registration by itself; the twin was masking it"
              $findings += "a DEFECT in FastCachedRestoreRegistrationExactly, not in this check, which must not be loosened:`n$($registration -join "`n")"
            }
            if ($elsewhere.Count) {
              Write-Host "::error title=Control B differs outside the exact restore's job::fields the exact restore does not write differ with only the twin switched off"
              $findings += "fields OUTSIDE the exact restore's job (it writes only pace-kv's registration), so not its defect:`n$($elsewhere -join "`n")"
            }
            throw "control B: with only the twin switched off, build N did not come back:`n$($findings -join "`n")"
          }
          Write-Host "control B: the exact restore alone restored all $($before.Count) fields"
          Reset-ToN 'control-exact-alone'

          # Control C: a discard inside the script costs the exact restore its state. The twin off as
          # in B, and FastCacheDiscardRollbackState deferred again (commit bit cleared): B and C differ
          # ONLY in the discard's phase, which isolates the #1629 fix.
          # Read the shipped Type, assert the commit bit (0x200) is set, and clear it.
          $type = [int](Get-MsiCustomActionType $newer 'FastCacheDiscardRollbackState')
          if (-not ($type -band 0x200)) { throw "FastCacheDiscardRollbackState has Type $type, without the commit bit: the fix is not in this package" }
          $cleared = $type -band (-bnot 0x200)
          $deferredVerify = $twinOff.Verify.Clone()
          $deferredVerify["SELECT ``Type`` FROM ``CustomAction`` WHERE ``Action``='FastCacheDiscardRollbackState'"] = "$cleared"
          $control = @(Invoke-Control 'control-deferred-discard' 'control C: the twin switched off and the rollback state discarded in the script' `
            ($twinOff.Statements + "UPDATE ``CustomAction`` SET ``Type``=$cleared WHERE ``Action``='FastCacheDiscardRollbackState'") $deferredVerify)
          if (-not ($control | Where-Object { $_ -like 'service FastCached:*' })) { throw "control C did not go red: a discard inside the script must cost the exact restore its state" }
          Reset-ToN 'control-deferred-discard'

          # The scenario discriminates: a SUCCESSFUL run of the same upgrade changes every field the
          # subject relied on, and never runs the failure action. Each field below is one whose READER
          # nothing else shows live: an unchanged field is equal on both sides however it was read, so
          # a reader that returned nothing would pass the subject. Only fields a successful N -> N+1
          # upgrade really changes are required: pace-kv's ImagePath (the extra flag goes) and Start
          # (disabled under the node's table), its state, the node's registration, the installed
          # product, and the node's firewall group. Never `binary`: the upgrade keeps N's root (see
          # the header), so the custom root's binary must still be THERE, which is asserted instead.
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $newer -Log 'succeeded-upgrade.log' -Properties $withNode -What 'the same upgrade, succeeding'
          Assert-MsiLog -Path 'succeeded-upgrade.log' -Present (Get-MsiActionRanPattern 'FastCacheNodeStartService') -Absent (Get-MsiActionRanPattern 'FastCacheFailForTest')
          $changed = @(Compare-InstallationSnapshot -Before $before -After (Get-InstallationSnapshot -UpgradeCode $family -Root $root))
          Assert-TransactionSettled
          Write-Host "a successful upgrade changes:`n  $($changed -join "`n  ")"
          foreach ($field in 'service FastCached', 'state FastCached', 'service FastCacheCompileNode', 'products',
                             'firewall Pace: FastCacheCompileNode') {
            if (-not ($changed | Where-Object { $_ -like "${field}:*" })) { throw "a successful upgrade left '$field' unchanged, so the failed one proved nothing about it" }
          }
          foreach ($value in 'ImagePath', 'Start') {
            if (-not ($changed | Where-Object { $_ -like 'service FastCached:*' -and $_ -match "\b$value\b" })) { throw "a successful upgrade left pace-kv's $value unchanged, so the failed one proved nothing about it" }
          }
          $kept = Join-Path $root 'bin\pace-kv.exe'
          if (-not (Test-Path -LiteralPath $kept)) { throw "a successful upgrade did not keep N's custom root: $kept is gone" }
          Write-Host "a successful upgrade kept N's custom root: $kept is present"
          Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $newer -Log 'succeeded-uninstall.log' -What 'uninstalling after the successful upgrade'
          Assert-InstalledProduct $family ''
          Assert-ServiceTable -Row NothingInstalled -Log 'succeeded-uninstall.log'
          Remove-FastCacheMachineState
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue

      # First the DEFAULT install, a plain /i naming no feature and no property, as
      # an operator who double-clicks the package gets it: every feature is selected
      # by default, so the node is registered auto and running and pace-kv disabled
      # and stopped. The [msi] round trip in DocumentedCommandLines_test proves the
      # no-property COMMAND parses and installs; only this transaction proves the
      # package's default feature selection reaches it. Uninstalled again, and the
      # machine state cleared, so what follows starts clean.
      #
      # Then a fresh install naming the fastcached-only features, and the service table
      # it must leave: pace-kv auto and serving, no node registered, and the
      # install's bin on the machine PATH, which rides the REQUIRED Cli feature.
      - name: "Install the MSI and verify the service"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/MsiServiceTable.psm1')
          function Show-InstallLog { Show-MsiLog 'install.log' }
          $msi = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName

          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $msi -Log 'install-default.log' -What 'the default install'
          Assert-ServiceTable -Row NodeSelected -Log 'install-default.log'
          Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $msi -Log 'uninstall-default.log' -What 'uninstalling the default install'
          Assert-ServiceTable -Row NothingInstalled -Log 'uninstall-default.log'
          Remove-FastCacheMachineState

          Invoke-Msiexec -Leaves DaemonAlone -Operation '/i' -Package $msi -Log 'install.log' `
            -Properties 'ADDLOCAL=CM_C_Cli,CM_C_Daemon,CM_C_Launcher' -What 'a fastcached-only install'

          Assert-ServiceTable -Row DaemonAlone -Log 'install.log'
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike '*\fastcached\bin*') { throw "machine PATH lacks the install's bin: $machinePath" }

          # The identity it logs on as. Told nothing, CreateService uses LocalSystem
          # -- unrestricted access to every local resource, and a member of the local
          # Administrators group. A cache daemon listening on a socket needs none of
          # it. Asserted here because this is a SHIPPED service whose identity
          # changed: if the virtual account cannot log on, the service simply never
          # starts, and the check above would be the only thing that noticed.
          $svc = Get-CimInstance Win32_Service -Filter "Name='FastCached'"
          if ($svc.StartName -ne 'NT SERVICE\FastCached') {
            Show-InstallLog
            throw "daemon runs as '$($svc.StartName)', expected NT SERVICE\FastCached"
          }

          # Running is not serving. The virtual account has to be able to read the
          # config it was seeded and bind its port, and only an actual round trip
          # says so -- a job can reach Running and then fail its first request.
          $reply = ''
          for ($i = 0; $i -lt 30 -and -not $reply; $i++) {
            try {
              $c = New-Object Net.Sockets.TcpClient('127.0.0.1', 6674)
              $st = $c.GetStream()
              $w = New-Object IO.StreamWriter($st); $w.NewLine = "`r`n"; $w.AutoFlush = $true
              $w.WriteLine('set k 0 0 5'); $w.WriteLine('hello'); $w.WriteLine('get k')
              $r = New-Object IO.StreamReader($st)
              $c.ReceiveTimeout = 5000
              $reply = $r.ReadLine() + '|' + $r.ReadLine() + '|' + $r.ReadLine()
              $c.Close()
            } catch { Start-Sleep 1 }
          }
          if ($reply -notmatch 'STORED' -or $reply -notmatch 'hello') {
            Show-InstallLog
            throw "daemon did not serve on 6674 under its virtual account: '$reply'"
          }
          Write-Host "daemon serving as $($svc.StartName)"

          # **Honoured or ignored: this is the only assertion that can tell them
          # apart**, and its absence is why #860 went unseen from 2026-08-25.
          #
          # The round trip above is on 6674, the BUILT-IN DEFAULT, so a daemon that
          # reads its machine-wide config and one that silently ignores it produce the
          # IDENTICAL observation. `ResolveDefaultConfigPath` skips every
          # `ConfigScope::System` row unless `IsPrivilegedProcess()`, which on Windows
          # asked only about BUILTIN\Administrators -- and the service moved to a
          # virtual account, which is a service principal and not an administrator.
          #
          # So: name a NON-DEFAULT port in the seeded config, restart, and require an
          # answer THERE. Honoured and ignored now differ. Asserting what
          # DISTINGUISHES is the whole point -- the 6674 round trip stays, because it
          # is the control that says the daemon still serves at all.
          $cfg = "$env:ProgramData\fastcached\fastcached.yaml"
          Add-Content -Path $cfg -Value "`nport: 6699"
          Restart-Service FastCached -Force
          $moved = ''
          for ($i = 0; $i -lt 30 -and -not $moved; $i++) {
            try {
              $c = New-Object Net.Sockets.TcpClient('127.0.0.1', 6699)
              $st = $c.GetStream()
              $w = New-Object IO.StreamWriter($st); $w.NewLine = "`r`n"; $w.AutoFlush = $true
              $w.WriteLine('set m 0 0 5'); $w.WriteLine('moved'); $w.WriteLine('get m')
              $r = New-Object IO.StreamReader($st)
              $c.ReceiveTimeout = 5000
              $moved = $r.ReadLine() + '|' + $r.ReadLine() + '|' + $r.ReadLine()
              $c.Close()
            } catch { Start-Sleep 1 }
          }
          if ($moved -notmatch 'STORED' -or $moved -notmatch 'moved') {
            Show-InstallLog
            throw ("the service did not honour its machine-wide config: it was told port 6699 and did not answer " +
                   "there. That is #860 -- the System config row is skipped and the daemon runs on built-in " +
                   "defaults, silently. Reply was: '$moved'")
          }
          Write-Host "daemon honoured its machine-wide config (answered on 6699)"

      # The service table under a FEATURE CHANGE, the transaction nothing above
      # runs: adding the node disables pace-kv and stops it (both would
      # answer on 6674), removing the node gives pace-kv back its auto start and
      # removes the node's registration. A script for the previous steps' reason.
      - name: "Changing features re-applies the service table"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/MsiServiceTable.psm1')
          $msi = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName

          # A node that cannot START on a pace-kv machine (batch 4 review, B4-1): the transaction
          # fails, and the rollback leaves pace-kv exactly as it found it -- auto again (the node
          # had disabled it), RUNNING again (the transaction stopped it for the node), and its
          # command line and remembered scope unchanged. pace-kv serves on 6699 here (the step
          # above moved it), so a listener this step holds on 6674 is what the node cannot bind: it
          # refuses inside its body, never reports RUNNING (it reports running once it serves), and
          # its checked start fails. Empty and absent are one remembered scope (install.md). And its
          # LIVE firewall rules (R4-3): the transaction re-registered pace-kv with a scope of
          # 10.0.0.0/8, which rewrites them, so the remembered scope coming back says nothing about
          # what the firewall admits.
          #
          # A loopback-only pace-kv -- the shipped default -- has NO rules, and an empty group
          # unchanged proves nothing, so for this case alone it faces the network: `bind: 0.0.0.0`
          # in the machine-wide file, which the transaction's registration and the rollback's both
          # derive the rules from (a --bind in the command line would come back with the exact
          # restore and never be re-derived), registered as FastCachedInstallService registers it,
          # with the remembered scope. Undone after the case, so later steps see loopback again.
          $scopeBefore = "$((Get-ItemProperty -Path 'HKLM:\SOFTWARE\fastcached\Installer' -ErrorAction SilentlyContinue).FirewallAllow)"
          $cfg = "$env:ProgramData\fastcached\fastcached.yaml"
          $cfgBefore = Get-Content -Raw -LiteralPath $cfg
          $fastcachedExe = @(Split-RegisteredCommandLine (Get-CimInstance Win32_Service -Filter "Name='FastCached'").PathName)[0]
          $register = @('--install-service', '--service-start=auto') + @(if ($scopeBefore) { "--firewall-allow=$scopeBefore" })
          Add-Content -Path $cfg -Value "`nbind: 0.0.0.0"
          & $fastcachedExe @register
          if ($LASTEXITCODE -ne 0) { throw "re-registering pace-kv to face the network exited $LASTEXITCODE" }
          $fastcachedBefore = Get-CimInstance Win32_Service -Filter "Name='FastCached'"
          $fastcachedFirewallBefore = Get-FirewallGroupSnapshot 'Pace: FastCached'
          $fastcachedFirewallBefore | ForEach-Object { Write-Host "  before: $_" }
          $hold = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Any, 6674)
          $hold.ExclusiveAddressUse = $true
          $hold.Start()
          try {
            Invoke-Msiexec -Expect NodeCannotBind -Operation '/i' -Package $msi -Log 'add-node-refused.log' -What 'adding the node while 6674 is held' `
              -Properties 'ADDLOCAL=CM_C_Node', 'FASTCACHE_FIREWALL_ALLOW=10.0.0.0/8' -Accept @(1603)
          } finally {
            $hold.Stop()
          }
          Assert-MsiLog -Path 'add-node-refused.log' -Present 'CustomAction FastCacheNodeStartService returned actual error code', `
            (Get-MsiActionRanPattern 'FastCachedStopForNode'), (Get-MsiActionRanPattern 'FastCachedAwaitExitForNode')
          Assert-ServiceTable -Row DaemonAlone -Log 'add-node-refused.log'
          $fastcachedAfter = Get-CimInstance Win32_Service -Filter "Name='FastCached'"
          if ($fastcachedAfter.PathName -cne $fastcachedBefore.PathName) {
            throw "the failed node install left pace-kv registered as '$($fastcachedAfter.PathName)', not '$($fastcachedBefore.PathName)'"
          }
          $scopeAfter = "$((Get-ItemProperty -Path 'HKLM:\SOFTWARE\fastcached\Installer' -ErrorAction SilentlyContinue).FirewallAllow)"
          if ($scopeAfter -cne $scopeBefore) {
            throw "the failed node install left the remembered firewall scope '$scopeAfter', not '$scopeBefore'"
          }
          Assert-FirewallGroupUnchanged -Group 'Pace: FastCached' -Before $fastcachedFirewallBefore
          Write-Host "the node that could not start rolled back to pace-kv auto, running and registered as before, its firewall rules unchanged"
          # Loopback again, as every later step expects: the file as it was, and a registration that
          # removes the rules the case opened.
          Set-Content -LiteralPath $cfg -Value $cfgBefore -NoNewline
          & $fastcachedExe @register
          if ($LASTEXITCODE -ne 0) { throw "re-registering pace-kv on loopback exited $LASTEXITCODE" }
          Assert-FirewallGroupEmpty 'Pace: FastCached'

          # No property at all: this package has no advertised-endpoint property (W-10), so the node is
          # registered with no advertise flag and advertises this machine's name.
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $msi -Log 'add-node.log' -What 'adding the node feature' `
            -Properties 'ADDLOCAL=CM_C_Node'
          Assert-ServiceTable -Row NodeSelected -Log 'add-node.log'

          # The node's state directory, and the identity key in it, answer to nobody but
          # SYSTEM, Administrators and the service. The assertion is shared with the upgrade
          # step (MsiServiceTable.psm1), so the two cannot drift.
          Assert-NodeStatePrivate
          Assert-NodeFirewall

          # The firewall scope is REMEMBERED: every transaction re-registers the node, so a repair
          # that states no scope must register the one an earlier transaction stated, never open the
          # rules to any address. Scoped in a repair, then repaired with no property at all.
          # The fleet seed and the fleet pin ride the same repair, each the node registration's own
          # argument -- the pin VERBATIM, since it is security material nothing re-spells.
          $pin = '0123456789abcdef0123456789abcdef@11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo'
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $msi -Log 'scope-node.log' -What 'a repair stating a scope, a seed and a pin' `
            -Properties 'REINSTALL=ALL', 'REINSTALLMODE=vomus', 'FASTCACHE_FIREWALL_ALLOW=10.0.0.0/8', 'FASTCACHE_FLEET_SEED=seed.example.invalid', "FASTCACHE_FLEET_ID=$pin"
          Assert-TransactionSettled
          Assert-NodeFirewallScope -Scope '10.0.0.0/8'
          Assert-NodeRegistrationArgument -Argument '--fleet-seed=seed.example.invalid:6674'
          Assert-NodeRegistrationArgument -Argument "--fleet-id=$pin"
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $msi -Log 'repair-scope.log' -What 'a repair stating none of them' `
            -Properties 'REINSTALL=ALL', 'REINSTALLMODE=vomus'
          Assert-TransactionSettled
          Assert-NodeFirewallScope -Scope '10.0.0.0/8'
          Assert-NodeRegistrationArgument -Argument '--fleet-seed=seed.example.invalid:6674'
          Assert-NodeRegistrationArgument -Argument "--fleet-id=$pin"

          # A pin the node's parser REFUSES fails the transaction (batch 3 review, B3-1): the node's
          # arguments are checked first, before anything is remembered or registered, so the repair
          # neither "succeeds" over the old registration nor remembers the refused pin for every later
          # transaction. All three halves are asserted: the transaction is refused BY THE CHECK, what
          # the machine had survives it -- the registration's pin and the remembered one -- and the
          # node is RUNNING again (B4-6): the repair stopped it to replace its files, and only the
          # rollback's restart brings it back.
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $msi -Log 'refused-pin.log' -What 'a repair stating a pin the node refuses' `
            -Properties 'REINSTALL=ALL', 'REINSTALLMODE=vomus', 'FASTCACHE_FLEET_ID=0123456789abcdef0123456789abcdef' `
            -Accept @(1603)
          Assert-MsiLog -Path 'refused-pin.log' -Present 'CustomAction FastCacheNodeCheckArguments returned actual error code'
          Assert-NodeRegistrationArgument -Argument "--fleet-id=$pin"
          $remembered = Get-ItemPropertyValue -Path 'HKLM:\SOFTWARE\fastcached\Installer' -Name 'FleetId'
          if ($remembered -cne $pin) {
            throw "the refused repair changed the remembered fleet pin: '$remembered', expected '$pin'"
          }
          Assert-ServiceTable -Row NodeSelected -Log 'refused-pin.log'
          Write-Host "the refused pin failed the repair; the registration and the remembered pin are unchanged, and the node runs"

          # A transaction that re-registers a RUNNING node without replacing its files restarts it
          # (B4-5): a new seed on an already-installed node is a feature change that copies nothing,
          # and the process it left running had the old command line until its next restart. The PID
          # is the witness, and the log proves no ServiceControl row stopped the node, so a new PID
          # is the transaction's own restart rather than a file replacement's.
          $nodeBefore = (Get-CimInstance Win32_Service -Filter "Name='FastCacheCompileNode'").ProcessId
          Invoke-Msiexec -Leaves NodeSelected -Operation '/i' -Package $msi -Log 'reseed-node.log' -What 'a feature change giving the node a new seed' `
            -Properties 'ADDLOCAL=CM_C_Node', 'FASTCACHE_FLEET_SEED=seed2.example.invalid'
          Assert-MsiLog -Path 'reseed-node.log' -Present (Get-MsiActionRanPattern 'FastCacheNodeStopForRestart') `
            -Absent 'ServiceControl\(.*Name=FastCacheCompileNode'
          Assert-NodeRegistrationArgument -Argument '--fleet-seed=seed2.example.invalid:6674'
          Assert-ServiceTable -Row NodeSelected -Log 'reseed-node.log'
          $nodeAfter = (Get-CimInstance Win32_Service -Filter "Name='FastCacheCompileNode'").ProcessId
          if ($nodeAfter -eq $nodeBefore) {
            throw "the node was re-registered with a new seed and kept running as PID $nodeBefore, with the old command line"
          }
          Write-Host "the re-registered node was restarted (PID $nodeBefore, then $nodeAfter)"

          Invoke-Msiexec -Leaves DaemonAlone -Operation '/i' -Package $msi -Log 'remove-node.log' -Properties 'REMOVE=CM_C_Node' `
            -What 'removing the node feature'
          Assert-ServiceTable -Row DaemonAlone -Log 'remove-node.log'

          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike '*\fastcached\bin*') { throw "machine PATH lost the install's bin: $machinePath" }

      # The compile worker registering ITSELF, from its own command line. What is asserted
      # here is the identity it registers UNDER: told nothing, CreateService logs a
      # service on as LocalSystem -- the whole machine -- and this process compiles
      # input that arrived over the network. The macOS half of the same decision is
      # the fastcache-node account (issue #87); on Windows it is a virtual account,
      # which the SCM derives from the service name and creates itself.
      #
      # Run against the built binary rather than the MSI's node feature because the
      # flags below (a listen port beside the daemon's, a named toolchain) are the
      # command line's; the MSI's own node registration is what the steps above
      # drive, start mode and state after every transaction.
      - name: "Verify the compile worker does not register as LocalSystem"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Resolve-Path 'target/pace-node.exe'
          $cacheDir = Join-Path $env:RUNNER_TEMP 'fastcache-node-cache'
          # Where the worker keeps the identity key it proves to its scheduler (#178 PR 6):
          # naming a scheduler without one is refused at install time, as at startup.
          $stateDir = Join-Path $env:RUNNER_TEMP 'fastcache-node-state'
          $toolchain = (Get-Command cl.exe).Source

          # --listen-node is NAMED, and it has to be since #290 stage 3.
          #
          # A node opens exactly one 0xFC port, defaulting to 0.0.0.0:6674 -- and
          # the step above leaves a `pace-kv` serving on 6674 for the rest of the
          # job, where the Linux packaging job stops its daemon before installing the
          # worker. Left defaulted, the worker's only port is a port it cannot have,
          # and a bind it cannot make is now a startup refusal rather than a warning:
          # before stage 3 a worker losing that port kept a compile port of its own
          # and carried on, so the collision was invisible here.
          #
          # 6676, matching --advertise, so the two agree -- a loopback bind under a
          # loopback advertise is the coherent single-machine shape and passes the
          # startup table. Co-installing a daemon and a worker on one machine is not
          # a supported shape -- a node answers every verb the daemon does
          # (docs/tools/pace-node.md) -- and this job does it only
          # because the MSI under test ships both features.
          & $node --install-service `
              --listen-node=127.0.0.1:6676 `
              --advertise=127.0.0.1:6676 `
              --cache-dir="$cacheDir" `
              --cluster-dir="$stateDir" `
              --toolchain="$toolchain"
          if ($LASTEXITCODE -ne 0) { throw "worker --install-service failed with $LASTEXITCODE" }

          try {
            $svc = Get-CimInstance Win32_Service -Filter "Name='FastCacheCompileNode'"
            if (-not $svc) { throw 'FastCacheCompileNode was not registered' }

            # The assertion this step exists for.
            if ($svc.StartName -ne 'NT SERVICE\FastCacheCompileNode') {
              throw "worker runs as '$($svc.StartName)', expected NT SERVICE\FastCacheCompileNode"
            }

            # A virtual account cannot write a directory an administrator created,
            # which LocalSystem never noticed. The install grants it explicitly, and
            # the trustee only resolves once the service exists -- so this also pins
            # that the grant happens after CreateService and not before.
            $granted = (Get-Acl $cacheDir).Access | Where-Object {
              $_.IdentityReference.Value -eq 'NT SERVICE\FastCacheCompileNode' -and $_.AccessControlType -eq 'Allow'
            }
            if (-not $granted) { throw "$cacheDir carries no ACE for the worker's virtual account" }

            # And it must actually run under that identity. A registration that
            # cannot start is the failure this project refuses at install time, so
            # it must not be introduced by the installer either. The heartbeat
            # retries in a background thread, so an unreachable scheduler does not
            # stop the service.
            # A failed start used to report one word -- `Stopped` -- for every
            # possible cause, which is a status rather than a reason and sent the
            # last failure here to log archaeology for a two-line answer. Every
            # branch below is diagnostic and best-effort: the throw is what fails
            # the step, and a diagnostic that cannot run must not mask it.
            Start-Service FastCacheCompileNode -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt 30 -and (Get-Service FastCacheCompileNode).Status -ne 'Running'; $i++) { Start-Sleep 1 }
            if ((Get-Service FastCacheCompileNode).Status -ne 'Running') {
              $status = (Get-Service FastCacheCompileNode).Status

              # What was actually registered. A registration replays this command
              # line at every start, so it is the first thing to read and the one
              # thing a status word can never carry.
              $registered = (Get-CimInstance Win32_Service -Filter "Name='FastCacheCompileNode'").PathName
              Write-Host "registered PathName: $registered"

              # The sharpest version: run what was registered, in the foreground,
              # so the refusal TEXT appears instead of a status. `--daemon` is
              # stripped because it means "run under the SCM" and would fail for a
              # different reason than the one being diagnosed.
              try {
                # A token is a run of unquoted characters and quoted sections, not
                # `"..."|\S+` -- that alternation takes \S+ first and splits
                # `--cache-dir="C:\dir with space"` into three arguments.
                $argv = ([regex]::Matches($registered, '(?:[^\s"]|"[^"]*")+') | ForEach-Object { $_.Value -replace '"','' })
                $exe = $argv[0]
                $rest = @($argv | Select-Object -Skip 1 | Where-Object { $_ -ne '--daemon' })
                $out = Join-Path $env:RUNNER_TEMP 'node-foreground.log'
                $proc = Start-Process -FilePath $exe -ArgumentList $rest -PassThru -NoNewWindow `
                          -RedirectStandardOutput $out -RedirectStandardError "$out.err"
                if (-not $proc.WaitForExit(15000)) { $proc.Kill(); Write-Host 'foreground run did not exit; it started cleanly' }
                Write-Host '--- foreground stdout ---'; Get-Content $out -ErrorAction SilentlyContinue
                Write-Host '--- foreground stderr ---'; Get-Content "$out.err" -ErrorAction SilentlyContinue
              } catch { Write-Host "foreground reproduction failed: $_" }

              # And what the SCM itself recorded, which covers the causes that never
              # reach the process at all -- a missing account, a denied logon right.
              try {
                Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = (Get-Date).AddMinutes(-5) } `
                  -ErrorAction SilentlyContinue |
                  Where-Object { $_.Message -match 'FastCacheCompileNode' } |
                  Select-Object -First 10 TimeCreated, Id, Message | Format-List
              } catch { Write-Host "event log read failed: $_" }

              throw "worker did not start under its virtual account: $status"
            }
            Stop-Service FastCacheCompileNode -Force
          }
          finally {
            & $node --uninstall-service
          }

          if (Get-Service -Name FastCacheCompileNode -ErrorAction SilentlyContinue) {
            throw 'FastCacheCompileNode survived --uninstall-service'
          }

      # The firewall half of --install-service, on the REAL Windows Firewall: the rule a
      # registration creates is inbound, allowing, every profile, scoped to the program, the
      # service and --firewall-allow; a second install replaces rather than duplicates it; an
      # uninstall removes it. A script, because the Windows Filtering Platform is the subject.
      #
      # It names a configuration file of its OWN. Without one the daemon reads the machine-wide
      # file, and the steps above leave the product installed with `port: 6699` written into it:
      # beside this step's `--listen` that is a startup refusal ("--port (or its key) cannot be
      # combined with --listen"), so the registration was refused -- correctly, since the
      # service would refuse every start (round 8, the first run that reached this step).
      - name: "Install-service creates the firewall rules and uninstall-service removes them"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target/pace-kv.exe').Path
          $name = 'FastCachedFirewallProbe'
          $group = "pace-kv: $name"
          $config = Join-Path $env:RUNNER_TEMP 'firewall-probe.yaml'
          Set-Content -LiteralPath $config -Value '# The firewall probe: named so no machine-wide configuration is read.'
          if (@(Get-NetFirewallRule -Group $group -ErrorAction SilentlyContinue).Count -ne 0) {
            throw "rules for '$group' exist before the install, so this step cannot tell creation from leftovers"
          }

          & $exe --install-service --service-name=$name --service-start=manual --config=$config --listen=0.0.0.0:6698 --firewall-allow=10.0.0.0/8 --firewall-allow=fd00::/8
          if ($LASTEXITCODE -ne 0) { throw "install-service failed with $LASTEXITCODE, expected 0" }
          try {
            $rules = @(Get-NetFirewallRule -Group $group -ErrorAction SilentlyContinue)
            if ($rules.Count -ne 1) { $rules | Format-List DisplayName, Group; throw "expected one rule in '$group', found $($rules.Count)" }
            $rule = $rules[0]
            if ($rule.Direction -ne 'Inbound' -or $rule.Action -ne 'Allow' -or $rule.Enabled -ne 'True') {
              throw "rule is $($rule.Direction)/$($rule.Action)/enabled=$($rule.Enabled), expected Inbound/Allow/enabled=True"
            }
            if ($rule.Profile -ne 'Any') { throw "rule profile is '$($rule.Profile)', expected Any: a VPN adapter is usually Public" }
            $port = $rule | Get-NetFirewallPortFilter
            if ($port.Protocol -ne 'TCP' -or $port.LocalPort -ne '6698') { throw "rule filters $($port.Protocol) $($port.LocalPort), expected TCP 6698" }
            $app = $rule | Get-NetFirewallApplicationFilter
            if ($app.Program -ne $exe) { throw "rule program is '$($app.Program)', expected '$exe'" }
            $svc = $rule | Get-NetFirewallServiceFilter
            if ($svc.Service -ne $name) { throw "rule service is '$($svc.Service)', expected '$name'" }

            # A rule scoped to a service SID matches nothing unless the service itself carries
            # one: pace-kv's virtual-account services register SERVICE_SID_TYPE_UNRESTRICTED
            # (ServiceControl.cpp), so this is the other half of the service-filter check above
            # rather than a second subject.
            $sidType = @(& sc.exe qsidtype $name)
            if ($LASTEXITCODE -ne 0 -or ($sidType -join ' ') -notmatch 'UNRESTRICTED') {
              throw "sc.exe qsidtype $name did not report UNRESTRICTED, found: $($sidType -join ' | ')"
            }

            $addr = $rule | Get-NetFirewallAddressFilter
            # Both families on one rule: Windows reports an IPv4 subnet as address/mask and an IPv6
            # one as address/prefix.
            if ($addr.RemoteAddress -notcontains '10.0.0.0/255.0.0.0' -or $addr.RemoteAddress -notcontains 'fd00::/8') {
              throw "rule remote scope is '$($addr.RemoteAddress -join ',')', expected 10.0.0.0/255.0.0.0 and fd00::/8"
            }

            & $exe --install-service --service-name=$name --service-start=manual --config=$config --listen=0.0.0.0:6698 --firewall-allow=10.0.0.0/8 --firewall-allow=fd00::/8
            if ($LASTEXITCODE -ne 0) { throw "re-running install-service failed with $LASTEXITCODE, expected 0" }
            $again = @(Get-NetFirewallRule -Group $group -ErrorAction SilentlyContinue)
            if ($again.Count -ne 1) { throw "a second install left $($again.Count) rule(s) in '$group', expected 1: it must replace rather than duplicate" }
          }
          finally {
            & $exe --uninstall-service --service-name=$name
          }
          $left = @(Get-NetFirewallRule -Group $group -ErrorAction SilentlyContinue)
          if ($left.Count -ne 0) { throw "uninstall-service left $($left.Count) rule(s) in '$group', expected 0" }
          if (Get-Service -Name $name -ErrorAction SilentlyContinue) { throw "$name survived uninstall-service" }

      # The configuration half of the same promise, which nothing asserted
      # before: the .deb/.rpm conffile and the .pkg postinstall are both checked
      # end to end below and on macOS, while the MSI's seeding action is
      # Return="ignore" and therefore fails in complete silence. A seed that did
      # not happen leaves a service running on built-in defaults and an operator
      # editing a file that is not there.
      # The POSITIVE CONTROL for the step below, and the half
      # [#866](https://github.com/LASTRADA-Software/fastcached/issues/866) asks for
      # by name. That step's assertions are all of the form "no entry matches", and
      # a mask or a filter that matches NOTHING passes every one of them on a
      # perfectly broken machine. #866's first half -- making `$planting` mirror
      # `PlantingRights` bit for bit -- was verified by CORRESPONDENCE, which is
      # exactly what that ticket found wrong with the mask in the first place: a
      # check written to mirror a predicate, drifting from it, with a comment
      # continuing to vouch for the correspondence.
      #
      # So this plants a grant the daemon's predicate refuses and requires the
      # detector to FIND it -- on a throwaway directory, never on the real one. The
      # control must not be able to leave the machine-wide configuration broken if
      # this step dies between planting and cleaning up, which is what the
      # `finally` is for.
      #
      # BOTH directions, because either alone is vacuous: a filter matching
      # everything passes the positive half, and one matching nothing passes the
      # negative half -- and the second is the failure mode the step below has by
      # construction.
      #
      # It runs BEFORE the real check, so a broken detector is reported as a broken
      # detector rather than as a clean machine.
      - name: "Positive control: the planting detector can actually fire (#866)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The same two definitions the step below uses, duplicated DELIBERATELY
          # and it is the one duplication this file should have: a control sharing
          # the mask with its subject would pass on a mask that was empty, which is
          # the whole thing being controlled for.
          $broad = @('S-1-1-0', 'S-1-5-11', 'S-1-5-32-545', 'S-1-5-4', 'S-1-5-32-546')
          $lowWord = [int64]4294967295
          $planting = ([int64][Security.AccessControl.FileSystemRights]::CreateFiles) `
                    -bor [int64][Security.AccessControl.FileSystemRights]::CreateDirectories `
                    -bor [int64][Security.AccessControl.FileSystemRights]::Delete `
                    -bor [int64][Security.AccessControl.FileSystemRights]::ChangePermissions `
                    -bor [int64][Security.AccessControl.FileSystemRights]::TakeOwnership `
                    -bor [int64]1073741824 `
                    -bor [int64]268435456

          function Get-Grantees($rules, $sids, $rights) {
            $mask = ([int64]$rights) -band $lowWord
            return @($rules | Where-Object {
              $sids -contains $_.IdentityReference.Value -and
              ((([int64]$_.FileSystemRights) -band $lowWord) -band $mask) -ne 0
            })
          }

          function Get-AllowList($path) {
            return @((Get-Acl $path).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
                     Where-Object { $_.AccessControlType -eq 'Allow' })
          }

          function New-AllowRule($sid, $rights) {
            return New-Object System.Security.AccessControl.FileSystemAccessRule(
              (New-Object System.Security.Principal.SecurityIdentifier $sid),
              $rights,
              [Security.AccessControl.InheritanceFlags]::None,
              [Security.AccessControl.PropagationFlags]::None,
              [Security.AccessControl.AccessControlType]::Allow)
          }

          $probe = Join-Path $env:RUNNER_TEMP ("planting-control-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $probe | Out-Null
          try {
            # Protected and rebuilt from nothing, so the negative half is a
            # statement about what this control planted rather than about whatever
            # the runner's temp directory happens to inherit.
            $acl = Get-Acl $probe
            $acl.SetAccessRuleProtection($true, $false)
            $acl.AddAccessRule((New-AllowRule 'S-1-5-18' ([Security.AccessControl.FileSystemRights]::FullControl)))
            $acl.AddAccessRule((New-AllowRule ([Security.Principal.WindowsIdentity]::GetCurrent().User.Value) ([Security.AccessControl.FileSystemRights]::FullControl)))
            Set-Acl -Path $probe -AclObject $acl

            $clean = Get-AllowList $probe
            if ($clean.Count -eq 0) { throw "control: read no allow entries from $probe" }
            $before = @(Get-Grantees $clean $broad $planting)
            if ($before.Count -ne 0) {
              $before | ForEach-Object { Write-Host "::error::$($_.IdentityReference) ($($_.FileSystemRights))" }
              throw "control (negative half): a directory granting no broad principal anything came back with $($before.Count) planter(s). The filter matches too much, so the real check's 'no entry matches' proves nothing."
            }

            # A grant the daemon's own predicate refuses: BUILTIN\Users able to
            # create files. CreateFiles alone, so this also pins that the mask
            # covers the most ordinary way to plant a file and not only the exotic
            # bits #866 added.
            $acl = Get-Acl $probe
            $acl.AddAccessRule((New-AllowRule 'S-1-5-32-545' ([Security.AccessControl.FileSystemRights]::CreateFiles)))
            Set-Acl -Path $probe -AclObject $acl

            $after = @(Get-Grantees (Get-AllowList $probe) $broad $planting)
            if ($after.Count -eq 0) {
              throw "control (positive half): BUILTIN\Users was granted CreateFiles and the detector found NOTHING. Every 'no entry matches' assertion in the next step is therefore vacuous, which is #866 exactly and is why correspondence alone was not enough."
            }
            Write-Host "::notice::planting detector fired on a planted grant ($($after.Count) grantee(s)) and stayed silent on a clean list"
          }
          finally {
            Remove-Item -Recurse -Force $probe -ErrorAction SilentlyContinue
          }

      - name: "Verify the seeded configuration and its permissions"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:ProgramData\fastcached"
          $cfg = "$dir\fastcached.yaml"

          # Seeding happened at all. This is also the assertion that catches
          # %ProgramData% being absent from the service environment, which would
          # make both the seed and the daemon's own lookup no-ops -- and it is the
          # positive control for everything below, all of which is "no entry
          # matches" and would pass loudest on a file that is not there.
          if (-not (Test-Path $cfg)) { throw "installer did not seed $cfg" }
          if (-not (Select-String -Path $cfg -Pattern '^#port:' -Quiet)) {
            throw "$cfg does not look like the shipped template"
          }

          # Ask for the rules as SIDs rather than translating names afterwards:
          # entries like ALL APPLICATION PACKAGES have no account to resolve to,
          # and Translate() throws on them rather than returning nothing, which
          # would abort this check instead of passing it. An empty list is refused
          # for the same reason the Test-Path above is: nothing to scan reads
          # exactly like nothing wrong.
          function Get-AllowRules($path) {
            $acl = Get-Acl $path
            $rules = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) |
                       Where-Object { $_.AccessControlType -eq 'Allow' })
            if ($rules.Count -eq 0) { throw "read no allow entries from $path; the assertions below cannot run" }
            return @{ Acl = $acl; Rules = $rules }
          }

          # Which of $sids is granted any of $rights. One filter, so the direction
          # that must find nothing and the direction that must find something
          # cannot end up keying on different bits.
          # Everything widened to Int64 before the band, and no hex literal above
          # 0x7FFFFFFF anywhere. FileSystemRights is a signed Int32, so an entry
          # carrying GENERIC_READ reads back NEGATIVE -- and PowerShell types a hex
          # literal by its bit pattern, so `0x80000000` is also negative and
          # `[uint32]` of either throws rather than wrapping. Sign-extend to Int64,
          # mask off the high half, and compare two non-negative numbers.
          $lowWord = [int64]4294967295
          function Get-Grantees($rules, $sids, $rights) {
            $mask = ([int64]$rights) -band $lowWord
            return @($rules | Where-Object {
              $sids -contains $_.IdentityReference.Value -and
              ((([int64]$_.FileSystemRights) -band $lowWord) -band $mask) -ne 0
            })
          }

          # By SID rather than account name so the check is not itself wrong on a
          # non-English runner. This is the set Platform/FileTrust calls broad --
          # Everyone, Authenticated Users, BUILTIN\Users, INTERACTIVE, Guests --
          # and it is declared once because two copies is how one of them loses an
          # entry.
          $broad = @('S-1-1-0', 'S-1-5-11', 'S-1-5-32-545', 'S-1-5-4', 'S-1-5-32-546')
          # The write mask, now PlantingRights from src/Pace/Platform/FileTrust.cpp
          # bit for bit (#866). It was NOT that mirror in either direction, while a
          # comment presented it as one -- "a comment naming what it duplicates
          # vouches for the duplicate's bugs":
          #
          #   * it OMITTED DELETE, GENERIC_WRITE and GENERIC_ALL, so a principal
          #     granted any of them could plant or replace the machine-wide config
          #     and this assertion passed;
          #   * it INCLUDED the `Write` composite, which is WriteData|AppendData plus
          #     WriteExtendedAttributes|WriteAttributes -- two rights the C++
          #     predicate does not count, so it could also refuse a grant the daemon
          #     considers harmless.
          #
          # CreateFiles/CreateDirectories are KEPT rather than WriteData/AppendData:
          # identical bits (0x2 / 0x4), and the directory-facing names are the honest
          # ones for a directory ACL. Dropping `Write` is what removes the two extra
          # bits, since those two already carry everything it shared with
          # FILE_WRITE_DATA | FILE_APPEND_DATA.
          #
          # FileSystemRights has no name for GENERIC_WRITE or GENERIC_ALL, so they are
          # raw and decimal -- the same reasons the read mask below gives. int64 for
          # consistency with it rather than necessity: both fit a positive Int32,
          # unlike GENERIC_READ.
          $planting = ([int64][Security.AccessControl.FileSystemRights]::CreateFiles) `
                    -bor [int64][Security.AccessControl.FileSystemRights]::CreateDirectories `
                    -bor [int64][Security.AccessControl.FileSystemRights]::Delete `
                    -bor [int64][Security.AccessControl.FileSystemRights]::ChangePermissions `
                    -bor [int64][Security.AccessControl.FileSystemRights]::TakeOwnership `
                    -bor [int64]1073741824 `
                    -bor [int64]268435456
          # The read mask is ReadingRights from src/Pace/Platform/FileTrust.cpp,
          # spelled for PowerShell. ReadData rather than the Read composite: that
          # one includes ReadPermissions, which almost every entry carries, so a
          # band against it would fire on principals that cannot read a byte. The
          # two GENERIC_* bits are in the C++ deliberately -- an inherited entry is
          # usually spelled with them, and its comment says a scan for the bare bit
          # "would miss the very entry this exists to find" -- and FileSystemRights
          # has no name for either, hence the raw values.
          # Decimal rather than hex, for the reason above: 2147483648 is GENERIC_READ
          # and 268435456 is GENERIC_ALL, and written as `0x80000000` the first one
          # would be a negative Int32 before it ever reached the band.
          $reading = ([int64][Security.AccessControl.FileSystemRights]::ReadData) `
                    -bor [int64]2147483648 `
                    -bor [int64]268435456

          # --- The DIRECTORY answers integrity. A standard account able to create
          # files here owns the configuration of a service this machine trusts.
          $directory = Get-AllowRules $dir
          if (-not $directory.Acl.AreAccessRulesProtected) {
            throw "$dir still inherits from C:\ProgramData, which grants BUILTIN\Users create-file"
          }

          $planters = @(Get-Grantees $directory.Rules $broad $planting)
          if ($planters.Count -gt 0) {
            $planters | ForEach-Object { Write-Host "::error::$($_.IdentityReference) may write in $dir ($($_.FileSystemRights))" }
            throw "a standard account could plant a config in $dir"
          }

          # An owner keeps ChangePermissions whatever the entries say.
          $owner = $directory.Acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
          if ($owner -notin @('S-1-5-18', 'S-1-5-32-544')) {
            throw "$dir is owned by $owner, not by SYSTEM or Administrators"
          }

          # --- The FILE answers secrecy, and the directory's list cannot: it grants
          # BUILTIN\Users read and execute INHERITABLY, deliberately, and a file
          # left to inherit that is readable by every local account. That file is
          # where InlineCredentialRejection tells operators to put `requirepass:`,
          # so the documented remedy used to move the secret from one world-readable
          # place to another (#741). No test on a POSIX host can construct or read a
          # DACL, so this is the whole of the Windows evidence for that fix.
          $file = Get-AllowRules $cfg
          if (-not $file.Acl.AreAccessRulesProtected) {
            throw "$cfg still inherits from $dir, so it carries the directory's read for BUILTIN\Users"
          }

          $readers = @(Get-Grantees $file.Rules $broad $reading)
          if ($readers.Count -gt 0) {
            $readers | ForEach-Object { Write-Host "::error::$($_.IdentityReference) may read $cfg ($($_.FileSystemRights))" }
            throw "the seeded config is readable by a broad principal"
          }

          # And the other direction, which is what separates SECURED from BROKEN: a
          # config nothing can read is not a fix, it is a daemon that silently falls
          # back to built-in defaults. S-1-5-6 is NT AUTHORITY\SERVICE, which the
          # daemon's virtual account is a member of.
          $service = @(Get-Grantees $file.Rules @('S-1-5-6') $reading)
          if ($service.Count -eq 0) {
            $file.Rules | ForEach-Object { Write-Host "  $($_.IdentityReference) $($_.FileSystemRights)" }
            throw "nothing grants NT AUTHORITY\SERVICE (S-1-5-6) read on $cfg"
          }

          Write-Host "seeded $cfg"
          Write-Host "  directory owner: $owner  protected: $($directory.Acl.AreAccessRulesProtected)"
          Write-Host "  file restricted to SYSTEM, Administrators and services"

      # Seed-once, the property the whole arrangement exists for: an MSI
      # overwrites its payload on every install, so the live config is kept out
      # of the payload and copied in only when absent. The .deb/.rpm equivalent
      # is asserted the same way further up; macOS in macos-package-e2e.sh.
      - name: "Verify a reinstall keeps operator edits"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/MsiServiceTable.psm1')
          $cfg = "$env:ProgramData\fastcached\fastcached.yaml"
          $marker = '# local edit that must survive'
          Add-Content -Path $cfg -Value $marker

          $msi = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
          Invoke-Msiexec -Leaves DaemonAlone -Operation '/i' -Package $msi -Log 'reinstall.log' -Properties 'REINSTALL=ALL', 'REINSTALLMODE=vomus' `
            -What 'the reinstall'

          if (-not (Select-String -Path $cfg -Pattern ([regex]::Escape($marker)) -Quiet)) {
            throw 'the reinstall overwrote the operator edit'
          }

          # The upgrade path for the service identity. A reinstall re-registers the
          # daemon, so this is where a change to what it logs on as would strand an
          # existing installation -- registered, and unable to start. A repair is
          # also a transaction the service table is applied on, so it must leave
          # the table the install left.
          Assert-ServiceTable -Row DaemonAlone -Log 'reinstall.log'
          $svc = Get-CimInstance Win32_Service -Filter "Name='FastCached'"
          if ($svc.StartName -ne 'NT SERVICE\FastCached') {
            throw "after reinstall the daemon runs as '$($svc.StartName)'"
          }

      - name: "Uninstall and verify the service is gone"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/MsiServiceTable.psm1')
          $msi = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
          Invoke-Msiexec -Leaves NothingInstalled -Operation '/x' -Package $msi -Log 'uninstall.log' -What 'the uninstall'
          Assert-ServiceTable -Row NothingInstalled -Log 'uninstall.log'

          # Documented behaviour on every platform: the configuration is the
          # operator's, not the package's, so it outlives the package.
          if (-not (Test-Path "$env:ProgramData\fastcached\fastcached.yaml")) {
            throw 'uninstall removed the configuration'
          }

      # Named fastcached-<platform>-packages like the Linux and macOS jobs, so the
      # release job below collects all three with one pattern and a new platform
      # is a new upload row rather than an edit there.
      - name: "Upload the MSI and the ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-windows-packages
          path: |
            out/build/cl-release/*.msi
            out/build/cl-release/*.zip
          if-no-files-found: error

  # The release gate. Its contract is narrow and total: it runs only for a tag,
  # only after every other job in this workflow is green, and it refuses to create
  # anything unless every platform's package is present and named after the tag
  # that triggered the build. What it creates is always a DRAFT — nothing here
  # publishes a release automatically; /publish-release does that, by hand.
  release:
    name: "Draft GitHub release"
    # The trigger already restricts tag runs to vX.Y.Z. This is what keeps the job
    # off every branch and pull-request run; GitHub expressions have no regex, so
    # the shape check stays in the `on:` filter and this stays a prefix test.
    if: startsWith(github.ref, 'refs/tags/v')
    # Every other job in this workflow. A job missing from this list is a job
    # whose failure would not stop a release, so `check-release-gate` — itself a
    # row here — asserts the list still covers the whole workflow, and does so on
    # every push and pull request rather than only when a tag is already pushed.
    needs:
      - changes
      - check-clang-format
      - check-release-gate
      - linux
      - clang-tidy
      - clang-asan-ubsan
      - clang-tsan
      - coverage
      - macos
      - docker
      - sccache-smoke-memcached-text
      - sccache-smoke-memcached-binary
      - sccache-smoke-redis
      - pace-cc-smoke
      - windows
      - clang-tidy-windows
      - compile-cache-e2e-linux
      - compile-cache-e2e-windows
      - package-linux
      - package-macos
      - package-windows
    runs-on: ubuntu-24.04
    # One of the two jobs here needing more than this workflow's `contents: read`
    # floor: creating a release writes `contents`. Without this the release step
    # fails with a bare 403 rather than with anything that names the cause.
    #
    # A job-level block REPLACES the top-level one rather than adding to it, so
    # `contents: write` is the whole of what this job gets -- which is also why
    # narrowing the floor cannot break the one job a pull request never exercises.
    permissions:
      contents: write
    steps:
      # Checked out for one reason: the asset list at the end of this job is the
      # single source of truth for what a release consists of, and the assertion
      # below reads it back rather than restating it. No history needed.
      - uses: actions/checkout@v4

      # Every packaging job uploads under fastcached-<platform>-packages. The
      # archives do not collide in a flat directory: CPack stamps the system name
      # into each (…-Linux-x86_64.tar.gz vs …-Darwin-arm64.tar.gz), which is also
      # why the asset list below names them separately and so catches one going
      # missing.
      - name: "Download every platform's packages"
        uses: actions/download-artifact@v4
        with:
          pattern: fastcached-*-packages
          merge-multiple: true
          path: dist

      # The version now comes from `git describe`, so a checkout that cannot see
      # the tag produces a fallback version and packages named after a release
      # nobody cut — a defect invisible in every green job above and observable
      # only in the filenames. So the filenames are what gets asserted. The
      # packaging jobs also configure with -DFASTCACHED_REQUIRE_EXACT_VERSION=ON
      # on a tag run, which fails earlier and closer to the cause; this is the
      # backstop that no packaging change can bypass.
      #
      # The expectation table is not restated here: it is read back out of this
      # job's own asset list with the same extractor /publish-release uses, so
      # there is exactly one such list in the repository.
      - name: "Assert the package set is complete and named after the tag"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${TAG#v}"
          [[ -n "$version" ]] || { echo "::error::empty tag name"; exit 1; }

          mapfile -t patterns < <(awk '
              /files:[[:space:]]*\|/ { collecting = 1; next }
              collecting {
                  if ($0 ~ /^[[:space:]]*#/) next
                  if ($0 !~ /^[[:space:]]*[*a-zA-Z0-9._-]+/) { collecting = 0; next }
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                  if (length($0)) print
              }' .github/workflows/build.yml)

          (( ${#patterns[@]} )) || { echo "::error::no asset globs found in this workflow"; exit 1; }

          status=0
          : > "$RUNNER_TEMP/attached.txt"
          {
            echo "### Release assets for \`$TAG\`"
            echo
            echo "| expected | asset | bytes |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for pattern in "${patterns[@]}"; do
            # A glob is a filename pattern and nothing else. Whitespace or a colon
            # means the extractor ran past the end of the asset list and swallowed
            # a sibling key — see the warning above that list.
            if [[ "$pattern" == *[[:space:]:]* ]]; then
              echo "::error::'$pattern' is not a file glob: the asset list must stay the LAST key of the action's with: mapping"
              status=1; continue
            fi

            hits=( $pattern )
            if (( ${#hits[@]} != 1 )); then
              echo "::error::$pattern matched ${#hits[@]} files, expected exactly 1: ${hits[*]-}"
              echo "| \`$pattern\` | **${#hits[@]} matches** | |" >> "$GITHUB_STEP_SUMMARY"
              status=1; continue
            fi

            file="${hits[0]}"
            name="${file##*/}"

            # `fastcached-<version>` followed by a separator, not a substring test:
            # 0.1.1 would otherwise be satisfied by a 0.1.10 package.
            case "$name" in
              fastcached-"$version"[-_.]* | fastcached_"$version"[-_.]*) ;;
              *)
                echo "::error::$name does not carry the tag's version ($version): the build used a fallback version, so that checkout could not see the tag"
                echo "| \`$pattern\` | $name | **wrong version** |" >> "$GITHUB_STEP_SUMMARY"
                status=1; continue
                ;;
            esac

            [[ -s "$file" ]] || { echo "::error::$name is empty"; status=1; continue; }

            printf '%s\n' "$file" >> "$RUNNER_TEMP/attached.txt"
            echo "| \`$pattern\` | $name | $(stat -c %s "$file") |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Nothing that was built may be left out. An artifact no glob attaches is
          # a platform silently missing from the release page — the same defect as
          # a missing package, wearing the opposite disguise.
          find dist -type f | sort > "$RUNNER_TEMP/downloaded.txt"
          sort -o "$RUNNER_TEMP/attached.txt" "$RUNNER_TEMP/attached.txt"
          orphans="$(comm -23 "$RUNNER_TEMP/downloaded.txt" "$RUNNER_TEMP/attached.txt" || true)"
          if [[ -n "$orphans" ]]; then
            echo "::error::downloaded but attached by no glob:"
            echo "$orphans"
            status=1
          fi

          exit $status

      # softprops/action-gh-release rather than `gh release upload`:
      # /publish-release discovers what a release is *supposed* to contain by
      # parsing the literal asset list below, and a runtime-built upload list
      # would leave it with nothing to verify against.
      #
      # DO NOT ADD A KEY BELOW THE ASSET LIST, AND DO NOT REORDER THIS MAPPING.
      # That verifier collects every line after the list header and stops at the
      # first line that does not look like a filename — and `draft: true` looks
      # exactly like one. A key moved below the list is collected as a glob that
      # can never match, and verification then blocks forever on a phantom asset.
      # The list stays last, terminated by the end of the file. The assertion step
      # above fails the build if this is ever "tidied"; that is its second job.
      - name: "Create the draft release"
        # Pinned to a full commit SHA rather than the mutable @v2 tag, because this
        # is the only step in the workflow holding a `contents: write` token: a tag
        # is repointable by the action's owner or by anyone who takes that account,
        # and the next tag push would run the new code with rights to write
        # releases, tags and repository contents. The SHA below is v2.6.2, which is
        # what @v2 resolved to when this was validated. Upgrading is a deliberate
        # edit — read the changelog, bump the SHA and the version in this comment
        # together. (Upstream has since moved to v3.x; that is a major bump whose
        # input contract needs checking, so it is not taken here by default.)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "pace-kv ${{ github.ref_name }}"
          # The whole point: CI assembles the release, a human publishes it with
          # /publish-release once the assets have been verified.
          draft: true
          # No changelog file in this repository, so the body is GitHub's
          # generated commit summary — which /publish-release requires to be
          # non-empty.
          generate_release_notes: true
          # A glob matching nothing is a platform with no download. The assertion
          # step catches that first; this makes the action itself refuse rather
          # than warn, so neither path can leave a partial draft behind.
          fail_on_unmatched_files: true
          # One row per shipped artifact, each specific enough that a single
          # platform dropping out breaks exactly one row: a shared
          # `fastcached-*.tar.gz` would be satisfied by the Linux archive alone
          # while macOS shipped nothing. macOS is arm64-only because the runner is
          # Apple Silicon, so the day an x86_64 package appears this list gains a
          # row. The version is deliberately a wildcard — it is pinned to the tag
          # by the assertion step above, which can say so in its own words.
          files: |
            dist/fastcached_*_amd64.deb
            dist/fastcached-*.x86_64.rpm
            dist/fastcached-*-Linux-x86_64.tar.gz
            dist/fastcached-*-Darwin-arm64.pkg
            dist/fastcached-*-Darwin-arm64.dmg
            dist/fastcached-*-Darwin-arm64.tar.gz
            dist/fastcached-*-Windows-AMD64.msi
            dist/fastcached-*-Windows-AMD64.zip
