# pace-node configuration
# SPDX-License-Identifier: Apache-2.0
#
# Every setting below is commented out, so this file as shipped has NO behaviour:
# an untouched copy is exactly `pace-node` with no flags. Anything
# this worker does that you did not want is therefore something written here or
# on its command line -- which is the property the file is for, and the reason
# nothing is uncommented for you.
#
#   systemctl restart pace-node   apply any change
#   systemctl reload pace-node    apply a reloadable one, in place
#
# reloadable-for: pace-node
#
# EIGHT settings are reloadable and the rest are read once at startup. A reload
# re-reads this file the way the start read it, so a change to anything else is
# refused BY NAME rather than half-applied -- you are told which key needs the
# restart instead of running a worker that disagrees with its own file.
#
#   toolchain, no_toolchain_discovery   re-survey and re-register, which walks
#                                       every include tree and can take minutes
#   log_level                           immediate
#   allow_compile_arg                   immediate
#   requirepass                         immediate, on the NEXT exchange with each
#                                       peer -- nothing in flight is retried
#   fleet_open                          immediate, from the next connection;
#                                       turning it OFF refuses every caller the
#                                       roster does not admit straight away
#   advertise                           re-registers at the new address and retires
#                                       the entry under the old one, within a
#                                       heartbeat. A lease already granted for the
#                                       old address is refused, costing that client
#                                       one local compile -- which is nothing when
#                                       the old address is the one that stopped
#                                       working, and is why this is reloadable
#   raft_self                           moves the address this node's peers
#                                       dial it at for consensus
#
# Every key is one flag, spelled with underscores instead of dashes, and there
# is no setting that a file can express and a command line cannot. A flag on the
# command line WINS over the same key here. For a list setting (scheduler,
# toolchain, fleet_seed) naming any value on the command line
# REPLACES this file's list rather than extending it.
#
# Write a list as ONE key with every value under it. A key written twice is
# refused at startup and at a reload, naming both lines; it used to keep the
# second silently, so a worker served an address its file also contradicted.
#
# A flag whose meaning is its presence -- one you would pass with no value --
# is a boolean here, and only `true` and `false` are accepted. `dashboard: true`
# is `--dashboard`; `dashboard: false` is not passing it. Read
# `no_toolchain_discovery` the same way: `true` turns discovery OFF.
#
# Started without --config, this worker reads the first of these that exists and
# it can read, so this file is found with no flag at all:
#
#   POSIX    $XDG_CONFIG_HOME/pace/pace-node.yaml
#            ~/.config/pace/pace-node.yaml
#            <sysconfdir>/pace-node.yaml
#   Windows  %APPDATA%\pace\pace-node.yaml
#            %ProgramData%\pace\pace-node.yaml
#
# where <sysconfdir> is the directory this build was packaged for -- on Linux
# that is /etc/pace, which is where this very file is installed.
#
# The per-user rows apply to an unprivileged run. A run as root takes every row,
# and requires each to be one only an administrator could have written, so
# `sudo` cannot pick up a config out of an account's own $HOME.
#
# A path you pass to --config is STRICT: if it is absent, unreadable or
# malformed the worker refuses to start, because you are owed the news that the
# file you named did not arrive. A file found by the lookup above is skipped
# when it is not there.
#
# THE MODE OF THIS FILE IS NOT CHECKED. Anyone who can write it decides what
# this worker runs and which compilers it serves. Keep it writable only by root
# (0644 root:root is what the package installs). See issue #384.
#
# Every key below is one row of the same table `pace-node --help`
# prints, and a check in this project's test suite fails the build when the two
# stop agreeing -- so a setting missing here, or one here that the worker no
# longer has, is a build failure rather than something you find at a restart.
# The full reasoning for each setting is in that help output.


# where the one-shot verbs (--cluster-*, --enroll-*) send their request: the
# first value that connects is asked, and none other once a connection was
# made. Without it they ask this machine's own node.
#
# A node that SERVES is refused this key: it finds its scheduler from the fleet
# it joined, recorded in cluster_dir, so no worker carries a scheduler's
# address. To join a fleet no LAN beacon reaches, name fleet_seed instead.
#scheduler:
#  - <host:port>
#  - <host:port>

# host:port CLIENTS should use to reach this worker. Defaults to auto: the
# address this machine routes from, on the listen_node port while listen_node
# binds the wildcard (the default), re-derived when the network changes, with
# this machine's fully qualified name standing in until a route is known; and
# listen_node itself when that binds one address. auto:<port> derives the host
# and states the port. A name pins it too, and each client resolves it when it
# dials; a literal IP pins it and turns that roaming off. Behind
# NAT the derived address is still wrong: the scheduler hands this
# string to clients verbatim, so a worker that advertises an address only it
# can reach is leased and then never answers. A wildcard names no host any
# client can dial, so the node refuses to advertise one, and refuses a RELOAD
# naming one for the same reason.
# Reloadable: a node that learns its address late -- behind a NAT, or on an
# interface configured after the service -- re-registers under the new one.
#advertise:

# a toolchain this worker serves; repeatable. An OVERRIDE: naming any pins
# this worker to exactly that set, and naming none means serve whatever this
# machine has. There is still no default COMPILER -- a default is how a job
# ends up running against something nobody chose.
#toolchain:
#  - <compiler>
#  - <fingerprint>=<compiler>

# accept this compile argument in addition to the built-in per-driver-family
# table; repeatable. EXTENDS the table and cannot shrink it -- an argument the
# built-in table REFUSES stays refused however this is written, because these
# entries are consulted only after no built-in row matched at all.
#
# Matched WHOLE and exactly: name the spelling, not a prefix and not a pattern.
# `-fplugin=` and `-Xclang` are refused by name because they make the compiler
# run code this machine did not choose, and a prefix entry would re-open that
# family through the one flag you meant to allow.
#
# THIS IS A SECURITY SETTING. Every entry widens what a client may make this
# worker's compiler do. The worker logs the whole set at WARN whenever it is
# applied, at startup and at every reload, so an incident can be read against
# what was in force at the time.
#allow_compile_arg:
#  - -some-flag-this-build-does-not-know

# do not survey this machine for compilers. Without --toolchain this leaves
# the worker with nothing to serve, so it refuses to start -- and refuses to
# be INSTALLED as a service, which is the registration that would otherwise
# fail at every boot with nobody watching.
#no_toolchain_discovery: false

# concurrent compiles. Default: derived from this machine's cores and
# memory, less what --node-class reserves. A number given here is the answer
# and is not clamped or reduced further. Advertised to the scheduler AND
# enforced here: a worker that accepted more would be fuller and slower than
# the scheduler believes, at the same moment. 0 runs NO worker: the node
# surveys nothing, registers nothing and is never sent a compile -- a machine
# that only schedules or caches. Until #1440 such a node's /metrics and history
# still read 0 slots.
#slots:

# how hard this machine may be driven (default: workstation). A workstation
# keeps cores free for the person using it; a dedicated node may be driven
# to its slot limit. The default is the safe answer rather than the common
# one.
#node_class:

# how long a stop waits for compiles still running before giving up and
# saying what it abandoned (default 30s); 0s waits forever. Whole seconds, in
# one of ms, s, min, h, d. Unbounded, the supervisor decides instead and
# answers with SIGKILL and no diagnostic.
#drain_timeout:

# the largest compile request this worker accepts: the size its compressed
# source declares it expands to (default 256m, below 4g; k/m/g = KiB/MiB/GiB).
# Raising it also raises this port's frame cap for the verbs the session cap
# governs -- compile, store, fetch, shared-store, shared-fetch -- and no other;
# lowering it leaves that cap at the cache's 256m. A larger translation unit is
# refused payload-too-large and compiled locally.
# Read at startup only.
#compile_request_max:

# the bytes every compile running here may hold at once, each charged its whole
# request until it answers; k/m/g = KiB/MiB/GiB. Default: 64m per slot, never
# below 256m nor below compile_request_max. Full, a compile is refused
# endpoint-busy and runs on the client. Above 256m it also sizes this port's
# one pool of bytes being read, which cache and shared-cache reads share, so a
# large value loosens that bound too. A value below the larger of
# compile_request_max and 256m (the listener's frame cap) is refused at startup.
# Read at startup only.
#compile_inflight_max:

# compile slots this MACHINE shares between every compile on it, local ones
# included, as the fleet's queue counts them. Default: its logical cores. Not
# slots, which sizes the worker and is 0 on a node with none: this is reported
# whether or not a worker runs. Read at startup only.
#machine_slots:

# the memory the fleet's queue may have this machine's compiles hold at once,
# local ones included; k/m/g = KiB/MiB/GiB or N% of host RAM. Default: 75% of
# RAM less this node's cache tier, never below compile_estimate_default. A
# compile larger than the whole budget runs alone rather than never. Read at
# startup only.
#machine_memory_budget:

# what a translation unit nobody has measured is assumed to need (default 2g;
# k/m/g = KiB/MiB/GiB). Too low is the out-of-memory kill the queue exists to
# prevent; too high is a compile waiting longer than it must until its first
# measurement. Read at startup only.
#compile_estimate_default:

# cores never offered to the fleet, overriding what the node class reserves.
# 0 is a real answer and is not the same as omitting the flag. Ignored when
# --slots names a number, which is the operator's answer already.
#reserve_cores:

# this node's identity in the cluster, and what every vote is counted
# against. An OVERRIDE: a node with a consensus port mints one into
# --cluster-dir on its first start and reads it back forever, so this is only
# needed for a fleet already named by hand. Its mode, kept in --cluster-dir,
# decides whether it runs consensus; this names the node that runs it.
#node_id:

# where peers reach this node's consensus port; default 6680. The mode kept in
# --cluster-dir decides whether the node runs consensus, and every mode but a
# learner's opens this port: a node with no settings is a cluster of one, and an
# empty value closes the port and runs none -- on a cache-only node (slots: 0)
# alone: a worker with
# no consensus never joins a fleet, so it would register nowhere and is refused
# at startup. A bare port binds the WILDCARD: peers are on other
# machines by definition, so loopback would silently not work.
#listen_raft: 6680

# the host this node's peers dial it at; the port comes from --listen-raft.
# Defaults to auto: the address this machine routes from, re-derived when the
# network changes, and its fully qualified name until a route is known. A
# literal IP pins it and turns that roaming off. Reloadable. How a node names
# ITSELF: its identity is minted, never typed, and no other setting says where
# its peers reach it. A bare --listen-raft binds the wildcard, so what this
# node binds is usually not what a peer can dial.
#
# Which cluster this node is in, and whether it founded it or joined one, is
# not a setting: the first start mints a cluster of one into the state
# directory below, and joining a fleet is an admission recorded there.
#raft_self:

# this node's state directory: its identity key, its id, and where consensus
# keeps its durable state. A node that answered a vote and forgot it votes
# twice in one term after a restart, which is two leaders; a node that lost it
# is a new identity. Every node keeps one: the identity key kept here is what
# it proves on every connection to its scheduler and its peers. The cluster
# admits the key once, when an operator approves the machine's enrollment
# (--enroll-approve) or names it in --cluster-admit.
#
# Unless given: the machine's directory for a privileged process or a service
# -- %ProgramData%\pace-node, /var/lib/pace-node or
# /Library/Application Support/pace-node -- and the account's own for a
# node started by hand (%LOCALAPPDATA%\pace-node, or
# ~/.local/state/pace-node). On Linux the packaged service creates and owns
# /var/lib/pace-node (systemd StateDirectory=) and is handed it;
# --print-surfaces and --node-status name which one a node chose, and why.
#cluster_dir: /var/lib/pace-node

# announce this node on the segment and listen for peers here. Unless given,
# beacons go to every up interface's directed broadcast on port 6681, VPN-type
# adapters included. A named value names ONE address and nothing else: beacons
# go there exactly, and to no other link. Name your LAN's directed broadcast,
# as below, never 255.255.255.255 -- the limited broadcast leaves by one
# interface the stack guesses, which can be a VPN adapter no LAN peer hears.
# Empty turns it off. Runs beside consensus only. A peer counts only when it
# proves the key the cluster holds for it, and joins as a learner, counted by
# no quorum; --cluster-admit promotes it. Any other key is reported, never
# admitted.
#discovery: 192.168.1.255:6681

# port peers unicast their discovery challenges and proofs to; kernel-chosen
# unless given. NOT the --discovery port: that one is shared by every node
# on the segment, and only one socket sharing a port is handed a unicast.
# Pin it where a host firewall opens named ports only -- one per node on the
# machine.
#discovery_reply_port:

# a machine in the fleet to ask, across a VPN where no beacon reaches;
# repeatable. A name or name:port (the node port, 6674, when none). Tried
# after the fleet this node remembers and before DNS SRV
# _pace._tcp.<domain>. Asked only while this node is alone; a fleet it
# finds is joined by approval.
#fleet_seed:
#  - <host>
#  - <host>:<port>

# the ONE fleet this node may belong to, and the voters whose key it takes
# that fleet's word from: paste the fleet-id `pacectl node` prints on a
# machine of that fleet (<cluster-id>@<key>[,<key>...]). Without it discovery
# is trust-on-first-use: anybody on the segment can prove an older fleet and
# be joined. Pinned, the node joins no other fleet, and on its way in takes
# no summary, answer or leader its fleet's pinned voters did not sign; once
# joined, the fleet's agreed state decides. An id with no key is refused:
# every beacon carries the id.
#fleet_id:

# serve /metrics and /healthz here; off unless given. A bare port binds
# loopback: a scrape endpoint on a public interface is an operator's
# decision, not a default. /healthz is also the liveness probe this worker
# otherwise has none of.
#admin_listen:

# also serve the fleet dashboard on --admin-listen, at /fleet and
# /fleet.json. Off unless given: the page is a map of every member's
# hostname, endpoint and capacity. Answered in full only while this node
# LEADS; anyone else names the leader rather than showing half a fleet.
#dashboard: false

# credential the dashboard requires, as Basic or Bearer. A FILE and not a
# flag: a command line is readable through ps. Its own secret rather than
# --requirepass, which every member of the fleet already holds. Required
# when --admin-listen is not on loopback.
#dashboard_token_file:

# generate a self-signed certificate at startup and serve the admin surface
# over HTTPS with it, so an internal deployment needs no certificate to
# obtain. Encrypts the traffic; it does NOT prove which node answered, so
# the fingerprint is logged for you to compare. Regenerated every restart --
# name --tls-cert for a stable identity.
#tls_self_signed: false

# serve the admin surface over HTTPS with this certificate. TLS is on by
# naming a certificate and a key rather than by a flag, so there is no way
# to ask for it without the material to do it.
#tls_cert:

# private key for --tls-cert. Both or neither.
#tls_key:

# admit every caller to this node, keyed or not. For one machine, or a
# network that is already the boundary. A revoked key is refused even here.
# Without it this node admits its own machine and the machines the roster
# admits by key or ticket, whatever address they dial from.
#
# Reloadable, with an asymmetry: turning it on widens, turning it off
# narrows, and narrowing is the half nothing would otherwise report.
# Removing this key -- or setting it to false, which is the same thing,
# since the key spells a flag -- and reloading closes the node to every
# caller the roster does not admit.
#
#fleet_open: false

# size of this node's own in-memory cache tier; k/m/g = KiB/MiB/GiB or N% of
# host RAM. Defaults to 25% of RAM within [512m, 8g]; 0 turns it off. It
# exists so a local rebuild on a slow or bad network never reaches the wire
# at all.
#cache_memory:

# cap this node's on-disk cache tier at this size (default 0, meaning grow
# as needed): what the store occupies on disk, compressed values at their
# compressed size, so compression makes it hold more. Only means anything with
# --cache-dir: without a path there is no disk tier for a budget to bound.
#cache_disk:

# cap the shared tier this node serves when the fleet's shared-cache setting
# names it (default 64g; 0 grows as needed). Kept under
# <state-dir>/shared-cache, in this node's state directory.
#shared_cache_disk:

# back the local cache tier with disk at this path. Memory-only otherwise: a
# disk tier is a resource an operator should have to name. ONE node per
# path, enforced: the store is claimed exclusively, so a second node sharing
# it refuses to start.
#
# Under the packaged Linux service, cache_dir: /var/cache/pace-node. The
# unit creates it for the service account (CacheDirectory=); ProtectSystem=strict
# leaves nothing else persistent writable but the state directory, and that is
# not a place for it -- the node refuses to start beside an entry there it did
# not write.
#cache_dir:

# on-disk value codec for cache_dir: none, lz4 or zstd (default zstd). Reads
# always return plaintext and each record carries its own codec tag, so this
# can be changed between runs with no migration -- only later writes follow
# the new setting.
#compression:

# codec effort level for compression (1..22; default 3, zstd).
#compression_level:

# skip on-disk compression for values smaller than this; k/m/g accepted
# (default 256). Below it the CPU rarely pays for itself and a codec can make
# a small record larger.
#compression_min_bytes:

# in-memory value codec for cache_memory: none, lz4 or zstd. Default none,
# which keeps reads allocation-free. Independent of compression, which is the
# on-disk one. The memory budget counts COMPRESSED bytes, so a codec makes
# cache_memory hold materially more -- compile-cache objects with debug info
# compress well -- at the cost of a decompress on every read.
#memory_compression:

# codec effort level for memory_compression (1..22; default 3, zstd).
#memory_compression_level:

# keep in-memory values smaller than this uncompressed; k/m/g accepted
# (default 4096). Higher than the on-disk floor on purpose: an in-memory read
# pays the decompress on every hit, where a disk read has already paid for the
# I/O it saves.
#memory_compression_min_bytes:

# this node's 0xFC port, and its only one: the cache verbs, the compile
# verbs a scheduler dispatches here, and the scheduler verbs themselves where
# the node's mode serves them (default port 6674, where pace-cc already looks;
# empty closes it). Binds the wildcard unless given, because every node is a
# fleet participant. That admits nobody new to the CACHE: those verbs answer
# this machine alone whatever this is bound to, and the compile verbs answer
# the machines the roster admits by key or ticket -- and every caller under
# fleet_open.
#listen_node: 0.0.0.0:6674

# the shared pace-kv this node reads through to. Empty is honest rather
# than broken: one developer's machine has no shared cache.
#upstream:

# the password presented to the --upstream pace-kv, and to nothing else:
# a scheduler admits this machine by its node proof and checks no password.
# THIS is where it belongs: a
# supervisor records launch arguments where every local account can read
# them, so --install-service refuses the flag outright and registers
# --config=<path> instead. A file carrying a token should be readable only
# by the account the service runs as -- 0640 root:pace-node -- and the
# worker WARNS at startup and at every accepted reload when it is not.
#
# Reloadable, which is what a fleet-wide rotation needs: edit this key and
# reload, and the next exchange with the shared cache presents the new
# secret. Rotate the peers first or at the same time -- a
# worker presenting the new secret to a peer that has not moved is refused,
# visibly, which is the direction to fail in.
#
# It cannot be rotated this way on a worker whose COMMAND LINE names
# --requirepass: the command line wins over this file at a reload exactly as
# it does at a start, so the file's value would never be in force.
#requirepass:

# trace, debug, info, warn, error, fatal (default info)
#log_level:

# prefix every log line with an ISO 8601 UTC timestamp
#
# Default: ON under macOS, off elsewhere. The reason is the sink, not the
# platform's taste -- launchd sends a service's output straight to a plain file
# that nothing stamps, while journald stamps every line on Linux and a Windows
# service writes to the event log instead. So this key is what you reach for on
# Linux when the log is going somewhere journald is not: a foreground run, a
# redirected file, a CI artefact.
#
# Each key spells its flag, so `true` passes it and `false` passes nothing, which
# leaves the platform default. To turn timestamps ON set `log_timestamps: true`;
# to turn them OFF -- including on macOS -- set `no_log_timestamps: true`.
#log_timestamps: false
#no_log_timestamps: false

# write the pid here when daemonizing (POSIX)
#pidfile:
